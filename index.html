<style>
  /* ============ TOKENS ============ */
  :root {
    color-scheme: light;
    --wine:#7A1F3D; --wine-soft:#F2E4E9; --wine-line:#D9BCC6;
    --ground:#F5F2F2; --surface:#FFFFFF; --surface-2:#FAF8F8;
    --ink:#1B1518; --ink-2:#574B50; --ink-3:#8A7C81;
    --line:#E2DBDD; --line-strong:#CFC5C8;
    --crit:#A81E17; --crit-bg:#FAE7E5;
    --warn:#8A5A00; --warn-bg:#FAF0DC;
    --calm:#1B6248; --calm-bg:#E3F1EB;
    --info:#2A4C7D; --info-bg:#E7EDF6;
    --on-wine:#FFFFFF;
    --font-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --font-mono:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",ui-monospace,Menlo,monospace;
    --r:3px;
    --shadow:0 1px 2px rgba(27,21,24,.05), 0 6px 20px -12px rgba(27,21,24,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --wine:#E58AA6; --wine-soft:#35181F; --wine-line:#5A2D39;
      --ground:#141013; --surface:#1D181B; --surface-2:#241E21;
      --ink:#F2ECEE; --ink-2:#B9ACB1; --ink-3:#8A7B81;
      --line:#322A2E; --line-strong:#4A3F44;
      --crit:#FF9C93; --crit-bg:#3A1815;
      --warn:#E8B860; --warn-bg:#33260E;
      --calm:#7FCFAE; --calm-bg:#12281F;
      --info:#9CBBE8; --info-bg:#16233A;
      --on-wine:#2A1218;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px -12px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --wine:#E58AA6; --wine-soft:#35181F; --wine-line:#5A2D39;
    --ground:#141013; --surface:#1D181B; --surface-2:#241E21;
    --ink:#F2ECEE; --ink-2:#B9ACB1; --ink-3:#8A7B81;
    --line:#322A2E; --line-strong:#4A3F44;
    --crit:#FF9C93; --crit-bg:#3A1815; --warn:#E8B860; --warn-bg:#33260E;
    --calm:#7FCFAE; --calm-bg:#12281F; --info:#9CBBE8; --info-bg:#16233A;
    --on-wine:#2A1218;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px -12px rgba(0,0,0,.7);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --wine:#7A1F3D; --wine-soft:#F2E4E9; --wine-line:#D9BCC6;
    --ground:#F5F2F2; --surface:#FFFFFF; --surface-2:#FAF8F8;
    --ink:#1B1518; --ink-2:#574B50; --ink-3:#8A7C81;
    --line:#E2DBDD; --line-strong:#CFC5C8;
    --crit:#A81E17; --crit-bg:#FAE7E5; --warn:#8A5A00; --warn-bg:#FAF0DC;
    --calm:#1B6248; --calm-bg:#E3F1EB; --info:#2A4C7D; --info-bg:#E7EDF6;
    --on-wine:#FFFFFF;
    --shadow:0 1px 2px rgba(27,21,24,.05), 0 6px 20px -12px rgba(27,21,24,.18);
  }

  /* ============ BASE ============ */
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--font-ui); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible { outline:2px solid var(--wine); outline-offset:2px; border-radius:2px; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
  .eyebrow {
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.13em;
    text-transform:uppercase; color:var(--ink-3); font-weight:600;
  }
  .shell { max-width:1240px; margin:0 auto; padding:0 20px 72px; }

  /* ============ MODO MAPA ============ */
  .mapbtn {
    font:inherit; font-size:12px; font-family:var(--font-mono);
    letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
    background:transparent; color:var(--ink-3);
    border:1px solid var(--line-strong); border-radius:2px; padding:4px 9px;
  }
  .mapbtn:hover { border-color:var(--wine); color:var(--wine); }
  .mapbtn[aria-pressed="true"] { background:var(--wine); border-color:var(--wine); color:var(--on-wine); }
  .mapaviso {
    display:none; background:var(--wine-soft); border-bottom:1px solid var(--wine-line);
    font-size:12.5px; color:var(--ink);
  }
  .mapaviso > div { max-width:1240px; margin:0 auto; padding:9px 20px; }
  .mapaviso code { font-family:var(--font-mono); font-size:11.5px; background:var(--surface); border:1px solid var(--wine-line); border-radius:2px; padding:1px 5px; }
  body.mapa .mapaviso { display:block; }

  body.mapa [data-src] {
    position:relative;
    outline:1px dashed var(--wine); outline-offset:5px;
  }
  body.mapa [data-src]::before {
    content:attr(data-src);
    position:absolute; top:-11px; left:-1px;
    font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:.05em;
    background:var(--wine); color:var(--on-wine);
    padding:1px 5px; border-radius:2px; line-height:1.5;
    z-index:6; pointer-events:none; white-space:nowrap;
  }
  body.mapa main { gap:36px; }
  body.mapa .rcol { gap:28px; }
  body.mapa .panel-b { gap:24px; }
  body.mapa .flow { gap:18px; }

  /* ============ TOPBAR ============ */
  .topbar { border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:30; }
  .topbar-in { max-width:1240px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .brand { display:flex; align-items:baseline; gap:10px; }
  .brand-mark {
    font-family:var(--font-mono); font-size:12px; font-weight:700;
    color:var(--on-wine); background:var(--wine);
    padding:3px 7px; border-radius:2px; letter-spacing:.04em;
  }
  h1 { font-size:17px; font-weight:650; margin:0; letter-spacing:-.01em; }
  .topbar .sub { color:var(--ink-3); font-size:13px; margin-left:auto; }

  /* ============ SPINE ============ */
  .spine { background:var(--surface-2); border-bottom:1px solid var(--line); }
  .spine-in { max-width:1240px; margin:0 auto; padding:11px 20px; display:flex; overflow-x:auto; }
  .mo {
    display:flex; align-items:baseline; gap:7px; padding:4px 15px 4px 0; margin-right:15px;
    border-right:1px solid var(--line); white-space:nowrap; flex:0 0 auto;
  }
  .mo:last-child { border-right:0; margin-right:0; }
  .mo-n {
    font-family:var(--font-mono); font-size:10px; font-weight:700; color:var(--ink-3);
    border:1px solid var(--line-strong); width:17px; height:17px;
    display:inline-grid; place-items:center; border-radius:50%; flex:0 0 auto;
  }
  .mo-t { font-size:12.5px; color:var(--ink-3); }
  .mo.on .mo-n { color:var(--on-wine); background:var(--wine); border-color:var(--wine); }
  .mo.on .mo-t { color:var(--ink); font-weight:600; }
  .mo.ok .mo-n { color:var(--calm); background:var(--calm-bg); border-color:color-mix(in srgb, var(--calm) 40%, transparent); }
  .mo.ok .mo-t { color:var(--ink-2); }

  /* ============ LAYOUT ============ */
  .grid { display:grid; grid-template-columns:268px minmax(0,1fr); gap:26px; padding-top:24px; align-items:start; }
  @media (max-width:900px) { .grid { grid-template-columns:1fr; gap:18px; } }
  .rail { position:sticky; top:24px; display:flex; flex-direction:column; gap:14px; }
  @media (max-width:900px) { .rail { position:static; } }
  main { display:flex; flex-direction:column; gap:22px; min-width:0; }

  .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); }
  .panel-h { padding:12px 14px 0; }
  .panel-b { padding:11px 14px 14px; display:flex; flex-direction:column; gap:13px; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field > label { font-size:12.5px; color:var(--ink-2); font-weight:600; }
  .field .hint { font-size:11.5px; color:var(--ink-3); line-height:1.4; }

  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip {
    font:inherit; font-size:12.5px; cursor:pointer;
    background:var(--surface-2); color:var(--ink-2);
    border:1px solid var(--line-strong); border-radius:2px; padding:5px 9px;
    transition:background .12s, color .12s, border-color .12s;
  }
  .chip:hover { border-color:var(--wine); color:var(--ink); }
  .chip[aria-pressed="true"] { background:var(--wine); border-color:var(--wine); color:var(--on-wine); font-weight:600; }

  .search input {
    width:100%; font:inherit; font-size:13px; padding:8px 10px;
    background:var(--surface-2); color:var(--ink);
    border:1px solid var(--line-strong); border-radius:2px;
  }
  .search input::placeholder { color:var(--ink-3); }
  .results { list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:3px; max-height:300px; overflow-y:auto; }
  .results li button {
    width:100%; text-align:left; font:inherit; font-size:12.5px; cursor:pointer;
    background:transparent; border:1px solid transparent; border-radius:2px;
    padding:6px 8px; color:var(--ink); line-height:1.35;
  }
  .results li button:hover { background:var(--wine-soft); border-color:var(--wine-line); }
  .rmod { display:block; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-top:2px; }
  .nores { font-size:12px; color:var(--ink-3); padding:6px 2px; display:block; }

  /* ============ ETAPAS SEQUENCIAIS ============ */
  .flow { display:flex; flex-direction:column; gap:8px; }
  .stage {
    background:var(--surface); border:1px solid var(--line);
    border-left:3px solid var(--line-strong); border-radius:var(--r);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .stage.is-active { border-left-color:var(--wine); border-color:var(--wine-line); }
  .stage.is-done { border-left-color:var(--calm); box-shadow:none; background:var(--surface-2); }
  .stage.is-locked { opacity:.5; box-shadow:none; background:var(--surface-2); }

  .st-head { display:flex; align-items:center; gap:11px; padding:12px 15px; width:100%; text-align:left; }
  button.st-head { font:inherit; background:transparent; border:0; cursor:pointer; color:inherit; }
  button.st-head:hover .st-title { color:var(--wine); }
  .st-n {
    font-family:var(--font-mono); font-size:11px; font-weight:700;
    width:22px; height:22px; flex:0 0 auto; display:grid; place-items:center;
    border-radius:2px; border:1px solid var(--line-strong); color:var(--ink-3); background:var(--surface);
  }
  .stage.is-active .st-n { background:var(--wine); border-color:var(--wine); color:var(--on-wine); }
  .stage.is-done .st-n { background:var(--calm-bg); border-color:color-mix(in srgb, var(--calm) 40%, transparent); color:var(--calm); }
  .st-title { font-size:14.5px; font-weight:650; letter-spacing:-.005em; }
  .st-sub { font-size:12.5px; color:var(--ink-3); margin-left:auto; text-align:right; }

  .st-body { padding:0 15px 15px 48px; display:flex; flex-direction:column; gap:14px; }
  .st-body > .lead { margin:0; font-size:13.5px; color:var(--ink-2); max-width:70ch; }

  .checklist { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .checklist li { display:flex; gap:9px; font-size:13.5px; color:var(--ink-2); line-height:1.5; }
  .checklist li::before {
    content:""; flex:0 0 auto; width:13px; height:13px; margin-top:4px;
    border:1px solid var(--line-strong); border-radius:2px; background:var(--surface);
  }
  .checklist li strong { color:var(--ink); font-weight:600; }

  .callout { border:1px solid; border-radius:var(--r); padding:10px 12px; display:flex; flex-direction:column; gap:5px; }
  .callout .ch { font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; }
  .callout p { margin:0; font-size:13px; line-height:1.45; }
  .callout ul { margin:0; padding-left:15px; font-size:12.5px; color:var(--ink-2); display:flex; flex-direction:column; gap:3px; }
  .c-mode { background:var(--wine-soft); border-color:var(--wine-line); }
  .c-mode .ch { color:var(--wine); }
  .c-mode p { color:var(--ink); }
  .c-stop { background:var(--crit-bg); border-color:color-mix(in srgb, var(--crit) 30%, transparent); }
  .c-stop .ch { color:var(--crit); }
  .c-say { background:var(--info-bg); border-color:color-mix(in srgb, var(--info) 28%, transparent); }
  .c-say .ch { color:var(--info); }
  .c-say p { color:var(--ink); font-style:italic; }

  .advance { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .btn {
    font:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
    background:var(--wine); color:var(--on-wine); border:1px solid var(--wine);
    border-radius:2px; padding:7px 14px; display:inline-flex; align-items:center; gap:7px;
  }
  .btn:hover { filter:brightness(1.08); }
  .btn.ghost { background:transparent; color:var(--ink-2); border-color:var(--line-strong); font-weight:500; }
  .btn.ghost:hover { border-color:var(--wine); color:var(--wine); filter:none; }
  .btn.sm { font-size:12.5px; padding:5px 10px; }
  .advance .why { font-size:12px; color:var(--ink-3); }

  /* ============ CARDS DOS EIXOS ============ */
  .step { display:flex; flex-direction:column; gap:10px; }
  .step-h { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .step-h h2 { font-size:15px; font-weight:650; margin:0; letter-spacing:-.005em; }
  .step-h .note { font-size:12.5px; color:var(--ink-3); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(168px,1fr)); gap:8px; }
  .card {
    font:inherit; text-align:left; cursor:pointer;
    background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--line-strong);
    border-radius:var(--r); padding:10px 12px; display:flex; flex-direction:column; gap:3px;
    transition:border-color .12s, transform .12s, box-shadow .12s;
  }
  .card:hover { border-left-color:var(--wine); transform:translateY(-1px); box-shadow:var(--shadow); }
  .card[aria-pressed="true"] { border-color:var(--wine-line); border-left-color:var(--wine); background:var(--wine-soft); }
  .card .cn { font-size:14px; font-weight:600; color:var(--ink); }
  .card .cd { font-size:11.5px; color:var(--ink-3); line-height:1.35; }
  .card .ct { font-family:var(--font-mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); }

  /* ============ RESULTADO ============ */
  .result { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; }
  .rhead { padding:15px 18px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:9px; }
  .rtitle { font-size:19px; font-weight:650; margin:0; letter-spacing:-.015em; text-wrap:balance; }
  .rtitle .sep { color:var(--ink-3); font-weight:400; }
  .rprazo { margin:0; font-size:13px; color:var(--ink-2); }
  .pills { display:flex; flex-wrap:wrap; gap:6px; }
  .pill {
    font-family:var(--font-mono); font-size:10.5px; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase; padding:3px 8px;
    border-radius:2px; border:1px solid; display:inline-flex; align-items:center; gap:5px;
  }
  .p-crit { color:var(--crit); background:var(--crit-bg); border-color:color-mix(in srgb, var(--crit) 35%, transparent); }
  .p-warn { color:var(--warn); background:var(--warn-bg); border-color:color-mix(in srgb, var(--warn) 35%, transparent); }
  .p-calm { color:var(--calm); background:var(--calm-bg); border-color:color-mix(in srgb, var(--calm) 35%, transparent); }
  .p-info { color:var(--info); background:var(--info-bg); border-color:color-mix(in srgb, var(--info) 35%, transparent); }
  .p-line { color:var(--ink-2); background:var(--surface-2); border-color:var(--line-strong); }

  .rbody { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); }
  @media (max-width:780px) { .rbody { grid-template-columns:1fr; } }
  .rcol { padding:16px 18px; display:flex; flex-direction:column; gap:18px; }
  .rcol + .rcol { border-left:1px solid var(--line); background:var(--surface-2); }
  @media (max-width:780px) { .rcol + .rcol { border-left:0; border-top:1px solid var(--line); } }

  .block { display:flex; flex-direction:column; gap:7px; }
  .block > h3 { font-size:13px; font-weight:650; margin:0; color:var(--ink); }
  .block > p.txt { margin:0; font-size:13px; color:var(--ink-2); }
  .steps { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; counter-reset:s; }
  .steps li { display:flex; gap:9px; font-size:13.5px; color:var(--ink-2); line-height:1.5; counter-increment:s; }
  .steps li::before {
    content:counter(s); flex:0 0 auto;
    font-family:var(--font-mono); font-size:10px; font-weight:700; color:var(--wine);
    background:var(--wine-soft); border:1px solid var(--wine-line);
    width:18px; height:18px; display:grid; place-items:center; border-radius:2px; margin-top:2px;
  }
  .steps li strong { color:var(--ink); font-weight:600; }
  .bul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; }
  .bul li { font-size:13px; color:var(--ink-2); padding-left:13px; position:relative; line-height:1.45; }
  .bul li::before { content:""; position:absolute; left:0; top:8px; width:5px; height:1px; background:var(--line-strong); }
  .bul li strong { color:var(--ink); font-weight:600; }

  .kv { display:flex; flex-direction:column; gap:8px; }
  .kv-row { display:grid; grid-template-columns:82px minmax(0,1fr); gap:10px; align-items:baseline; }
  .kv-k { font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }
  .kv-v { font-size:13px; color:var(--ink); }

  .doclist { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .doclist a {
    display:block; font-size:12.5px; color:var(--ink-2); text-decoration:none;
    padding:4px 7px; border-radius:2px; border:1px solid transparent; line-height:1.35;
  }
  .doclist a:hover { color:var(--wine); background:var(--wine-soft); border-color:var(--wine-line); text-decoration:underline; text-underline-offset:2px; }
  .doclist a::before { content:"↗ "; color:var(--ink-3); font-size:11px; }

  .cases { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .case { border:1px solid var(--line); border-radius:var(--r); background:var(--surface); padding:9px 11px; display:flex; flex-direction:column; gap:4px; }
  .case-s { font-size:13px; font-weight:600; color:var(--ink); }
  .case-c { font-size:12.5px; color:var(--ink-2); line-height:1.45; }
  .case-c em { color:var(--ink-3); font-style:normal; font-family:var(--font-mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; }
  .case a { font-size:12px; color:var(--wine); text-decoration:none; }
  .case a:hover { text-decoration:underline; text-underline-offset:2px; }

  .tags { display:flex; flex-wrap:wrap; gap:4px; }
  .tag { font-family:var(--font-mono); font-size:11px; color:var(--ink-2); background:var(--ground); border:1px solid var(--line); border-radius:2px; padding:2px 6px; }
  .microhint { font-size:11.5px; color:var(--ink-3); line-height:1.4; }

  /* ============ FUP ============ */
  .fup { display:flex; flex-direction:column; gap:0; }
  .fnode { border:1px solid var(--line); border-left:3px solid var(--line-strong); border-radius:var(--r); background:var(--surface); padding:12px 14px; display:flex; flex-direction:column; gap:9px; }
  .fnode.on { border-left-color:var(--wine); border-color:var(--wine-line); }
  .fnode.spent { opacity:.55; }
  .fnode-h { display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
  .fnode-h .ft { font-size:14px; font-weight:650; }
  .fnode-h .fw { font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); }
  .branches { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:7px; }
  .branch { border:1px solid var(--line); border-radius:var(--r); background:var(--surface-2); padding:9px 11px; display:flex; flex-direction:column; gap:6px; }
  .branch .bl { font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }
  .branch .bt { font-size:13px; color:var(--ink-2); line-height:1.45; }
  .branch .bt strong { color:var(--ink); font-weight:600; }
  .branch.yes { border-color:color-mix(in srgb, var(--calm) 30%, transparent); background:var(--calm-bg); }
  .branch.yes .bl { color:var(--calm); }
  .branch.no { border-color:color-mix(in srgb, var(--warn) 30%, transparent); background:var(--warn-bg); }
  .branch.no .bl { color:var(--warn); }
  .fconn { align-self:center; color:var(--line-strong); font-size:15px; line-height:1; padding:5px 0; }
  .clock { font-family:var(--font-mono); font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink); background:var(--surface); border:1px solid var(--line-strong); border-radius:2px; padding:2px 7px; display:inline-block; }

  /* ============ LOCK / EMPTY ============ */
  .lock { border:1px dashed var(--line-strong); border-radius:var(--r); padding:22px 20px; background:var(--surface-2); display:flex; flex-direction:column; gap:11px; align-items:flex-start; }
  .lock p { margin:0; font-size:13.5px; color:var(--ink-2); max-width:64ch; }
  .lock ol { margin:0; padding-left:18px; font-size:13px; color:var(--ink-3); display:flex; flex-direction:column; gap:3px; }
  .lock code { font-family:var(--font-mono); font-size:11.5px; }
  .empty { border:1px dashed var(--line-strong); border-radius:var(--r); padding:26px 20px; text-align:center; color:var(--ink-3); font-size:13.5px; background:var(--surface-2); }

  .foot { margin-top:30px; padding-top:16px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:9px; align-items:flex-start; }
  .foot p { margin:0; font-size:12px; color:var(--ink-3); line-height:1.5; max-width:70ch; }
  .foot strong { color:var(--ink-2); }
</style>

<script src="conteudo.js"></script>
<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════════════
   MOTOR — lê tudo de conteudo.js. Não precisa editar nada aqui.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ---------- estado ---------- */
const state = {
  tempo:"rampa", oper:"nao",
  feito:{ ia:false, problema:false, ticket:false },
  aberta:"ia",
  pulou:false,
  mapa:false,
  cat:null, mod:null,
  fup:"pendente",
  fup2_em:null,
  fup2_limite:null
};

/* ---------- helpers ---------- */
const el = (t,c,h) => { const n = document.createElement(t); if (c) n.className = c; if (h !== undefined) n.innerHTML = h; return n; };
const src = (n,s) => { n.setAttribute("data-src", s); return n; };
const cat = id => CATEGORIAS.find(c => c.id === id);
const mod = id => MODULOS.find(m => m.id === id);
const portoesOk = () => state.feito.ia && state.feito.problema && state.feito.ticket;
const hhmm = d => String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");

/* troca {espera}, {limite}, {total} e {falta} pelos valores reais */
function fmt(s, extra) {
  const v = Object.assign({
    espera: FUP.esperaHoras,
    limite: FUP.limiteHoras,
    total: FUP.esperaHoras + FUP.limiteHoras
  }, extra || {});
  return String(s).replace(/\{(\w+)\}/g, (m,k) => (k in v ? v[k] : m));
}

function etapaAtual() {
  if (!portoesOk()) {
    if (!state.feito.ia) return 1;
    if (!state.feito.problema) return 2;
    return 3;
  }
  if (!state.cat || !state.mod) return 4;
  if (state.fup === "pendente") return 5;
  return 6;
}

/* ---------- textos fixos da moldura ---------- */
function renderMoldura() {
  document.getElementById("t-marca").textContent = TEXTOS.marca;
  document.getElementById("t-titulo").textContent = TEXTOS.titulo;
  document.getElementById("t-sub").textContent = TEXTOS.subtitulo;
  document.getElementById("t-rail-contexto").textContent = TEXTOS.railContexto;
  document.getElementById("t-tempo-label").textContent = TEXTOS.railTempoLabel;
  document.getElementById("t-tempo-hint").textContent = TEXTOS.railTempoHint;
  document.getElementById("t-oper-label").textContent = TEXTOS.railOperLabel;
  document.getElementById("t-oper-hint").textContent = TEXTOS.railOperHint;
  document.getElementById("t-rail-busca").textContent = TEXTOS.railBusca;
  document.getElementById("q").placeholder = TEXTOS.buscaPlaceholder;
  document.getElementById("q").setAttribute("aria-label", TEXTOS.railBusca);
  document.getElementById("reset").textContent = TEXTOS.rodapeBotao;
  document.getElementById("t-rodape").innerHTML = TEXTOS.rodapeAviso;

  const bm = document.getElementById("btn-mapa");
  bm.textContent = TEXTOS.botaoMapa;
  bm.setAttribute("aria-pressed", String(state.mapa));
  document.body.classList.toggle("mapa", state.mapa);

  src(document.getElementById("f-tempo"), "■ 4 TEMPOS");
  src(document.getElementById("f-oper"), "■ 5 OPER");
}

/* ---------- trilha do topo ---------- */
function renderSpine() {
  const atual = etapaAtual(), host = document.getElementById("spine");
  host.textContent = "";
  ETAPAS.forEach((t,i) => {
    const n = i + 1;
    const node = el("div", n === atual ? "mo on" : (n < atual ? "mo ok" : "mo"));
    node.append(el("span","mo-n", n < atual ? "✓" : String(n)), el("span","mo-t", t));
    host.append(node);
  });
  src(host, "■ 2 ETAPAS");
}

/* ---------- painel esquerdo ---------- */
function renderChips() {
  const t = document.getElementById("chips-tempo");
  t.textContent = "";
  TEMPOS.forEach(o => {
    const b = el("button","chip",o.rot);
    b.type = "button";
    b.setAttribute("aria-pressed", String(state.tempo === o.id));
    b.onclick = () => { state.tempo = o.id; render(); };
    t.append(b);
  });
  const p = document.getElementById("chips-oper");
  p.textContent = "";
  OPER.forEach(o => {
    const b = el("button","chip",o.rot);
    b.type = "button";
    b.setAttribute("aria-pressed", String(state.oper === o.id));
    b.onclick = () => { state.oper = o.id; render(); };
    p.append(b);
  });
}

/* ---------- etapas 1 a 3 ---------- */
function renderFlow() {
  const host = document.getElementById("flow");
  host.textContent = "";

  PORTOES.forEach((p, i) => {
    const feito = state.feito[p.id];
    const anteriorOk = i === 0 || state.feito[PORTOES[i-1].id];
    const aberta = state.aberta === p.id && anteriorOk;
    const travada = !anteriorOk && !feito;

    const card = el("div", "stage " + (travada ? "is-locked" : feito && !aberta ? "is-done" : aberta ? "is-active" : ""));
    if (aberta) src(card, "■ 3 PORTOES");

    const head = el(anteriorOk ? "button" : "div", "st-head");
    if (anteriorOk) {
      head.type = "button";
      head.setAttribute("aria-expanded", String(aberta));
      head.onclick = () => { state.aberta = aberta ? null : p.id; render(); };
    }
    head.append(el("span","st-n", feito ? "✓" : String(i+1)));
    head.append(el("span","st-title", p.titulo));
    head.append(el("span","st-sub",
      travada ? TEXTOS.etapaAguardando + " " + i
      : feito && !aberta ? TEXTOS.etapaReabrir
      : feito ? TEXTOS.etapaConcluida
      : aberta ? "" : TEXTOS.etapaAbrir));
    card.append(head);

    if (aberta) {
      const body = el("div","st-body");
      body.append(el("p","lead", p.lead));

      const ul = el("ul","checklist");
      p.itens.forEach(x => ul.append(el("li","",x)));
      body.append(ul);

      const stop = el("div","callout c-stop");
      stop.append(el("span","ch", TEXTOS.etapaNaoFaca));
      const su = el("ul");
      p.nunca.forEach(x => su.append(el("li","",x)));
      stop.append(su);
      body.append(stop);

      const adv = el("div","advance");
      const b = el("button","btn", (feito ? "✓ " : "") + p.cta);
      b.type = "button";
      b.onclick = () => {
        state.feito[p.id] = true;
        const prox = PORTOES[i+1];
        state.aberta = prox && !state.feito[prox.id] ? prox.id : null;
        render();
        const alvo = document.getElementById(prox ? "flow" : "axes");
        if (alvo) alvo.scrollIntoView({ behavior:"smooth", block:"start" });
      };
      adv.append(b, el("span","why", p.why));
      body.append(adv);

      card.append(body);
    }

    host.append(card);
  });
}

/* ---------- etapa 4 ---------- */
function renderAxes() {
  const host = document.getElementById("axes");
  host.textContent = "";

  if (!portoesOk()) {
    const lock = src(el("div","lock"), "■ 10 bloqueio*");
    lock.append(el("span","eyebrow", TEXTOS.bloqueioEyebrow));
    lock.append(el("p","", TEXTOS.bloqueioTexto));
    const ol = el("ol");
    PORTOES.filter(p => !state.feito[p.id]).forEach(p => ol.append(el("li","",p.titulo)));
    lock.append(ol);
    const esc = el("button","btn ghost sm", TEXTOS.bloqueioBotao);
    esc.type = "button";
    esc.onclick = () => {
      state.feito.ia = state.feito.problema = state.feito.ticket = true;
      state.pulou = true; state.aberta = null;
      render();
      document.getElementById("axes").scrollIntoView({ behavior:"smooth", block:"start" });
    };
    lock.append(esc);
    lock.append(el("p","", '<span class="microhint">' + TEXTOS.bloqueioAviso + "</span>"));
    host.append(lock);
    return;
  }

  const wrapCat = src(el("section","step"), "■ 6 CATEGORIAS");
  const hc = el("div","step-h");
  hc.append(el("span","eyebrow", TEXTOS.eixo1Eyebrow), el("h2","", TEXTOS.eixo1Titulo), el("span","note", TEXTOS.eixo1Nota));
  wrapCat.append(hc);
  const gc = el("div","cards");
  CATEGORIAS.forEach(c => {
    const b = el("button","card");
    b.type = "button";
    b.setAttribute("aria-pressed", String(state.cat === c.id));
    b.append(el("span","ct",c.trilha), el("span","cn",c.nome), el("span","cd",c.desc));
    b.onclick = () => { state.cat = state.cat === c.id ? null : c.id; resetFup(); render(); };
    gc.append(b);
  });
  wrapCat.append(gc);
  host.append(wrapCat);

  const wrapMod = src(el("section","step"), "■ 7 MODULOS");
  wrapMod.style.marginTop = "22px";
  const hm = el("div","step-h");
  hm.append(el("span","eyebrow", TEXTOS.eixo2Eyebrow), el("h2","", TEXTOS.eixo2Titulo), el("span","note", TEXTOS.eixo2Nota));
  wrapMod.append(hm);
  const gm = el("div","cards");
  MODULOS.forEach(m => {
    const b = el("button","card");
    b.type = "button";
    b.setAttribute("aria-pressed", String(state.mod === m.id));
    b.append(el("span","ct",m.area), el("span","cn",m.nome));
    b.onclick = () => { state.mod = state.mod === m.id ? null : m.id; resetFup(); render(); };
    gm.append(b);
  });
  wrapMod.append(gm);
  host.append(wrapMod);
}

/* ---------- etapa 5 ---------- */
function renderOut() {
  const host = document.getElementById("out");
  host.textContent = "";
  if (!portoesOk()) return;

  if (!state.cat || !state.mod) {
    const falta = !state.cat && !state.mod ? "a natureza do ticket e o módulo"
                : !state.cat ? "a natureza do ticket" : "o módulo";
    host.append(el("div","empty", fmt(TEXTOS.eixoVazio, { falta })));
    return;
  }

  const c = cat(state.cat), m = mod(state.mod);
  const t = TEMPOS.find(x => x.id === state.tempo);
  const sevId = MATRIZ_SEV[state.oper][c.id];
  const s = SEV[sevId];
  const urgente = state.oper === "sim" && sevId === "P1" && t.id !== "novo";

  const wrap = el("div","result");

  const head = el("div","rhead");
  head.append(el("span","eyebrow", TEXTOS.resEyebrow));
  head.append(el("h2","rtitle", c.nome + ' <span class="sep">/</span> ' + m.nome));
  const pills = src(el("div","pills"), "■ 8 SEV");
  pills.append(
    el("span","pill " + s.cls, s.rot),
    el("span","pill p-info","Dono: " + c.dono),
    el("span","pill p-line","Trilha: " + c.trilha)
  );
  if (state.pulou) pills.append(el("span","pill p-crit", TEXTOS.resPulou));
  head.append(pills);
  head.append(el("p","rprazo", s.prazo));
  wrap.append(head);

  const body = el("div","rbody");

  /* ----- coluna esquerda ----- */
  const L = el("div","rcol");

  const mode = src(el("div","callout c-mode"), "■ 4 TEMPOS");
  mode.append(el("span","ch", TEXTOS.resModoLabel + " — " + (urgente ? TEXTOS.resModoUrgencia : t.rot)));
  mode.append(el("p","", "<strong>" + (urgente ? TEXTOS.resModoUrgenciaTitulo : t.modo) + ".</strong> " +
    (urgente ? TEXTOS.resModoUrgenciaTexto : t.txt)));
  L.append(mode);

  const fl = src(el("div","block"), "■ 6 fluxo");
  fl.append(el("h3","", TEXTOS.resSequencia));
  const ol = el("ol","steps");
  c.fluxo.forEach(p => ol.append(el("li","",p)));
  fl.append(ol);
  L.append(fl);

  if (m.casos.length) {
    const cs = src(el("div","block"), "■ 7 casos");
    cs.append(el("h3","", TEXTOS.resCasos + " " + m.nome));
    const ul = el("ul","cases");
    m.casos.slice().sort((a,b) => (b.cat === c.id) - (a.cat === c.id)).forEach(k => {
      const li = el("li","case");
      li.append(el("div","case-s",k.s));
      li.append(el("div","case-c", k.c + (k.cat !== c.id ? ' <em>· ' + TEXTOS.resCasoCostuma + " " + cat(k.cat).nome + "</em>" : "")));
      const a = el("a","", TEXTOS.resCasoLink);
      a.href = D + k.d; a.target = "_blank"; a.rel = "noopener";
      li.append(a);
      ul.append(li);
    });
    cs.append(ul);
    L.append(cs);
  }

  const exp = src(el("div","block"), "■ 10 resExplicarItens");
  exp.append(el("h3","", TEXTOS.resExplicarTitulo));
  const eul = el("ul","bul");
  TEXTOS.resExplicarItens.forEach(x => eul.append(el("li","",x)));
  exp.append(eul);
  L.append(exp);

  const stop = src(el("div","callout c-stop"), "■ 6 nunca");
  stop.append(el("span","ch", TEXTOS.resNaoFaca));
  const su = el("ul");
  c.nunca.forEach(x => su.append(el("li","",x)));
  stop.append(su);
  L.append(stop);

  body.append(L);

  /* ----- coluna direita ----- */
  const R = el("div","rcol");

  const ctx = src(el("div","block"), "■ 7 onde");
  ctx.append(el("h3","", TEXTOS.resOndeOlhar));
  ctx.append(el("p","txt", m.onde));
  R.append(ctx);

  const col = src(el("div","block"), "■ 7 coletar");
  col.append(el("h3","", TEXTOS.resColetar));
  const cu = el("ul","bul");
  m.coletar.forEach(x => cu.append(el("li","",x)));
  col.append(cu);
  R.append(col);

  const esc = src(el("div","block"), "■ 6 escalar");
  esc.append(el("h3","", TEXTOS.resEscalar));
  const eu = el("ul","bul");
  c.escalar.forEach(x => eu.append(el("li","",x)));
  esc.append(eu);
  R.append(esc);

  const dk = src(el("div","block"), "■ 7 docs");
  dk.append(el("h3","", TEXTOS.resDocs + " " + m.nome));
  const dl = el("ul","doclist");
  m.docs.forEach(d => {
    const li = el("li");
    const a = el("a","",d.t);
    a.href = D + d.u; a.target = "_blank"; a.rel = "noopener";
    li.append(a); dl.append(li);
  });
  dk.append(dl);
  R.append(dk);

  const tg = src(el("div","block"), "■ 6 tags");
  tg.append(el("h3","", TEXTOS.resTags));
  const tw = el("div","tags");
  const tags = [...c.tags, "modulo:" + m.id, "sev:" + sevId,
    "modo:" + (urgente ? "executado_urgencia" : t.id),
    "loja_em_operacao:" + state.oper];
  if (state.pulou) tags.push("etapas:puladas");
  tags.forEach(x => tw.append(el("span","tag",x)));
  tg.append(tw);
  tg.append(el("span","microhint", TEXTOS.resTagsHint));
  R.append(tg);

  body.append(R);
  wrap.append(body);
  host.append(wrap);
}

/* ---------- etapa 6 ---------- */
function resetFup() {
  state.fup = "pendente";
  state.fup2_em = null;
  state.fup2_limite = null;
}

function renderFup() {
  const host = document.getElementById("fup");
  host.textContent = "";
  if (!portoesOk() || !state.cat || !state.mod) return;

  const wrap = el("div","result");

  const head = el("div","rhead");
  head.append(el("span","eyebrow", TEXTOS.fupEyebrow));
  head.append(el("h2","rtitle", TEXTOS.fupTitulo));
  head.append(el("p","rprazo", TEXTOS.fupSubtitulo));
  wrap.append(head);

  const col = el("div","rcol");
  const arv = src(el("div","fup"), "■ 9 FUP");

  /* --- FUP 1 --- */
  const n1 = el("div","fnode" + (state.fup === "pendente" ? " on" : " spent"));
  const h1 = el("div","fnode-h");
  h1.append(el("span","ft", FUP.f1Nome), el("span","fw", fmt(FUP.f1Quando)));
  n1.append(h1);
  const say1 = el("div","callout c-say");
  say1.append(el("span","ch", TEXTOS.fupMandeAssim), el("p","", FUP.f1Mensagem));
  n1.append(say1);

  const br1 = el("div","branches");
  const b1y = el("div","branch yes");
  b1y.append(el("span","bl", FUP.f1SimTitulo), el("span","bt", fmt(FUP.f1SimTexto)));
  const b1n = el("div","branch no");
  b1n.append(el("span","bl", FUP.f1NaoTitulo), el("span","bt", fmt(FUP.f1NaoTexto)));
  br1.append(b1y, b1n);
  n1.append(br1);

  if (state.fup === "pendente") {
    const act = el("div","advance");
    const y = el("button","btn sm", FUP.botaoRespondeu);
    y.type = "button";
    y.onclick = () => { state.fup = "encerrado_confirmado"; render(); };
    const n = el("button","btn ghost sm", FUP.botaoSemResposta);
    n.type = "button";
    n.onclick = () => {
      const agora = new Date();
      state.fup2_em = new Date(agora.getTime() + FUP.esperaHoras*3600e3);
      state.fup2_limite = new Date(agora.getTime() + (FUP.esperaHoras + FUP.limiteHoras)*3600e3);
      state.fup = "fup1_sem_resposta";
      render();
    };
    act.append(y, n);
    n1.append(act);
  }
  arv.append(n1, el("div","fconn","↓"));

  /* --- FUP 2 --- */
  const ativo2 = state.fup === "fup1_sem_resposta";
  const n2 = el("div","fnode" + (ativo2 ? " on" : (state.fup === "pendente" ? "" : " spent")));
  const h2 = el("div","fnode-h");
  h2.append(el("span","ft", FUP.f2Nome), el("span","fw", fmt(FUP.f2Quando)));
  if (state.fup2_em) h2.append(el("span","clock", TEXTOS.fupEnviarAs + " " + hhmm(state.fup2_em)));
  n2.append(h2);
  const say2 = el("div","callout c-say");
  say2.append(el("span","ch", TEXTOS.fupMandeAssim), el("p","", FUP.f2Mensagem));
  n2.append(say2);

  const br2 = el("div","branches");
  const b2y = el("div","branch yes");
  b2y.append(el("span","bl", FUP.f2SimTitulo), el("span","bt", fmt(FUP.f2SimTexto)));
  const b2n = el("div","branch no");
  b2n.append(el("span","bl", fmt(FUP.f2NaoTitulo)),
    el("span","bt", fmt(FUP.f2NaoTexto) +
      (state.fup2_limite ? ' <span class="clock">' + TEXTOS.fupAPartirDas + " " + hhmm(state.fup2_limite) + "</span>" : "")));
  br2.append(b2y, b2n);
  n2.append(br2);

  if (ativo2) {
    const act = el("div","advance");
    const y = el("button","btn sm", FUP.botaoRespondeu);
    y.type = "button";
    y.onclick = () => { state.fup = "encerrado_confirmado"; render(); };
    const n = el("button","btn ghost sm", FUP.botaoEncerrar);
    n.type = "button";
    n.onclick = () => { state.fup = "encerrado_inatividade"; render(); };
    act.append(y, n, el("span","why", FUP.avisoEncerrar));
    n2.append(act);
  }
  arv.append(n2);
  col.append(arv);

  /* --- desfecho --- */
  if (state.fup === "encerrado_confirmado" || state.fup === "encerrado_inatividade") {
    const ok = state.fup === "encerrado_confirmado";
    const done = el("div","callout " + (ok ? "c-mode" : "c-stop"));
    done.append(el("span","ch", ok ? FUP.okTitulo : FUP.inativoTitulo));
    done.append(el("p","", ok ? FUP.okTexto : FUP.inativoTexto));
    col.append(done);

    const tg = el("div","block");
    tg.append(el("h3","", FUP.tituloTags));
    const tw = el("div","tags");
    [ "encerramento:" + (ok ? "confirmado" : "inatividade"),
      "fups:" + (ok && !state.fup2_em ? "1" : "2"),
      "confirmado_pelo_cliente:" + (ok ? "sim" : "nao")
    ].forEach(x => tw.append(el("span","tag",x)));
    tg.append(tw);
    col.append(tg);

    const back = el("div","advance");
    const b = el("button","btn ghost sm", FUP.botaoRefazer);
    b.type = "button";
    b.onclick = () => { resetFup(); render(); };
    back.append(b);
    col.append(back);
  }

  /* --- regra sempre visível --- */
  const rule = el("div","block");
  rule.append(el("h3","", FUP.tituloRegra));
  const kv = el("div","kv");
  FUP.regra.forEach(([k,v]) => {
    const row = el("div","kv-row");
    row.append(el("span","kv-k", k), el("span","kv-v", fmt(v)));
    kv.append(row);
  });
  rule.append(kv);
  col.append(rule);

  wrap.append(col);
  host.append(wrap);
}

/* ---------- busca ---------- */
/* tira acento e caixa: quem digita "pedido nao chega" acha "não chegam" */
const DIACRITICOS = new RegExp("[\\u0300-\\u036f]", "g");
const norm = s => String(s).normalize("NFD").replace(DIACRITICOS, "").toLowerCase();

const INDEX = [];
MODULOS.forEach(m => {
  INDEX.push({ label:m.nome, mod:m.id, cat:null, hay:norm(m.nome + " " + m.area + " " + m.onde) });
  m.casos.forEach(k => INDEX.push({ label:k.s, mod:m.id, cat:k.cat, hay:norm(k.s + " " + k.c + " " + m.nome) }));
});

function renderResults() {
  const q = norm(document.getElementById("q").value.trim());
  const host = document.getElementById("results");
  host.textContent = "";
  if (q.length < 2) return;
  const hits = INDEX.filter(i => q.split(/\s+/).every(w => i.hay.includes(w))).slice(0, 12);
  if (!hits.length) {
    host.append(el("li","", '<span class="nores">' + TEXTOS.buscaVazia + "</span>"));
    return;
  }
  hits.forEach(h => {
    const li = el("li");
    const b = el("button");
    b.type = "button";
    b.innerHTML = h.label + '<span class="rmod">' + mod(h.mod).nome + (h.cat ? " · " + cat(h.cat).nome : "") + "</span>";
    b.onclick = () => {
      state.mod = h.mod;
      if (h.cat) state.cat = h.cat;
      resetFup();
      document.getElementById("q").value = "";
      renderResults();
      render();
      document.getElementById(portoesOk() ? "out" : "axes").scrollIntoView({ behavior:"smooth", block:"start" });
    };
    li.append(b);
    host.append(li);
  });
}

/* ---------- boot ---------- */
function render() {
  renderMoldura(); renderSpine(); renderChips();
  renderFlow(); renderAxes(); renderOut(); renderFup();
}

document.getElementById("q").addEventListener("input", renderResults);

document.getElementById("btn-mapa").addEventListener("click", () => {
  state.mapa = !state.mapa;
  render();
});

document.getElementById("reset").addEventListener("click", () => {
  state.feito = { ia:false, problema:false, ticket:false };
  state.aberta = "ia";
  state.pulou = false;
  state.cat = null; state.mod = null;
  resetFup();
  document.getElementById("q").value = "";
  renderResults(); render();
  window.scrollTo({ top:0, behavior:"smooth" });
});

render();
</script>
