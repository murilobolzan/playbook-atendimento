<style>
  /* ═══════════════════════════════════════════════════════════════════════
     SISTEMA BASTIDOR — tokens

     Uma moldura, três preenchimentos. Toda cor é token: nenhum hexadecimal
     aparece fora deste bloco e das três variantes de tema logo abaixo.
     Trocar uma cor é uma linha, e o tema escuro acompanha sozinho.

     A escala inteira sai da cor da marca. O tema da documentação declara
     --primary-original: 187 149 212, ou seja #BB95D4, um lilás em
     hsl(276 42% 71%). Até os cinzas puxam de leve para o roxo em vez de
     serem neutros puros.
     ═══════════════════════════════════════════════════════════════════ */
  :root {
    color-scheme: light;

    /* --- marca e acento --- */
    --brand:        #BB95D4;   /* a cor da marca; nunca em texto: 1,9:1 */
    --accent:       #6D3D93;   /* a marca legível sobre branco, 7,2:1 */
    --accent-hover: #5D3280;
    --accent-press: #4C2867;
    --accent-forte: #572E77;
    --accent-suave: #F1E9F7;
    --accent-linha: #DCC9EA;
    --accent-sobre: #FFFFFF;

    /* --- superfícies e tinta --- */
    --ground:       #F7F5FA;
    --surface:      #FFFFFF;
    --surface-2:    #FBF9FD;
    --surface-3:    #F4F0F9;
    --ink:          #1B1421;   /* 18:1  — título e corpo */
    --ink-2:        #564B60;   /* 8,2:1 — prosa de apoio */
    --ink-3:        #786783;   /* 5,2:1 — só metadado de 12px+ */
    --line:         #E5DFEC;
    --line-forte:   #CFC5D9;

    /* --- seleção: uma família própria, distinta de hover e de foco --- */
    --sel-bg:       #F1E9F7;
    --sel-linha:    #6D3D93;

    /* --- semânticas: cada uma com trio fundo / linha / tinta --- */
    --crit: #B02A21;  --crit-bg: #FBE9E7;  --crit-linha: #EFC9C4;
    --warn: #855400;  --warn-bg: #FAF0DA;  --warn-linha: #E8D3A4;
    --calm: #1A6349;  --calm-bg: #E2F1EB;  --calm-linha: #B9DCCD;
    --info: #1D4FA8;  --info-bg: #E6EEFA;  --info-linha: #BFD3F0;

    /* --- espaço: seis medidas, cada uma com um emprego ---
       s1 dentro de chip · s2 entre controles · s3 respiro de linha
       s4 respiro de painel · s5 entre seções · s6 entre zonas */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 40px;

    /* --- tipografia: seis degraus, cada um com um emprego ---
       tag   10,5 mono maiúscula — rótulo que se varre, nunca se lê
       meta  12          — metadado que acompanha um item
       ui    13,5        — título de linha e rótulo de controle
       read  15          — o único texto lido como prosa
       title 19          — o assunto único do palco
       hero  26          — número que se lê de longe (horário do follow-up) */
    --t-tag: 10.5px; --t-meta: 12px; --t-ui: 13.5px;
    --t-read: 15px;  --t-title: 19px; --t-hero: 26px;

    --lh-tight: 1.25;   /* título e linha de lista */
    --lh-ui:    1.4;    /* rótulo e metadado */
    --lh-read:  1.6;    /* prosa */

    /* --- raio: container mais redondo que o conteúdo lê como profundidade ---
       r-1 abaixo de 24px de altura · r-2 controle · r-3 container */
    --r-1: 3px; --r-2: 6px; --r-3: 10px;

    /* --- elevação: o degrau zero é borda, não sombra ---
       três colunas de cards sombreados numa tela densa viram lama */
    --e1: 0 1px 2px rgba(27,20,33,.05), 0 6px 16px -12px rgba(27,20,33,.20);
    --e2: 0 2px 6px rgba(27,20,33,.08), 0 20px 48px -24px rgba(27,20,33,.34);
    --veu: rgba(20,12,28,.52);

    /* --- foco: um token, um seletor, toda a tela.
       O vão de 2px na cor da superfície é o que faz o anel aparecer também
       sobre chip colorido e sobre linha selecionada. --- */
    --foco: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);

    --dur-1: 90ms;    /* estado: hover, press, marcar */
    --dur-2: 160ms;   /* painel: gaveta, menu */

    /* --- medidas que o JS ajusta --- */
    --stick: 108px;              /* altura do topo fixo; o ResizeObserver corrige */
    --busca-h: 0px;              /* altura da busca grudada; o JS mede */
    --larg-barra: 232px;         /* largura da barra; o puxador grava */

    --font-ui: "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --font-mono: "Cascadia Mono","Cascadia Code",Consolas,"SF Mono",ui-monospace,Menlo,monospace;
  }

  /* ---------- tema escuro ----------
     No escuro a elevação é carregada pela claridade da superfície, não por
     sombra: sombra preta sobre #120E18 é invisível. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --brand:#BB95D4; --accent:#C9A6DE; --accent-hover:#D5B8E6; --accent-press:#E0CAEE;
      --accent-forte:#DABEE9; --accent-suave:#2A1B36; --accent-linha:#4A3560; --accent-sobre:#1D1226;
      --ground:#120E18; --surface:#1B1523; --surface-2:#221A2C; --surface-3:#1F1829;
      --ink:#F2EDF7; --ink-2:#B7ADC3; --ink-3:#968A9F;
      --line:#2F2739; --line-forte:#463B52;
      --sel-bg:#2A1B36; --sel-linha:#C9A6DE;
      --crit:#FF9E95; --crit-bg:#3A1714; --crit-linha:#5E2A25;
      --warn:#E9BA62; --warn-bg:#322509; --warn-linha:#54401A;
      --calm:#82D0AF; --calm-bg:#10281E; --calm-linha:#204837;
      --info:#8FBBF0; --info-bg:#0F1E33; --info-linha:#22385C;
      --e1: 0 1px 2px rgba(0,0,0,.5), 0 6px 16px -12px rgba(0,0,0,.8);
      --e2: 0 2px 6px rgba(0,0,0,.55), 0 20px 48px -24px rgba(0,0,0,.9);
      --veu: rgba(0,0,0,.66);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --brand:#BB95D4; --accent:#C9A6DE; --accent-hover:#D5B8E6; --accent-press:#E0CAEE;
    --accent-forte:#DABEE9; --accent-suave:#2A1B36; --accent-linha:#4A3560; --accent-sobre:#1D1226;
    --ground:#120E18; --surface:#1B1523; --surface-2:#221A2C; --surface-3:#1F1829;
    --ink:#F2EDF7; --ink-2:#B7ADC3; --ink-3:#968A9F;
    --line:#2F2739; --line-forte:#463B52;
    --sel-bg:#2A1B36; --sel-linha:#C9A6DE;
    --crit:#FF9E95; --crit-bg:#3A1714; --crit-linha:#5E2A25;
    --warn:#E9BA62; --warn-bg:#322509; --warn-linha:#54401A;
    --calm:#82D0AF; --calm-bg:#10281E; --calm-linha:#204837;
    --info:#8FBBF0; --info-bg:#0F1E33; --info-linha:#22385C;
    --e1: 0 1px 2px rgba(0,0,0,.5), 0 6px 16px -12px rgba(0,0,0,.8);
    --e2: 0 2px 6px rgba(0,0,0,.55), 0 20px 48px -24px rgba(0,0,0,.9);
    --veu: rgba(0,0,0,.66);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --brand:#BB95D4; --accent:#6D3D93; --accent-hover:#5D3280; --accent-press:#4C2867;
    --accent-forte:#572E77; --accent-suave:#F1E9F7; --accent-linha:#DCC9EA; --accent-sobre:#FFFFFF;
    --ground:#F7F5FA; --surface:#FFFFFF; --surface-2:#FBF9FD; --surface-3:#F4F0F9;
    --ink:#1B1421; --ink-2:#564B60; --ink-3:#786783;
    --line:#E5DFEC; --line-forte:#CFC5D9;
    --sel-bg:#F1E9F7; --sel-linha:#6D3D93;
    --crit:#B02A21; --crit-bg:#FBE9E7; --crit-linha:#EFC9C4;
    --warn:#855400; --warn-bg:#FAF0DA; --warn-linha:#E8D3A4;
    --calm:#1A6349; --calm-bg:#E2F1EB; --calm-linha:#B9DCCD;
    --info:#1D4FA8; --info-bg:#E6EEFA; --info-linha:#BFD3F0;
    --e1: 0 1px 2px rgba(27,20,33,.05), 0 6px 16px -12px rgba(27,20,33,.20);
    --e2: 0 2px 6px rgba(27,20,33,.08), 0 20px 48px -24px rgba(27,20,33,.34);
    --veu: rgba(20,12,28,.52);
  }

  /* ═══════════════════════════════ BASE ═══════════════════════════════ */
  * { box-sizing: border-box; }

  /* Sem isto, uma classe com display explícito vence o atributo hidden e o
     conteúdo de um tópico vaza para outro. Já aconteceu. Não remover. */
  [hidden] { display: none !important; }

  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--font-ui); font-size: var(--t-read); line-height: var(--lh-read);
    -webkit-font-smoothing: antialiased;
  }

  /* o anel de foco do sistema: um valor, um seletor, em tudo */
  :focus-visible { outline: none; box-shadow: var(--foco); border-radius: var(--r-1); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  ::selection { background: var(--accent-suave); color: var(--accent-forte); }

  /* o realce da busca: legível nos dois temas, ao contrário do amarelo padrão */
  mark {
    background: var(--accent-suave); color: var(--accent-forte);
    font-weight: 700; padding: 0 1px; border-radius: 2px;
  }

  .eyebrow {
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 600;
    letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3);
  }

  /* ═══════════════════════════ CABEÇALHO ═══════════════════════════ */
  .topbar {
    border-bottom: 1px solid var(--line); background: var(--surface);
    position: sticky; top: 0; z-index: 40;
  }
  .topbar-in {
    max-width: 1560px; margin: 0 auto; padding: var(--s3) var(--s5);
    display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
  .brand-mark {
    font-family: var(--font-mono); font-size: var(--t-meta); font-weight: 700;
    color: var(--accent-sobre); background: var(--accent);
    padding: var(--s1) var(--s2); border-radius: var(--r-1); letter-spacing: .05em;
  }
  h1 {
    font-size: var(--t-title); font-weight: 650; margin: 0;
    letter-spacing: -.015em; line-height: var(--lh-tight);
  }
  .topbar .sub {
    color: var(--ink-3); font-size: var(--t-meta); margin-left: auto;
    font-family: var(--font-mono); letter-spacing: .04em;
  }

  .menu-btn {
    display: none; font: inherit; font-size: var(--t-title); line-height: 1; cursor: pointer;
    background: var(--surface); color: var(--ink-2);
    border: 1px solid var(--line-forte); border-radius: var(--r-2); padding: 4px 10px;
    transition: border-color var(--dur-1), color var(--dur-1);
  }
  .menu-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ═══════════════════ ESTRUTURA: BARRA + CONTEÚDO ═══════════════════ */
  .app {
    max-width: 1560px; margin: 0 auto; padding: 0 var(--s5) var(--s6);
    display: grid; grid-template-columns: var(--larg-barra) minmax(0,1fr); gap: var(--s5);
    align-items: start;
  }
  .conteudo {
    display: flex; flex-direction: column; gap: var(--s5);
    min-width: 0; padding-top: var(--s5);
  }

  .side {
    position: sticky; top: calc(var(--stick) + var(--s4));
    max-height: calc(100vh - var(--stick) - var(--s6));
    display: flex; flex-direction: column; gap: var(--s3);
    padding-top: var(--s5);
  }
  .side-nav { overflow-y: auto; overscroll-behavior: contain; padding-right: var(--s1); }

  .side-topo { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s2) var(--s2); }
  .side-rot {
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
  }
  .side-recolher, .side-abrir {
    font: inherit; font-size: var(--t-read); line-height: 1; cursor: pointer;
    background: var(--surface); color: var(--ink-3);
    border: 1px solid var(--line-forte); border-radius: var(--r-2); padding: 2px 9px;
    transition: border-color var(--dur-1), color var(--dur-1);
  }
  .side-recolher { margin-left: auto; }
  .side-recolher:hover, .side-abrir:hover { border-color: var(--accent); color: var(--accent); }
  .side-abrir {
    position: sticky; top: calc(var(--stick) + var(--s4)); align-self: start;
    margin-top: var(--s5); z-index: 6;
  }
  body.barra-recolhida .app { grid-template-columns: auto minmax(0,1fr); }
  body.barra-recolhida .side { display: none; }

  /* puxador para alargar ou estreitar a barra, arrastando */
  .puxador {
    position: absolute; top: 0; right: calc(var(--s5) / -2); width: var(--s3); height: 100%;
    cursor: col-resize; background: transparent; border: 0; padding: 0; z-index: 5;
  }
  .puxador::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px;
    transform: translateX(-50%); background: var(--line); border-radius: 2px;
    transition: background var(--dur-1), width var(--dur-1);
  }
  /* três pontinhos no meio, para o puxador se anunciar */
  .puxador::after {
    content: ""; position: absolute; top: 50%; left: 50%; width: 4px; height: 26px;
    transform: translate(-50%,-50%); border-radius: 4px;
    background: repeating-linear-gradient(var(--line-forte) 0 3px, transparent 3px 6px);
  }
  .puxador:hover::before, .puxador:focus-visible::before, body.arrastando .puxador::before {
    background: var(--accent); width: 3px;
  }
  .puxador:hover::after, body.arrastando .puxador::after {
    background: repeating-linear-gradient(var(--accent) 0 3px, transparent 3px 6px);
  }
  .puxador:focus-visible { box-shadow: none; }
  body.arrastando { cursor: col-resize; user-select: none; }
  @media (max-width: 1080px) { .puxador { display: none; } }

  .véu { display: none; }

  @media (max-width: 1080px) {
    .app { grid-template-columns: 1fr; }
    .menu-btn { display: inline-block; }
    .side {
      position: fixed; inset: 0 auto 0 0; z-index: 70; width: min(320px, 86vw);
      max-height: none; padding: var(--s4); background: var(--surface);
      border-right: 1px solid var(--line); box-shadow: var(--e2);
      transform: translateX(-102%); transition: transform var(--dur-2) ease;
    }
    body.menu-aberto .side { transform: translateX(0); }
    body.menu-aberto .véu { display: block; position: fixed; inset: 0; z-index: 65; background: var(--veu); }
    .conteudo { padding-top: var(--s4); }
  }
  @media (prefers-reduced-motion: reduce) { .side { transition: none; } }

  /* ═══════════════════════════ BUSCA ═══════════════════════════
     Fica grudada no topo do conteúdo: rolar a lista não a tira da tela.
     Antes ela rolava junto, e quem chegava no fim da lista tinha que voltar
     ao topo para trocar o termo. */
  .side-busca {
    position: sticky; top: calc(var(--stick) + var(--s2)); z-index: 20;
    display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
    padding: var(--s3) var(--s4);
    background: var(--surface); border: 1px solid var(--line-forte);
    border-radius: var(--r-3); box-shadow: var(--e1);
  }
  .busca-rot {
    flex: 0 0 auto; white-space: nowrap;
    font-size: var(--t-ui); font-weight: 650; color: var(--ink); letter-spacing: -.01em;
  }
  .lupa { position: relative; display: flex; align-items: center; flex: 1 1 260px; min-width: 0; }
  .lupa-icone {
    position: absolute; left: 11px; width: 16px; height: 16px; pointer-events: none;
    fill: none; stroke: var(--ink-3); stroke-width: 2.1; stroke-linecap: round;
    transition: stroke var(--dur-1);
  }
  .lupa input {
    width: 100%; font: inherit; font-size: var(--t-ui); font-weight: 500;
    padding: 9px 68px 9px 35px;
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line-forte); border-radius: var(--r-2);
    transition: border-color var(--dur-1), background var(--dur-1);
  }
  .lupa input::placeholder { color: var(--ink-3); font-weight: 400; }
  .lupa input:focus { background: var(--surface); }
  .lupa input:focus-visible { border-color: var(--accent); box-shadow: var(--foco); }
  .lupa:focus-within .lupa-icone { stroke: var(--accent); }
  /* o atalho aparece escrito no campo: atalho que ninguém vê ninguém usa */
  .lupa::after {
    content: "Ctrl K"; position: absolute; right: 34px; pointer-events: none;
    font-family: var(--font-mono); font-size: var(--t-tag); color: var(--ink-3);
    border: 1px solid var(--line); border-radius: var(--r-1);
    padding: 2px 5px; background: var(--surface);
  }
  .lupa:focus-within::after { opacity: 0; }
  .lupa-limpa {
    position: absolute; right: 5px; font: inherit; font-size: 17px; line-height: 1;
    cursor: pointer; background: transparent; border: 0; color: var(--ink-3);
    padding: 3px 8px; border-radius: var(--r-1);
    transition: color var(--dur-1), background var(--dur-1);
  }
  .lupa-limpa:hover { color: var(--accent); background: var(--accent-suave); }
  @media (max-width: 560px) { .lupa::after { display: none; } .lupa input { padding-right: 38px; } }

  /* ═══════════════════ SELETOR DE TÓPICO NA BARRA ═══════════════════ */
  /* Gruda no topo da barra: e o comutador entre os tres topicos, e rolar a
     lista de abas nao pode fazer ele sumir. */
  .topicos {
    position: sticky; top: 0; z-index: 3;
    display: flex; flex-direction: column; gap: 2px;
    padding: var(--s1); margin-bottom: var(--s3);
    background: var(--surface-3); border: 1px solid var(--line); border-radius: var(--r-3);
    box-shadow: 0 6px 10px -8px rgba(0,0,0,.28);
  }
  .topico {
    font: inherit; text-align: left; cursor: pointer;
    background: transparent; border: 1px solid transparent; border-radius: var(--r-2);
    padding: 7px var(--s3); color: var(--ink-2);
    transition: background var(--dur-1), color var(--dur-1);
  }
  .topico-rot { font-size: var(--t-ui); font-weight: 600; line-height: var(--lh-tight); }
  .topico:hover { background: var(--surface); color: var(--ink); }
  .topico.on {
    background: var(--surface); color: var(--accent-forte);
    border-color: var(--accent-linha); box-shadow: var(--e1);
  }
  .topico.on .topico-rot { font-weight: 700; }

  .topico-dentro { display: flex; flex-direction: column; gap: 2px; }

  /* ═══════════════════ NAVEGAÇÃO DA BARRA ═══════════════════ */
  .nav-titulo {
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
    padding: var(--s3) var(--s2) 5px;
  }
  .nav-item {
    display: flex; align-items: center; gap: var(--s2);
    font: inherit; font-size: var(--t-ui); text-align: left; cursor: pointer;
    background: transparent; color: var(--ink-2);
    border: 1px solid transparent; border-radius: var(--r-2);
    padding: 6px var(--s2); min-height: 30px; width: 100%;
    transition: background var(--dur-1), color var(--dur-1);
  }
  .nav-item:hover:not([disabled]) { background: var(--surface-3); color: var(--ink); }
  .nav-item.on {
    background: var(--sel-bg); color: var(--accent-forte); font-weight: 650;
    box-shadow: inset 2px 0 0 var(--sel-linha);
  }
  .nav-item[disabled] { cursor: not-allowed; opacity: .42; }
  .nav-txt {
    flex: 1 1 auto; min-width: 0; line-height: var(--lh-tight);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .nav-n {
    flex: 0 0 auto; width: 18px; height: 18px; display: grid; place-items: center;
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    color: var(--ink-3); background: var(--surface-3);
    border: 1px solid var(--line); border-radius: var(--r-1);
  }
  .nav-item.on .nav-n { color: var(--accent-sobre); background: var(--accent); border-color: var(--accent); }
  .nav-item.ok .nav-n { color: var(--calm); background: var(--calm-bg); border-color: var(--calm-linha); }
  .nav-conta {
    flex: 0 0 auto; font-family: var(--font-mono); font-size: var(--t-tag);
    font-variant-numeric: tabular-nums; color: var(--ink-3);
  }
  .nav-item.on .nav-conta { color: var(--accent); }
  .nav-seta {
    flex: 0 0 auto; font-size: 8px; color: var(--ink-3); line-height: 1;
    transition: transform var(--dur-1);
  }
  .nav-pai[aria-expanded="true"] .nav-seta { transform: rotate(90deg); }
  .nav-pai { font-weight: 600; color: var(--ink); }
  .nav-pai.on { font-weight: 700; }
  .nav-filhos {
    display: flex; flex-direction: column; gap: 1px;
    margin: 1px 0 var(--s2) var(--s3);
    padding-left: var(--s2); border-left: 1px solid var(--line);
  }
  .nav-vazia { color: var(--ink-3); font-size: var(--t-meta); }

  /* ---- cabeçalho das abas, com o botão de reordenar ---- */
  .nav-cab { display: flex; align-items: baseline; gap: var(--s2); padding-right: var(--s2); }
  .nav-cab .nav-titulo { flex: 1 1 auto; }
  .nav-ordem {
    flex: 0 0 auto; font: inherit; font-family: var(--font-mono); font-size: var(--t-tag);
    line-height: 1; cursor: pointer; padding: 3px 6px; border-radius: var(--r-1);
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-3);
    transition: color var(--dur-1), border-color var(--dur-1), background var(--dur-1);
  }
  .nav-ordem:hover { color: var(--accent); border-color: var(--accent); }
  .nav-ordem[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--accent-sobre); font-weight: 700;
  }

  /* ---- sub-aba virou rótulo: quem se clica agora é a resposta ---- */
  .nav-sub {
    display: flex; align-items: center; gap: var(--s2);
    padding: var(--s3) var(--s2) 3px;
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
  }
  .nav-sub .nav-txt { flex: 1 1 auto; min-width: 0; }
  .nav-sub .nav-conta { font-size: var(--t-tag); }

  /* ---- a resposta, o terceiro nível da árvore ---- */
  .nav-resp {
    display: flex; align-items: center; gap: 2px;
    border-radius: var(--r-2); transition: background var(--dur-1);
  }
  .nav-resp:hover { background: var(--surface-3); }
  .nav-resp.on { background: var(--sel-bg); box-shadow: inset 2px 0 0 var(--sel-linha); }
  .nav-resp.interno { box-shadow: inset 2px 0 0 var(--warn); }
  .nav-resp-txt { flex: 1 1 auto; min-width: 0; font-size: var(--t-meta); }
  .nav-resp-txt:hover { background: transparent; }
  .nav-resp.on .nav-resp-txt { color: var(--accent-forte); font-weight: 650; }
  .nav-resp .ricone { flex: 0 0 auto; opacity: 0; transition: opacity var(--dur-1); }
  .nav-resp:hover .ricone, .nav-resp .ricone:focus-visible, .nav-resp.on .ricone { opacity: 1; }

  /* ---- modo de reordenar ---- */
  .nav-ordem-nota {
    margin: 0 0 var(--s2); padding: var(--s2) var(--s3);
    font-size: var(--t-meta); line-height: var(--lh-ui); color: var(--ink-2);
    background: var(--accent-suave); border: 1px solid var(--accent-linha); border-radius: var(--r-2);
  }
  .nav-ord-linha { display: flex; align-items: center; gap: var(--s1); }
  .nav-ord-linha .nav-item, .nav-ord-linha .nav-ord-nome { flex: 1 1 auto; min-width: 0; }
  .nav-ord-nome {
    display: flex; align-items: center; gap: var(--s2);
    font-size: var(--t-ui); color: var(--ink-2); padding: 6px var(--s2);
  }
  .nav-setas { flex: 0 0 auto; display: flex; flex-direction: column; gap: 1px; }
  .nav-seta-btn {
    font: inherit; font-size: 11px; line-height: 1; cursor: pointer;
    width: 20px; height: 13px; padding: 0; border-radius: 2px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-3);
    display: grid; place-items: center;
    transition: color var(--dur-1), border-color var(--dur-1);
  }
  .nav-seta-btn:hover:not([disabled]) { color: var(--accent); border-color: var(--accent); }
  .nav-seta-btn[disabled] { opacity: .3; cursor: not-allowed; }
  .nav-ordem-estado:empty { display: none; }
  .nav-ordem-estado {
    margin: 0; font-size: var(--t-meta); line-height: var(--lh-ui);
    color: var(--ink-2); background: var(--surface-3);
    border: 1px solid var(--line); border-radius: var(--r-2); padding: var(--s2) var(--s3);
  }
  .nav-ordem-estado.ok   { color: var(--calm); background: var(--calm-bg); border-color: var(--calm-linha); }
  .nav-ordem-estado.ruim { color: var(--crit); background: var(--crit-bg); border-color: var(--crit-linha); }

  .side-acoes { display: flex; flex-direction: column; gap: var(--s2); padding-bottom: var(--s2); }
  .side-acoes-linha { display: flex; gap: var(--s2); align-items: stretch; }
  .side-acoes-linha .btn { flex: 1 1 auto; min-width: 0; }
  .side-chave { flex: 0 0 auto !important; padding: 6px 10px; font-size: var(--t-ui); }
  .side-chave.ok { border-color: var(--calm-linha); background: var(--calm-bg); }

  /* ═══════════════════════════ BOTÕES ═══════════════════════════
     Tres variantes: cheio (primário), fantasma e ícone.
     Peso visual separa o que é rotina do que não volta atrás. */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font: inherit; font-size: var(--t-ui); font-weight: 600; line-height: 1;
    cursor: pointer; text-decoration: none; white-space: nowrap;
    padding: 9px 15px; border-radius: var(--r-2);
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-sobre);
    transition: background var(--dur-1), border-color var(--dur-1), color var(--dur-1);
  }
  .btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn:active { background: var(--accent-press); border-color: var(--accent-press); }
  .btn.ghost {
    background: var(--surface); color: var(--ink-2); border-color: var(--line-forte); font-weight: 500;
  }
  .btn.ghost:hover { background: var(--surface); color: var(--accent); border-color: var(--accent); }
  .btn.sm { font-size: var(--t-meta); padding: 6px var(--s3); }
  .btn.cheio { width: 100%; }
  .btn[disabled] { opacity: .42; cursor: not-allowed; }
  .btn[disabled]:hover { background: var(--accent); border-color: var(--accent); }
  .btn.ghost[disabled]:hover { background: var(--surface); color: var(--ink-2); border-color: var(--line-forte); }

  /* ═══════════════════════════ PAINEL ═══════════════════════════
     O container base do sistema. Todas as caixas de conteúdo saem daqui. */
  .stage, .result, .panel, .modo-cards, .case, .fnode, .crit {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-3);
  }

  /* ═══════════════════════ ETAPAS 1 A 3 ═══════════════════════ */
  .stage { overflow: hidden; }
  .st-head {
    display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
    padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line);
    background: var(--surface-2);
  }
  .st-n {
    flex: 0 0 auto; width: 26px; height: 26px; display: grid; place-items: center;
    font-family: var(--font-mono); font-size: var(--t-ui); font-weight: 700;
    color: var(--accent-sobre); background: var(--accent);
    border: 1px solid var(--accent); border-radius: var(--r-2);
  }
  .stage.is-done .st-n { color: var(--calm); background: var(--calm-bg); border-color: var(--calm-linha); }
  .st-title {
    font-size: var(--t-title); font-weight: 650; letter-spacing: -.015em;
    line-height: var(--lh-tight); min-width: 0;
  }
  .st-sub:not(:empty) {
    margin-left: auto; font-family: var(--font-mono); font-size: var(--t-tag);
    font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--calm); background: var(--calm-bg);
    border: 1px solid var(--calm-linha); border-radius: var(--r-1); padding: 3px 7px;
  }
  /* o lápis de editar a etapa: só aparece para quem tem token */
  .st-editar {
    margin-left: auto; flex: 0 0 auto;
    font: inherit; font-size: var(--t-meta); line-height: 1; cursor: pointer;
    padding: 5px var(--s2); border-radius: var(--r-1);
    background: transparent; color: var(--ink-3); border: 1px solid transparent;
    transition: color var(--dur-1), border-color var(--dur-1);
  }
  .st-editar:hover { color: var(--accent); border-color: var(--accent-linha); }
  .st-head .st-sub:not(:empty) ~ .st-editar { margin-left: var(--s2); }

  .st-body { padding: var(--s5); display: flex; flex-direction: column; gap: var(--s5); }
  .lead {
    margin: 0; font-size: var(--t-read); line-height: var(--lh-read);
    color: var(--ink-2); max-width: 74ch;
  }
  .lead strong { color: var(--ink); font-weight: 650; }

  /* O par de contraste: faça / não faça lado a lado.
     Empilhado, viram duas listas que se leem como continuação. Lado a lado,
     com famílias de cor opostas, o par se lê em um golpe. */
  .st-par { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--s4); align-items: start; }
  @media (max-width: 820px) { .st-par { grid-template-columns: 1fr; } }

  .checklist {
    list-style: none; margin: 0; padding: var(--s4);
    display: flex; flex-direction: column; gap: var(--s3);
    background: var(--calm-bg); border: 1px solid var(--calm-linha); border-radius: var(--r-3);
  }
  .checklist::before {
    content: attr(data-rot);
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    letter-spacing: .11em; text-transform: uppercase; color: var(--calm);
  }
  .checklist li {
    position: relative; padding-left: var(--s5);
    font-size: var(--t-read); line-height: var(--lh-read); color: var(--ink-2);
  }
  .checklist li::before {
    content: "✓"; position: absolute; left: 0; top: -1px;
    font-family: var(--font-mono); font-size: var(--t-ui); font-weight: 700; color: var(--calm);
  }
  .checklist li strong { color: var(--ink); font-weight: 650; }

  /* ═══════════════════════ CAIXAS DE DESTAQUE ═══════════════════════ */
  .callout {
    padding: var(--s4); border-radius: var(--r-3);
    display: flex; flex-direction: column; gap: var(--s3);
    border: 1px solid var(--line); background: var(--surface-2);
  }
  .callout .ch {
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    letter-spacing: .11em; text-transform: uppercase; color: var(--ink-3);
  }
  .callout p { margin: 0; font-size: var(--t-read); line-height: var(--lh-read); color: var(--ink-2); }
  .callout p strong { color: var(--ink); font-weight: 650; }
  .callout ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s3); }
  .callout ul li {
    position: relative; padding-left: var(--s5);
    font-size: var(--t-read); line-height: var(--lh-read); color: var(--ink-2);
  }
  .callout ul li strong { color: var(--ink); font-weight: 650; }
  .callout ul li::before {
    content: "✕"; position: absolute; left: 0; top: -1px;
    font-family: var(--font-mono); font-size: var(--t-ui); font-weight: 700; color: var(--ink-3);
  }

  .c-stop { background: var(--crit-bg); border-color: var(--crit-linha); }
  .c-stop .ch { color: var(--crit); }
  .c-stop ul li::before { color: var(--crit); }

  .c-say { background: var(--accent-suave); border-color: var(--accent-linha); }
  .c-say .ch { color: var(--accent); }
  .c-say p {
    font-family: var(--font-ui); color: var(--ink);
    background: var(--surface); border: 1px solid var(--accent-linha);
    border-radius: var(--r-2); padding: var(--s3);
  }

  .c-mode { background: var(--calm-bg); border-color: var(--calm-linha); }
  .c-mode .ch { color: var(--calm); }

  /* ═══════════════════════ AVANÇAR ═══════════════════════ */
  .advance {
    display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
    padding-top: var(--s4); border-top: 1px solid var(--line);
  }
  .advance .btn { white-space: normal; text-align: center; }
  .why { font-size: var(--t-meta); color: var(--ink-3); line-height: var(--lh-ui); flex: 1 1 min(240px, 100%); }

  /* ═══════════════ ESCOLHA DO TEMA, DENTRO DA ETAPA 3 ═══════════════ */
  .eixos {
    display: flex; flex-direction: column; gap: var(--s5);
    padding: var(--s4); border: 1px solid var(--accent-linha);
    border-radius: var(--r-3); background: var(--accent-suave);
  }
  .eixos-tag {
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    letter-spacing: .11em; text-transform: uppercase; color: var(--accent);
  }
  .eixo { display: flex; flex-direction: column; gap: var(--s3); }
  .step-h { display: flex; flex-direction: column; gap: 3px; }
  .step-h h3 { margin: 0; font-size: var(--t-ui); font-weight: 700; line-height: var(--lh-tight); }
  .note { font-size: var(--t-meta); color: var(--ink-2); line-height: var(--lh-ui); max-width: 72ch; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(132px,100%),1fr)); gap: var(--s2); }
  .cards.densa { grid-template-columns: repeat(auto-fill, minmax(min(108px,100%),1fr)); }
  .card {
    display: flex; flex-direction: column; gap: 2px;
    font: inherit; text-align: left; cursor: pointer;
    padding: var(--s2) var(--s3); border-radius: var(--r-2);
    background: var(--surface); border: 1px solid var(--line-forte); color: var(--ink);
    transition: border-color var(--dur-1), background var(--dur-1);
  }
  .card:hover { border-color: var(--accent); background: var(--surface); }
  .card[aria-pressed="true"] {
    background: var(--surface); border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .card .ct {
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3);
  }
  .card[aria-pressed="true"] .ct { color: var(--accent); }
  .card .cn { font-size: var(--t-ui); font-weight: 650; line-height: var(--lh-tight); }
  .card .cd { font-size: var(--t-meta); color: var(--ink-2); line-height: var(--lh-ui); }

  /* ═══════════════════ RESULTADO: ETAPAS 4 E 5 ═══════════════════ */
  .result { overflow: hidden; }
  .rhead {
    padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line);
    background: var(--surface-2); display: flex; flex-direction: column; gap: var(--s2);
  }
  .rtitle {
    margin: 0; font-size: var(--t-title); font-weight: 650;
    letter-spacing: -.015em; line-height: var(--lh-tight);
  }
  .rprazo { margin: 0; font-size: var(--t-read); color: var(--ink-2); line-height: var(--lh-read); max-width: 78ch; }
  .rsolo { padding: var(--s5); display: flex; flex-direction: column; gap: var(--s5); }
  .rcol  { padding: var(--s5); display: flex; flex-direction: column; gap: var(--s5); }
  .rduo  { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px,100%),1fr)); gap: var(--s5); align-items: start; }

  /* ═══════════ FAIXA DO TICKET: identidade, não pergunta ═══════════
     Aparece na etapa 4. O tema vem escolhido da etapa 3: aqui ele é
     identidade do que está sendo atendido, não uma pergunta de novo.

     NOTA: SEV e SEV_POR_CATEGORIA existem em [8] do conteudo.js e nunca
     chegaram à tela. Exibir a severidade seria acrescentar informação, não
     mudar layout, então ficou de fora deste redesenho. */
  .tema {
    display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
    padding: var(--s3) var(--s4); border-radius: var(--r-3);
    background: var(--surface-3); border: 1px solid var(--line);
  }
  .tema-tag {
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    letter-spacing: .11em; text-transform: uppercase; color: var(--ink-3);
  }
  .tema-chips { display: flex; gap: var(--s1); flex-wrap: wrap; }
  .tema-chip {
    font-size: var(--t-ui); font-weight: 650; color: var(--accent-forte);
    background: var(--accent-suave); border: 1px solid var(--accent-linha);
    border-radius: var(--r-1); padding: 3px var(--s2);
  }

  /* ═══════════════════════ BLOCOS DE CONTEÚDO ═══════════════════════ */
  .block { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
  .block > h3 {
    margin: 0; font-size: var(--t-ui); font-weight: 700; color: var(--ink);
    line-height: var(--lh-tight);
  }
  .microhint { font-size: var(--t-meta); color: var(--ink-3); line-height: var(--lh-ui); }

  .decisao { gap: var(--s3); }
  .decisao > h3 { font-size: var(--t-ui); }
  .modo-cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px,100%),1fr));
    gap: 1px; overflow: hidden; background: var(--line); border: 1px solid var(--line);
  }
  .modo-card {
    display: flex; flex-direction: column; gap: var(--s1);
    font: inherit; text-align: left; cursor: pointer; border: 0;
    padding: var(--s3) var(--s4); background: var(--surface); color: var(--ink);
    transition: background var(--dur-1);
  }
  .modo-card:hover { background: var(--surface-2); }
  .modo-card.on { background: var(--accent-suave); box-shadow: inset 3px 0 0 var(--accent); }
  .modo-rot {
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
  }
  .modo-card.on .modo-rot { color: var(--accent); }
  .modo-modo { font-size: var(--t-ui); font-weight: 650; line-height: var(--lh-tight); }
  .modo-txt { font-size: var(--t-meta); color: var(--ink-2); line-height: var(--lh-ui); }

  .cases { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s2); }
  .case { padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s1); }
  .case-s { font-size: var(--t-ui); font-weight: 650; color: var(--ink); line-height: var(--lh-tight); }
  .case-c { font-size: var(--t-meta); color: var(--ink-2); line-height: var(--lh-read); }
  .case-c em {
    color: var(--ink-3); font-style: normal; font-family: var(--font-mono);
    font-size: var(--t-tag); letter-spacing: .09em; text-transform: uppercase;
  }
  .case a {
    align-self: flex-start; font-size: var(--t-meta); color: var(--accent);
    text-decoration: none; font-weight: 600; border-radius: var(--r-1);
  }
  .case a::after { content: " ↗"; color: var(--ink-3); }
  .case a:hover { text-decoration: underline; text-underline-offset: 3px; }

  .doclist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
  .doclist a {
    display: block; font-size: var(--t-ui); color: var(--ink-2); text-decoration: none;
    padding: 6px var(--s2); border-radius: var(--r-2);
    border: 1px solid transparent; line-height: var(--lh-ui);
    transition: background var(--dur-1), color var(--dur-1), border-color var(--dur-1);
  }
  .doclist a:hover { color: var(--accent); background: var(--accent-suave); border-color: var(--accent-linha); }
  .doclist a::before { content: "↗"; color: var(--ink-3); font-size: 10px; margin-right: 7px; }

  .kv { display: flex; flex-direction: column; gap: var(--s2); }
  .kv-row { display: grid; grid-template-columns: 84px minmax(0,1fr); gap: var(--s3); align-items: baseline; }
  .kv-k {
    font-family: var(--font-mono); font-size: var(--t-tag); letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .kv-v { font-size: var(--t-ui); color: var(--ink); line-height: var(--lh-ui); }

  /* Restou o uso do follow-up: as tags de encerramento, que sao rotulo e nao
     filtro. As cores por classe saíram junto com os chips. */
  .tags { display: flex; flex-wrap: wrap; gap: var(--s1); }
  .tag {
    font-family: var(--font-mono); font-size: var(--t-meta); color: var(--ink-2);
    background: var(--surface-3); border: 1px solid var(--line);
    border-radius: var(--r-1); padding: 3px 7px; line-height: 1.2;
  }

  /* ═══════════════ PAINEL DE DÚVIDA: perguntar para a IA ═══════════════ */
  .panel { overflow: hidden; }
  .duvida { border-color: var(--accent-linha); }
  .panel-h {
    padding: var(--s3) var(--s4); border-bottom: 1px solid var(--accent-linha);
    background: var(--accent-suave); display: flex; flex-direction: column; gap: 3px;
  }
  .duvida-tag { color: var(--accent); }
  .duvida-titulo { margin: 0; font-size: var(--t-ui); font-weight: 700; line-height: var(--lh-tight); }
  .panel-b { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
  .duvida-hint { margin: 0; font-size: var(--t-meta); color: var(--ink-2); line-height: var(--lh-ui); max-width: 74ch; }
  .duvida-rodape { margin: 0; font-size: var(--t-meta); color: var(--ink-3); line-height: var(--lh-ui); }
  .search { display: flex; }
  .search input {
    width: 100%; font: inherit; font-size: var(--t-ui); padding: 9px var(--s3);
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line-forte); border-radius: var(--r-2);
  }
  .search input::placeholder { color: var(--ink-3); }
  .search input:focus-visible { border-color: var(--accent); box-shadow: var(--foco); }

  /* ═══════════════════════════ FOLLOW-UP ═══════════════════════════ */
  .fup { display: flex; flex-direction: column; }
  .fnode {
    border-left: 3px solid var(--line-forte);
    padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3);
    transition: opacity var(--dur-2);
  }
  .fnode.on { border-left-color: var(--accent); border-color: var(--accent-linha); }
  .fnode.spent { opacity: .5; }
  .fnode-h { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  .fnode-h .ft { font-size: var(--t-ui); font-weight: 700; line-height: var(--lh-tight); }
  .fnode-h .fw {
    font-family: var(--font-mono); font-size: var(--t-tag); letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .branches { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(226px,100%),1fr)); gap: var(--s2); }
  .branch {
    border: 1px solid var(--line); border-radius: var(--r-2); background: var(--surface-2);
    padding: var(--s3); display: flex; flex-direction: column; gap: 6px;
  }
  .branch .bl {
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
  }
  .branch .bt { font-size: var(--t-ui); color: var(--ink-2); line-height: var(--lh-read); }
  .branch .bt strong { color: var(--ink); font-weight: 650; }
  .branch.yes { border-color: var(--calm-linha); background: var(--calm-bg); }
  .branch.yes .bl { color: var(--calm); }
  .branch.no  { border-color: var(--warn-linha); background: var(--warn-bg); }
  .branch.no .bl { color: var(--warn); }
  .fconn { align-self: center; color: var(--line-forte); font-size: var(--t-read); line-height: 1; padding: var(--s2) 0; }

  /* o horário é o número que se lê de longe nesta tela */
  .clock {
    font-family: var(--font-mono); font-size: var(--t-ui); font-weight: 700;
    font-variant-numeric: tabular-nums; color: var(--accent-forte);
    background: var(--accent-suave); border: 1px solid var(--accent-linha);
    border-radius: var(--r-1); padding: 3px 8px; display: inline-block;
  }

  /* ═══════════════════════ ESTADO VAZIO ═══════════════════════
     Uma frase e, quando faz sentido, uma ação. Nunca só espaço em branco. */
  .empty {
    border: 1px dashed var(--line-forte); border-radius: var(--r-3);
    padding: var(--s6) var(--s5); background: var(--surface-2);
    color: var(--ink-2); font-size: var(--t-read); line-height: var(--lh-read);
    text-align: center; max-width: 68ch; margin: 0 auto;
  }

  /* ═══════════════════ RÉGUA DE AVALIAÇÃO ═══════════════════
     Antes: os 4 critérios abertos ao mesmo tempo, cada régua 0–5 como lista
     vertical de frases inteiras — 24 blocos de texto numa tela.
     Agora: acordeão de critério e trilha 0–5 horizontal, um nível por vez.
     Mesmas frases, mesmos pesos. É um leitor, não um formulário: não calcula
     média e não guarda nada. */
  .grupo { display: flex; flex-direction: column; gap: var(--s3); }

  .crit { overflow: hidden; }
  .crit.on { border-color: var(--accent-linha); box-shadow: var(--e1); }
  .crit-h {
    display: flex; align-items: center; gap: var(--s3); width: 100%;
    font: inherit; text-align: left; cursor: pointer;
    background: var(--surface); border: 0; padding: var(--s3) var(--s4);
    transition: background var(--dur-1);
  }
  .crit-h:hover { background: var(--surface-2); }
  .crit.on .crit-h { background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .crit-n {
    flex: 0 0 auto; width: 22px; height: 22px; display: grid; place-items: center;
    font-family: var(--font-mono); font-size: var(--t-meta); font-weight: 700;
    color: var(--ink-3); background: var(--surface-3);
    border: 1px solid var(--line); border-radius: var(--r-1);
  }
  .crit.on .crit-n { color: var(--accent-sobre); background: var(--accent); border-color: var(--accent); }
  .crit-nome {
    flex: 1 1 auto; min-width: 0; margin: 0;
    font-size: var(--t-ui); font-weight: 650; line-height: var(--lh-tight); color: var(--ink);
  }
  .crit-peso {
    flex: 0 0 auto; font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    letter-spacing: .07em; text-transform: uppercase; color: var(--accent-forte);
    background: var(--accent-suave); border: 1px solid var(--accent-linha);
    border-radius: var(--r-1); padding: 3px 7px;
  }
  .crit-seta { flex: 0 0 auto; font-size: 9px; color: var(--ink-3); line-height: 1; transition: transform var(--dur-1); }
  .crit.on .crit-seta { transform: rotate(90deg); }

  .crit-corpo { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
  .crit-obs { margin: 0; font-size: var(--t-meta); color: var(--ink-2); line-height: var(--lh-read); max-width: 78ch; }
  .crit-obs strong { color: var(--ink); font-weight: 650; }

  /* a trilha: os 6 níveis na horizontal, para dar para comparar */
  .trilha-cx { display: flex; flex-direction: column; gap: 5px; }
  .trilha-rot {
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    letter-spacing: .11em; text-transform: uppercase; color: var(--ink-3);
  }
  .trilha { display: flex; gap: 3px; }
  .trilha button {
    flex: 1 1 0; min-width: 34px;
    font: inherit; font-family: var(--font-mono); font-size: var(--t-ui); font-weight: 700;
    cursor: pointer; padding: 8px 0;
    border: 1px solid var(--line-forte); border-radius: var(--r-1);
    background: var(--surface); color: var(--ink-3);
    transition: background var(--dur-1), color var(--dur-1), border-color var(--dur-1);
  }
  .trilha button:hover { border-color: var(--accent); color: var(--accent); }
  .trilha button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--accent-sobre);
  }
  .trilha-pe {
    display: flex; justify-content: space-between; gap: var(--s2);
    font-family: var(--font-mono); font-size: var(--t-tag);
    letter-spacing: .07em; color: var(--ink-3);
  }

  .nivel-atual {
    display: flex; flex-direction: column; gap: var(--s2);
    padding: var(--s4); border-radius: var(--r-2);
    background: var(--accent-suave); border: 1px solid var(--accent-linha);
  }
  .nivel-rot {
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    letter-spacing: .11em; text-transform: uppercase; color: var(--accent);
  }
  .nivel-txt { font-size: var(--t-read); line-height: var(--lh-read); color: var(--ink); margin: 0; }

  .nivel-prox {
    display: flex; flex-direction: column; gap: 5px;
    padding: var(--s3) var(--s4); border-radius: var(--r-2);
    background: var(--surface-2); border: 1px dashed var(--line-forte);
  }
  .nivel-prox-rot {
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    letter-spacing: .11em; text-transform: uppercase; color: var(--ink-3);
  }
  .nivel-prox-txt { margin: 0; font-size: var(--t-ui); line-height: var(--lh-read); color: var(--ink-2); }

  /* nos extremos, a cor diz o que a nota significa */
  .nivel-atual.baixo { background: var(--crit-bg); border-color: var(--crit-linha); }
  .nivel-atual.baixo .nivel-rot { color: var(--crit); }
  .nivel-atual.alto { background: var(--calm-bg); border-color: var(--calm-linha); }
  .nivel-atual.alto .nivel-rot { color: var(--calm); }

  /* ═══════════════════════ RESPOSTAS RÁPIDAS ═══════════════════════
     Uma coluna só. A lista permanente do meio saiu: navegar acontece na árvore
     da barra, que agora chega até a resposta, e procurar acontece na busca,
     cujos resultados aparecem logo abaixo dela e só enquanto há pergunta.
     O resto do tempo a tela é a resposta que está sendo lida. */
  #resp { display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }

  /* ---- resultados da busca ---- */
  .rbusca {
    display: flex; flex-direction: column; min-width: 0; overflow: hidden;
    border: 1px solid var(--accent-linha); border-radius: var(--r-3);
    background: var(--surface); box-shadow: var(--e1);
  }
  .rbusca-topo {
    flex: 0 0 auto; display: flex; align-items: center; gap: var(--s2);
    padding: 7px var(--s3); background: var(--accent-suave);
    border-bottom: 1px solid var(--accent-linha);
  }
  .rbusca-conta {
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .rbusca-fechar {
    margin-left: auto; font: inherit; font-size: 17px; line-height: 1; cursor: pointer;
    background: transparent; color: var(--ink-3);
    border: 1px solid transparent; border-radius: var(--r-1); padding: 1px 8px;
    transition: color var(--dur-1), border-color var(--dur-1);
  }
  .rbusca-fechar:hover { color: var(--accent); border-color: var(--accent-linha); }
  .rbusca-nada {
    padding: var(--s4); display: flex; flex-direction: column;
    gap: var(--s3); align-items: flex-start;
  }
  .rbusca-nada p { margin: 0; font-size: var(--t-ui); color: var(--ink-2); line-height: var(--lh-read); max-width: 62ch; }

  .rlinhas { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; min-height: 0; max-height: 46vh; }

  /* Uma linha de resultado: título, caminho, o quanto casou e as duas ações
     que valem sem abrir nada. Copiar aqui era o ganho principal da lista e
     continua existindo. */
  .rlinha {
    display: flex; align-items: center; gap: var(--s2);
    min-height: 52px; padding: 0 var(--s2) 0 0;
    border-bottom: 1px solid var(--line);
    transition: background var(--dur-1);
  }
  .rlinha:last-child { border-bottom: 0; }
  .rlinha:hover { background: var(--surface-2); }
  .rlinha.on { background: var(--sel-bg); box-shadow: inset 2px 0 0 var(--sel-linha); }
  .rlinha.interno { border-left: 3px solid var(--warn); }

  .rlinha-txt {
    flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px;
    font: inherit; text-align: left; cursor: pointer;
    background: transparent; border: 0; padding: var(--s2) var(--s3);
    border-radius: var(--r-1); color: var(--ink);
  }
  .rlinha-tit {
    font-size: var(--t-ui); font-weight: 600; line-height: var(--lh-tight);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rlinha.on .rlinha-tit { font-weight: 700; color: var(--accent-forte); }
  .rlinha-onde {
    font-family: var(--font-mono); font-size: var(--t-tag); color: var(--ink-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* quanto esta resposta casou com a pergunta, em relação à melhor.
     Barra e não número: o número não significaria nada para quem lê. */
  .rlinha-rel {
    flex: 0 0 auto; width: 46px; height: 4px; border-radius: 2px;
    background: var(--surface-3); overflow: hidden;
  }
  .rlinha-rel-barra { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  @media (max-width: 560px) { .rlinha-rel { display: none; } }

  .rlinha-acoes { flex: 0 0 auto; display: flex; gap: 2px; }

  .ricone {
    font: inherit; font-size: var(--t-ui); line-height: 1; cursor: pointer;
    background: transparent; color: var(--ink-3);
    border: 1px solid transparent; border-radius: var(--r-1); padding: 5px 7px;
    transition: background var(--dur-1), color var(--dur-1), border-color var(--dur-1);
  }
  .ricone:hover { color: var(--accent); border-color: var(--accent-linha); background: var(--accent-suave); }
  .ricone.fixo { color: var(--accent); }
  .ricone.feito { color: var(--calm); border-color: var(--calm-linha); background: var(--calm-bg); }
  .ricone.sm { font-size: var(--t-meta); padding: 3px 5px; }

  /* ---- a leitura, agora ocupando a tela toda ----
     quatro camadas: caminho (mono 10,5) → título (19) → ações → corpo (15/1,6).
     Sem coluna ao lado, ela rola com a página em vez de ter rolagem propria:
     duas barras de rolagem aninhadas confundiam mais que ajudavam. */
  .rleitura {
    display: flex; flex-direction: column; min-width: 0;
    border: 1px solid var(--line); border-radius: var(--r-3); background: var(--surface);
    overflow: hidden;
  }
  .rleitura.interno { border-color: var(--warn-linha); }

  .rleitura-vazia {
    padding: var(--s6) var(--s5); text-align: center;
    color: var(--ink-3); font-size: var(--t-read); line-height: var(--lh-read);
  }

  .rleitura-topo {
    padding: var(--s4) var(--s5);
    border-bottom: 1px solid var(--line); background: var(--surface-2);
    display: flex; flex-direction: column; gap: var(--s2);
  }
  .rleitura-caminho { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  .rleitura-caminho > span:first-child {
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 600;
    letter-spacing: .11em; text-transform: uppercase; color: var(--ink-3);
    min-width: 0; overflow-wrap: anywhere;
  }
  .rleitura-tit {
    margin: 0; font-size: var(--t-title); font-weight: 650;
    letter-spacing: -.015em; line-height: var(--lh-tight); overflow-wrap: anywhere;
  }
  .rleitura-acoes {
    display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap;
    padding-top: var(--s2);
  }
  .rleitura-acoes .btn { white-space: normal; text-align: center; min-width: 0; }
  /* editar e remover saem do meio das ações de copiar e vão para o canto */
  .rcard-editar {
    margin-left: auto; font: inherit; font-size: var(--t-meta); line-height: 1;
    cursor: pointer; padding: 5px var(--s2); border-radius: var(--r-1);
    background: transparent; color: var(--ink-3); border: 1px solid transparent;
    transition: color var(--dur-1), border-color var(--dur-1);
  }
  .rcard-editar:hover { color: var(--accent); border-color: var(--accent-linha); }
  .rleitura-acoes .rcard-editar ~ .ricone:hover {
    color: var(--crit); border-color: var(--crit-linha); background: var(--crit-bg);
  }
  .rcard-interno, .rcard-rascunho {
    font-family: var(--font-mono); font-size: var(--t-tag); font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase;
    color: var(--warn); background: var(--warn-bg);
    border: 1px solid var(--warn-linha); border-radius: var(--r-1); padding: 3px 7px;
  }

  /* O texto da resposta e o motivo de a tela existir: ele fica em --ink, nao
     em --ink-2, e a medida cai para 66ch. Linha longa demais faz o olho perder
     a volta, e este texto e lido inteiro antes de ser colado. */
  .rleitura-corpo {
    padding: var(--s5); display: flex; flex-direction: column; gap: var(--s4);
  }
  .rleitura-corpo > p {
    margin: 0; font-size: var(--t-read); line-height: var(--lh-read); color: var(--ink);
    max-width: 66ch; overflow-wrap: anywhere;
  }
  .rleitura-corpo strong { font-weight: 700; }

  /* Bullet vira item de verdade, e a frase que explica aquele item entra
     dentro dele, recuada e mais quieta. Antes os dois eram paragrafos irmaos
     com o mesmo peso, e a explicacao parecia um item novo. */
  .rtexto-lista {
    list-style: none; margin: 0; padding: 0; max-width: 66ch;
    display: flex; flex-direction: column; gap: var(--s3);
  }
  .rtexto-lista > li {
    position: relative; padding-left: var(--s5);
    display: flex; flex-direction: column; gap: 3px;
  }
  .rtexto-lista > li::before {
    content: ""; position: absolute; left: 6px; top: 9px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  }
  .rtexto-item {
    margin: 0; font-size: var(--t-read); line-height: var(--lh-read);
    color: var(--ink); font-weight: 600;
  }
  .rtexto-sub {
    margin: 0; font-size: var(--t-ui); line-height: var(--lh-read); color: var(--ink-2);
  }
  .rtexto-sub strong { color: var(--ink); }

  /* "Obs.:" e um aparte, nao a linha de raciocinio principal */
  .rtexto-nota {
    font-size: var(--t-ui) !important; color: var(--ink-2) !important;
    padding-left: var(--s3); border-left: 2px solid var(--line-forte);
  }

  .rcard-print {
    padding: 0 var(--s5) var(--s4); display: flex; flex-direction: column;
    gap: var(--s3); align-items: flex-start; flex: 0 0 auto;
  }
  .rcard-img { margin: 0; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .rcard-img img {
    max-width: 100%; max-height: 300px; width: auto; cursor: zoom-in;
    border: 1px solid var(--line); border-radius: var(--r-2); background: var(--surface-2);
  }
  .rcard-img figcaption { font-size: var(--t-tag); color: var(--ink-3); font-family: var(--font-mono); letter-spacing: .06em; }

  /* print que não subiu deixa de ser espaço em branco */
  .rimg-falta {
    font-size: var(--t-meta); line-height: var(--lh-ui); color: var(--warn);
    background: var(--warn-bg); border: 1px solid var(--warn-linha);
    border-radius: var(--r-2); padding: var(--s3); max-width: 62ch;
  }
  .rimg-falta code { font-family: var(--font-mono); font-size: var(--t-tag); }

  /* ═══════════════════════ EDITOR E MODAIS ═══════════════════════ */
  .modal {
    position: fixed; inset: 0; z-index: 80; background: var(--veu);
    display: flex; align-items: flex-start; justify-content: center;
    padding: var(--s5); overflow-y: auto;
  }
  .modal-cx {
    width: min(680px, 100%); background: var(--surface);
    border: 1px solid var(--line-forte); border-radius: var(--r-3);
    box-shadow: var(--e2); display: flex; flex-direction: column; margin: auto;
  }
  .modal-topo {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line);
    background: var(--surface-2); border-radius: var(--r-3) var(--r-3) 0 0;
  }
  .modal-titulo {
    margin: 0; flex: 1 1 auto; min-width: 0;
    font-size: var(--t-title); font-weight: 650; letter-spacing: -.015em; line-height: var(--lh-tight);
  }
  .modal-x {
    flex: 0 0 auto; font: inherit; font-size: 20px; line-height: 1; cursor: pointer;
    background: transparent; color: var(--ink-3);
    border: 1px solid transparent; border-radius: var(--r-1); padding: 2px 9px;
    transition: color var(--dur-1), border-color var(--dur-1);
  }
  .modal-x:hover { color: var(--crit); border-color: var(--crit-linha); }
  .modal-corpo { padding: var(--s5); display: flex; flex-direction: column; gap: var(--s4); }
  .modal-nota { margin: 0; font-size: var(--t-meta); color: var(--ink-2); line-height: var(--lh-read); max-width: 74ch; }
  .modal-passos {
    margin: 0; padding-left: var(--s5);
    display: flex; flex-direction: column; gap: var(--s2);
    font-size: var(--t-ui); color: var(--ink-2); line-height: var(--lh-read);
  }
  .modal-aviso {
    margin: 0; font-size: var(--t-meta); line-height: var(--lh-read);
    color: var(--warn); background: var(--warn-bg);
    border: 1px solid var(--warn-linha); border-radius: var(--r-2); padding: var(--s3);
  }
  .modal-estado:empty { display: none; }
  .modal-estado {
    margin: 0; font-size: var(--t-ui); line-height: var(--lh-read);
    color: var(--ink-2); background: var(--surface-3);
    border: 1px solid var(--line); border-radius: var(--r-2); padding: var(--s3);
  }
  .modal-estado.ok   { color: var(--calm); background: var(--calm-bg); border-color: var(--calm-linha); }
  .modal-estado.ruim { color: var(--crit); background: var(--crit-bg); border-color: var(--crit-linha); }
  .modal-pe {
    display: flex; gap: var(--s2); flex-wrap: wrap;
    padding: var(--s4) var(--s5); border-top: 1px solid var(--line);
    background: var(--surface-2); border-radius: 0 0 var(--r-3) var(--r-3);
  }
  .modal-previa { display: flex; flex-direction: column; gap: var(--s2); }
  .modal-previa img {
    max-width: 100%; max-height: 190px; width: auto;
    border: 1px solid var(--line); border-radius: var(--r-2);
  }
  .modal-codigo {
