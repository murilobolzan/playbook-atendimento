<!-- Captura erro de sintaxe do conteudo.js para poder avisar em tela.
     Precisa vir ANTES do conteudo.js. -->
<script>
  window.__erroConteudo = null;
  window.addEventListener("error", function (e) {
    if (!window.__erroConteudo && e.filename && e.filename.indexOf("conteudo.js") !== -1) {
      window.__erroConteudo = { msg: e.message || "", linha: e.lineno || 0 };
    }
  });
</script>
<script>
  /* O GitHub Pages guarda cada arquivo por 10 minutos, separadamente. Sem isto,
     dava para pegar um index.html novo com um conteudo.js velho, e toda chave
     de texto recem-criada virava undefined: botao sem legenda, campo sem rotulo.
     A marca de minuto na URL faz os dois virem sempre da mesma leva. */
  (function () {
    var marca = Math.floor(Date.now() / 60000);
    var faltam = 2;
    function chegou() { if (--faltam === 0 && window.iniciar) window.iniciar(); }
    ["conteudo.js", "respostas.js"].forEach(function (arq) {
      var s = document.createElement("script");
      s.src = arq + "?t=" + marca;
      s.onload = chegou;
      s.onerror = function () { window.__erroConteudo = { msg: arq + " nao carregou", linha: 0 }; chegou(); };
      document.head.appendChild(s);
    });
  })();
</script>
<script>
"use strict";

/* ---------- rede de segurança ----------
   Se o conteudo.js tiver erro de sintaxe, o navegador aborta o arquivo
   inteiro e nenhuma das listas existe. Sem isso, a tela ficaria vazia
   e ninguém saberia por quê. */
function conferirConteudo() {
  var faltando = [];
  if (typeof D === "undefined") faltando.push("D");
  if (typeof ETAPAS === "undefined") faltando.push("ETAPAS");
  if (typeof PORTOES === "undefined") faltando.push("PORTOES");
  if (typeof TEMPOS === "undefined") faltando.push("TEMPOS");
  if (typeof CATEGORIAS === "undefined") faltando.push("CATEGORIAS");
  if (typeof MODULOS === "undefined") faltando.push("MODULOS");
  if (typeof FUP === "undefined") faltando.push("FUP");
  if (typeof TEXTOS === "undefined") faltando.push("TEXTOS");
  if (typeof AVALIACAO === "undefined") faltando.push("AVALIACAO");
  if (typeof RESPOSTAS === "undefined") faltando.push("RESPOSTAS");
  if (!faltando.length) return true;

  var REPO = "https://github.com/murilobolzan/playbook-atendimento";
  var err = window.__erroConteudo || {};
  var linha = err.linha > 0 ? err.linha : 0;

  var pista = linha
    ? "O navegador parou na <strong>linha " + linha + "</strong> do <code>conteudo.js</code>. " +
      "Atenção: quando falta vírgula, o erro real fica na <strong>linha de cima</strong> — " +
      "confira a " + (linha - 1) + " antes da " + linha + "."
    : "O arquivo <code>conteudo.js</code> não carregou.";

  var msg = err.msg ? '<p class="err-tec">' + err.msg.replace(/</g, "&lt;") + "</p>" : "";

  var linkArquivo = REPO + "/blob/main/conteudo.js" + (linha ? "#L" + linha : "");
  var linkHist = REPO + "/commits/main/conteudo.js";

  document.body.innerHTML =
    '<div class="errbox">' +
      '<span class="err-tag">Playbook fora do ar</span>' +
      "<h1>O conteúdo não carregou</h1>" +
      "<p>" + pista + " Quase sempre é uma destas quatro coisas na última edição:</p>" +
      "<ol>" +
        "<li><strong>Vírgula faltando</strong> no fim de um item da lista. Todo item leva vírgula, menos o último.</li>" +
        "<li><strong>Aspas abertas e não fechadas</strong> em alguma frase.</li>" +
        "<li><strong>Chave <code>{</code> ou colchete <code>[</code></strong> sem o par de fechamento.</li>" +
        "<li>Uma <strong>tag <code>&lt;strong&gt;</code></strong> sem a barra no fechamento.</li>" +
      "</ol>" +
      msg +
      '<div class="err-acoes">' +
        '<a class="err-btn" href="' + linkArquivo + '" target="_blank" rel="noopener">Abrir o conteudo.js' + (linha ? " na linha " + linha : "") + "</a>" +
        '<a class="err-btn ghost" href="' + linkHist + '" target="_blank" rel="noopener">Voltar para a versão anterior</a>' +
      "</div>" +
      '<p class="err-nota">Para desfazer: abra o histórico, entre no último commit e use <strong>Revert</strong>. ' +
      "O playbook volta ao ar em cerca de 40 segundos.</p>" +
      '<p class="err-nota">Listas que não chegaram: <code>' + faltando.join("</code>, <code>") + "</code></p>" +
    "</div>";

  var css = document.createElement("style");
  css.textContent =
    ".errbox{max-width:60ch;margin:9vh auto;padding:0 24px;font-family:var(--font-ui)}" +
    ".errbox h1{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:10px 0 14px}" +
    ".errbox p{font-size:15px;line-height:1.6;color:var(--ink-2);margin:0 0 14px}" +
    ".errbox ol{font-size:14.5px;line-height:1.6;color:var(--ink-2);padding-left:20px;margin:0 0 16px;" +
      "display:flex;flex-direction:column;gap:7px}" +
    ".errbox strong{color:var(--ink)}" +
    ".errbox code{font-family:var(--font-mono);font-size:13px;background:var(--surface);" +
      "border:1px solid var(--line);border-radius:2px;padding:1px 5px}" +
    ".err-tag{font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;" +
      "text-transform:uppercase;color:var(--crit);background:var(--crit-bg);" +
      "border:1px solid var(--crit);border-radius:2px;padding:3px 8px;display:inline-block}" +
    ".err-tec{font-family:var(--font-mono);font-size:12.5px;color:var(--crit);background:var(--crit-bg);" +
      "border:1px solid var(--line);border-left:3px solid var(--crit);border-radius:2px;" +
      "padding:10px 12px;overflow-x:auto;white-space:pre-wrap}" +
    ".err-acoes{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}" +
    /* estes tokens apontavam para --wine/--on-wine/--line-strong, que nao
       existem mais: o botao ficava sem fundo justo na tela de erro */
    ".err-btn{font-size:13.5px;font-weight:600;text-decoration:none;border-radius:var(--r-2);padding:8px 14px;" +
      "background:var(--accent);color:var(--accent-sobre);border:1px solid var(--accent)}" +
    ".err-btn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--line-forte);font-weight:500}" +
    ".err-nota{font-size:12.5px;color:var(--ink-3)}";
  document.head.appendChild(css);

  return false;
}

/* ═══════════════════════════════════════════════════════════════════════════
   MOTOR — lê tudo de conteudo.js. Não precisa editar nada aqui.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ---------- estado ---------- */
const state = {
  tempo:"novo",
  feito:{ ia:false, problema:false, ticket:false },
  aba:1,
  cat:null, mod:null,
  secao:"guia",
  sub:null,
  busca:"",
  abaAberta:null,       /* acordeao: uma aba da plataforma aberta por vez */
  ordenando:false,      /* modo de reordenar abas e sub-abas */
  arvoreOrdem:null,     /* copia de trabalho enquanto se reordena */

  /* respostas rapidas: a lista a esquerda e a leitura a direita */
  escolhida:null,        /* a resposta aberta no painel de leitura */
  tagsAtivas:[],         /* chips de palavra-chave ligados */
  chipsTodos:false,      /* mostrar a lista inteira de palavras-chave */
  vaziasVisiveis:false,  /* sub-abas sem resposta ficam escondidas */
  fixados:[],            /* o boot preenche pelo localStorage */
  recentes:[],
  printsAbertos:{},      /* print visivel dentro da resposta */
  fup:"pendente",
  fup2_em:null,
  fup2_limite:null,

  /* regua de avaliacao: um criterio aberto por vez, um nivel por vez.
     Nao guarda nota: nivelSel diz so qual das 6 frases esta visivel. */
  critAberto:1,
  nivelSel:{}
};

/* ---------- helpers ---------- */
const el = (t,c,h) => { const n = document.createElement(t); if (c) n.className = c; if (h !== undefined) n.innerHTML = h; return n; };
const src = (n,s) => { n.setAttribute("data-src", s); return n; };
const cat = id => CATEGORIAS.find(c => c.id === id);
const mod = id => MODULOS.find(m => m.id === id);
const portoesOk = () => state.feito.ia && state.feito.problema && state.feito.ticket;
const hhmm = d => String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");

/* ---------- gaveta da documentação ----------
   Abre a documentação por cima do playbook, preservando o estado do
   atendimento. Ctrl+clique e clique do meio continuam abrindo em nova aba. */
function abrirDoc(url, titulo, ehPergunta) {
  document.getElementById("gaveta-eyebrow").textContent = ehPergunta ? TEXTOS.docPergunta : TEXTOS.docTitulo;
  document.getElementById("gaveta-titulo").textContent = titulo;
  document.getElementById("gaveta-nova-aba").href = url;
  document.getElementById("gaveta-frame").src = url;
  document.getElementById("gaveta").hidden = false;
  document.body.classList.add("gaveta-aberta");
  document.getElementById("gaveta-fechar").focus();
}

function fecharDoc() {
  document.getElementById("gaveta").hidden = true;
  document.getElementById("gaveta-frame").src = "about:blank";
  document.body.classList.remove("gaveta-aberta");
}

/* liga um link para abrir na gaveta em vez de trocar de página */
function linkDoc(a, url, titulo) {
  a.href = url;
  a.rel = "noopener";
  a.target = "_blank";
  a.addEventListener("click", function (e) {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;
    e.preventDefault();
    abrirDoc(url, titulo, false);
  });
  return a;
}

function perguntarIA() {
  const campo = document.getElementById("q-ia");
  const q = campo ? campo.value.trim() : "";
  const url = q ? D + "?ask=" + encodeURIComponent(q) : D;
  abrirDoc(url, q || TEXTOS.docTitulo, !!q);
}

/* o painel de dúvida mora dentro do guia, que é onde a solução acontece */
function blocoDuvida() {
  const box = src(el("section","panel duvida"), "[10] duvida* + busca*");

  const h = el("div","panel-h");
  h.append(el("span","eyebrow duvida-tag", TEXTOS.duvidaTag));
  h.append(el("h3","duvida-titulo", TEXTOS.railBusca));
  box.append(h);

  const b = el("div","panel-b");
  b.append(el("p","duvida-hint", TEXTOS.buscaHint));

  const cx = el("div","search");
  const inp = document.createElement("input");
  inp.type = "search";
  inp.id = "q-ia";
  inp.autocomplete = "off";
  inp.placeholder = TEXTOS.buscaPlaceholder;
  inp.setAttribute("aria-label", TEXTOS.railBusca);
  inp.value = state.perguntaIA || "";
  inp.addEventListener("input", () => { state.perguntaIA = inp.value; });
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); perguntarIA(); } });
  cx.append(inp);
  b.append(cx);

  const bt = el("button","btn cheio", TEXTOS.buscaBotao);
  bt.type = "button";
  bt.onclick = perguntarIA;
  b.append(bt);

  b.append(el("p","duvida-rodape", TEXTOS.duvidaRodape));
  box.append(b);
  return box;
}

/* troca {espera}, {limite}, {total} e {falta} pelos valores reais */
function fmt(s, extra) {
  const v = Object.assign({
    espera: FUP.esperaMin,
    limite: FUP.limiteMin,
    total: FUP.esperaMin + FUP.limiteMin
  }, extra || {});
  return String(s).replace(/\{(\w+)\}/g, (m,k) => (k in v ? v[k] : m));
}


/* ---------- textos fixos da moldura ---------- */
function renderMoldura() {
  document.getElementById("t-marca").textContent = TEXTOS.marca;
  document.getElementById("t-titulo").textContent = TEXTOS.titulo;
  document.getElementById("t-sub").textContent = TEXTOS.subtitulo;
  document.getElementById("q").title = TEXTOS.buscaGlobalDica;
  document.getElementById("t-busca-rot").textContent = TEXTOS.buscaRotulo;
  document.getElementById("t-side-rot").textContent = TEXTOS.sideRotulo;
  document.getElementById("q").placeholder = TEXTOS.buscaColePergunta;
  document.getElementById("q").setAttribute("aria-label", TEXTOS.buscaColePergunta);
  document.getElementById("btn-limpa").setAttribute("aria-label", TEXTOS.buscaLimpar);
  document.getElementById("btn-limpa").hidden = !state.busca;

  /* a lupa pertence ao tópico de respostas rápidas: filtra a lista ao vivo */
  document.getElementById("caixa-busca").hidden = state.secao !== "respostas";
  document.getElementById("reset").textContent = TEXTOS.rodapeBotao;
  document.getElementById("t-rodape").innerHTML = TEXTOS.rodapeAviso;

  /* a navegação por etapa só faz sentido dentro do guia */
  const passos = document.getElementById("passos");
  const noGuia = state.secao === "guia";
  passos.hidden = !noGuia;
  if (noGuia) {
    const voltar = document.getElementById("btn-voltar");
    const avancar = document.getElementById("btn-avancar");
    voltar.textContent = TEXTOS.navVoltar;
    avancar.textContent = TEXTOS.navAvancar;
    voltar.disabled = state.aba <= 1;
    avancar.disabled = state.aba >= ETAPAS.length;
    document.getElementById("t-onde").textContent =
      fmt(TEXTOS.navOnde, { atual: state.aba, total: ETAPAS.length });
  }
}

/* ---------- o que aparece na área de conteúdo ---------- */
/* A busca filtra a lista dentro do tópico de respostas: ela nao troca mais
   a tela inteira, entao a barra e o painel de leitura ficam parados. */
function renderAbaVisivel() {
  const guia = state.secao === "guia";
  const mapa = {
    flow: guia && state.aba <= 3,
    out:  guia && state.aba === 4,
    fup:  guia && state.aba === 5,
    aval: state.secao === "criterios",
    resp: state.secao === "respostas"
  };
  for (const id in mapa) document.getElementById(id).hidden = !mapa[id];
}

function irParaSecao(secao, extra) {
  state.secao = secao;
  state.busca = "";
  document.getElementById("q").value = "";
  if (secao === "guia" && extra) state.aba = extra;
  if (secao === "respostas") { state.sub = extra || null; state.tagsAtivas = []; }
  fecharMenu();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function irParaAba(n) {
  state.secao = "guia";
  state.aba = Math.min(Math.max(n, 1), ETAPAS.length);
  fecharMenu();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function fecharMenu() {
  document.body.classList.remove("menu-aberto");
  document.getElementById("btn-menu").setAttribute("aria-expanded", "false");
}

/* ---------- altura do topo fixo ----------
   O trilho da esquerda gruda logo abaixo do cabeçalho. Medir em vez de
   chutar evita que ele passe por baixo quando o texto quebra linha. */
function medirTopo() {
  const topo = document.querySelector(".topbar");
  if (!topo) return;
  const h = Math.round(topo.getBoundingClientRect().height);
  if (h > 0) document.documentElement.style.setProperty("--stick", h + "px");

  /* A busca tambem gruda, logo abaixo do cabecalho, e as duas colunas de
     resposta grudam abaixo dela. Medir em vez de chutar, pela mesma razao do
     --stick: o rotulo quebra linha em tela estreita e o offset muda. Quando
     a busca esta escondida (fora das respostas), a altura da zero sozinha. */
  const busca = document.getElementById("caixa-busca");
  const hb = busca && !busca.hidden ? Math.round(busca.getBoundingClientRect().height) : 0;
  document.documentElement.style.setProperty("--busca-h", hb + "px");
}

let observadorTopo = null;   /* guardar a referência: observador sem dono pode ser coletado */

function observarTopo() {
  if (typeof ResizeObserver === "undefined") return;
  observadorTopo = new ResizeObserver(medirTopo);
  const topo = document.querySelector(".topbar");
  if (topo) observadorTopo.observe(topo);
  const busca = document.getElementById("caixa-busca");
  if (busca) observadorTopo.observe(busca);
}

/* ---------- barra lateral ---------- */
function renderSidebar() {
  const host = document.getElementById("side-nav");
  host.textContent = "";

  /* o topo da barra troca de tópico; embaixo vem só o conteúdo do escolhido */
  const topicos = [
    { id: "guia",      rot: TEXTOS.navGuia },
    { id: "criterios", rot: TEXTOS.navCriterios },
    { id: "respostas", rot: TEXTOS.navRespostas }
  ];

  const troca = el("div","topicos");
  troca.setAttribute("role","tablist");
  topicos.forEach(t => {
    const ativo = state.secao === t.id;
    const b = el("button","topico" + (ativo ? " on" : ""));
    b.type = "button";
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", String(ativo));
    b.append(el("span","topico-rot", t.rot));
    b.onclick = () => {
      if (t.id === "guia") irParaAba(state.aba);
      else irParaSecao(t.id);
    };
    troca.append(b);
  });
  host.append(troca);

  /* e abaixo, só o que pertence ao tópico ativo */
  const dentro = el("div","topico-dentro");

  if (state.secao === "guia") {
    dentro.append(el("span","nav-titulo", TEXTOS.navEtapas));
    ETAPAS.forEach((titulo, i) => {
      const n = i + 1;
      const concluida = n <= 3 && state.feito[PORTOES[n-1].id];
      const atual = n === state.aba;
      const trancada = n >= 4 && !portoesOk();
      const b = el("button","nav-item" + (atual ? " on" : "") + (concluida && !atual ? " ok" : ""));
      b.type = "button";
      b.disabled = trancada;
      b.title = trancada ? titulo + " — " + TEXTOS.spineTrancada : titulo;
      b.append(el("span","nav-n", concluida && !atual ? "✓" : String(n)), el("span","nav-txt", titulo));
      b.onclick = () => { if (!trancada) irParaAba(n); };
      dentro.append(b);
    });
  }

  if (state.secao === "criterios") {
    /* a barra lista os 4 criterios com o peso de cada um; clicar abre aquele */
    dentro.append(el("span","nav-titulo", AVALIACAO.titulo));
    AVALIACAO.criterios.forEach(c => {
      const b = el("button","nav-item" + (state.critAberto === c.n ? " on" : ""));
      b.type = "button";
      b.title = c.nome;
      b.append(el("span","nav-n", String(c.n)),
               el("span","nav-txt", c.nome),
               el("span","nav-conta", "×" + c.peso));
      b.onclick = () => {
        state.secao = "criterios";
        state.critAberto = c.n;
        fecharMenu();
        render();
        const alvo = document.querySelector("#aval .crit.on");
        if (alvo) alvo.scrollIntoView({ behavior: "smooth", block: "nearest" });
      };
      dentro.append(b);
    });
  }

  if (state.secao === "respostas") {
    /* As duas acoes cabem numa linha so: "Nova resposta" leva o espaco e o
       acesso vira a chave com o nome no title. Antes eram dois botoes de
       largura cheia empilhados, duas linhas antes da navegacao comecar. */
    const acoes = el("div","side-acoes");
    const linha = el("div","side-acoes-linha");
    const novo = el("button","btn sm", TEXTOS.editorNovo);
    novo.type = "button";
    novo.onclick = () => { const a = state.sub ? achaSub(state.sub) : null; abrirEditor(a && a.aba.aba, a && a.sub.sub); };
    linha.append(novo);
    const rotAcesso = temToken() ? TEXTOS.acessoBotaoOk : TEXTOS.acessoBotao;
    const acesso = el("button","btn ghost sm side-chave", "🔑");
    acesso.type = "button";
    acesso.title = rotAcesso;
    acesso.setAttribute("aria-label", rotAcesso);
    if (temToken()) acesso.classList.add("ok");
    acesso.onclick = abrirAcesso;
    linha.append(acesso);
    acoes.append(linha);
    const quantos = leRascunhos().length;
    if (quantos) {
      const exp = el("button","btn ghost sm cheio", fmt(TEXTOS.editorExportar, { n: quantos }));
      exp.type = "button";
      exp.onclick = () => mostrarCodigo(leRascunhos());
      acoes.append(exp);
    }
    dentro.append(acoes);

    /* Fixados e usadas ha pouco vem antes da arvore: sao as poucas
       respostas que respondem a maior parte do turno. */
    const planos = itensPlanos();
    const atalhos = (titulo, chaves) => {
      const achados = chaves.map(c => planos.find(x => x.chave === c)).filter(Boolean);
      if (!achados.length) return;
      dentro.append(el("span","nav-titulo", titulo));
      achados.forEach(x => {
        const b = el("button","nav-item" + (x.chave === state.escolhida ? " on" : ""));
        b.type = "button";
        b.title = x.aba + " › " + x.sub;
        b.append(el("span","nav-txt", x.item.titulo));
        b.onclick = () => { limparEscopo(); escolher(x.chave); };
        dentro.append(b);
      });
    };
    atalhos(TEXTOS.respFixados, state.fixados);
    atalhos(TEXTOS.respRecentes, state.recentes);

    /* ---- cabecalho das abas, com o botao de reordenar ---- */
    const cab = el("div","nav-cab");
    cab.append(el("span","nav-titulo", TEXTOS.navAbasPlataforma));
    const btOrdem = el("button","nav-ordem", state.ordenando ? TEXTOS.ordemSair : TEXTOS.ordemModo);
    btOrdem.type = "button";
    btOrdem.setAttribute("aria-pressed", String(!!state.ordenando));
    btOrdem.onclick = () => {
      if (state.ordenando) { sairOrdenacao(); return; }
      if (!temToken()) { alert(TEXTOS.ordemSemToken); abrirAcesso(); return; }
      entrarOrdenacao();
    };
    cab.append(btOrdem);
    dentro.append(cab);

    /* ═══════════ modo de reordenar ═══════════
       Mexe na ordem das abas e das sub-abas e grava no repositorio pelo mesmo
       caminho que publica uma resposta. Nenhum texto muda: so a ordem. */
    if (state.ordenando) {
      dentro.append(el("p","nav-ordem-nota", TEXTOS.ordemNota));

      const mover = (lista, i, d) => {
        const j = i + d;
        if (j < 0 || j >= lista.length) return;
        const t = lista[i]; lista[i] = lista[j]; lista[j] = t;
        render();
      };
      const setas = (lista, i) => {
        const cx = el("div","nav-setas");
        const cima = el("button","nav-seta-btn","⌃");
        cima.type = "button"; cima.title = TEXTOS.ordemSubir; cima.disabled = i === 0;
        cima.onclick = (e) => { e.stopPropagation(); mover(lista, i, -1); };
        const baixo = el("button","nav-seta-btn","⌄");
        baixo.type = "button"; baixo.title = TEXTOS.ordemDescer; baixo.disabled = i === lista.length - 1;
        baixo.onclick = (e) => { e.stopPropagation(); mover(lista, i, 1); };
        cx.append(cima, baixo);
        return cx;
      };

      state.arvoreOrdem.forEach((a, ia) => {
        const aberto = state.abaAberta === a.id;
        const linha = el("div","nav-ord-linha");
        linha.append(setas(state.arvoreOrdem, ia));
        const nome = el("button","nav-item nav-pai");
        nome.type = "button";
        nome.setAttribute("aria-expanded", String(aberto));
        nome.append(el("span","nav-seta","▶"), el("span","nav-txt", a.aba),
                    el("span","nav-conta", String(a.subs.reduce((s,x)=>s+x.itens.length,0))));
        nome.onclick = () => { state.abaAberta = aberto ? null : a.id; render(); };
        linha.append(nome);
        dentro.append(linha);
        if (!aberto) return;

        const filhos = el("div","nav-filhos");
        a.subs.forEach((x, is) => {
          const l2 = el("div","nav-ord-linha");
          l2.append(setas(a.subs, is));
          const n2 = el("span","nav-item nav-ord-nome");
          n2.append(el("span","nav-txt", x.sub), el("span","nav-conta", String(x.itens.length)));
          l2.append(n2);
          filhos.append(l2);
        });
        dentro.append(filhos);
      });

      const salvar = el("button","btn sm cheio", TEXTOS.ordemSalvar);
      salvar.type = "button";
      const aviso = el("p","nav-ordem-estado");
      salvar.onclick = () => salvarOrdem(salvar, aviso);
      const cxs = el("div","side-acoes");
      cxs.append(salvar, aviso);
      dentro.append(cxs);

      host.append(dentro);
      return;
    }

    /* ═══════════ navegacao normal ═══════════
       Tres niveis: aba › sub-aba › resposta. A resposta agora mora na arvore,
       porque a coluna de lista saiu — e assim sao dois cliques ate abrir uma
       resposta, contra os tres de antes. */

    /* a biblioteca inteira e o padrao: entrar aqui nunca da tela vazia */
    const todasAbertas = state.abaAberta === null;
    const todas = el("button","nav-item" + (todasAbertas ? " on" : ""));
    todas.type = "button";
    todas.append(el("span","nav-txt", TEXTOS.respTodas), el("span","nav-conta", String(planos.length)));
    todas.onclick = () => { state.abaAberta = null; limparEscopo(); render(); };
    dentro.append(todas);

    arvore().forEach(a => {
      const aberto = state.abaAberta === a.id;
      const total = a.subs.reduce((s,x) => s + x.itens.length, 0);

      const pai = el("button","nav-item nav-pai" + (aberto ? " on" : ""));
      pai.type = "button";
      pai.setAttribute("aria-expanded", String(aberto));
      pai.title = fmt(TEXTOS.respAbaTudo, { aba: a.aba });
      pai.append(el("span","nav-seta","▶"), el("span","nav-txt", a.aba), el("span","nav-conta", String(total)));
      pai.onclick = () => { state.abaAberta = aberto ? null : a.id; render(); };
      dentro.append(pai);
      if (!aberto) return;

      /* sub-aba sem resposta nao ajuda no turno: fica atras de um pedido */
      const subs = state.vaziasVisiveis ? a.subs : a.subs.filter(x => x.itens.length);
      const filhos = el("div","nav-filhos");

      subs.forEach(x => {
        /* a sub-aba virou rotulo: quem se clica agora e a resposta */
        const rot = el("div","nav-sub");
        rot.append(el("span","nav-txt", x.sub));
        if (x.itens.length) rot.append(el("span","nav-conta", String(x.itens.length)));
        filhos.append(rot);

        x.itens.forEach(it => {
          const chave = idDe(a.id + "-" + x.id + "-" + it.titulo);
          const r = el("div","nav-resp" + (chave === state.escolhida ? " on" : "") + (it.interno ? " interno" : ""));
          const b = el("button","nav-item nav-resp-txt");
          b.type = "button";
          b.title = it.titulo;
          b.append(el("span","nav-txt", it.titulo));
          b.onclick = () => { state.sub = x.id; escolher(chave); };
          r.append(b);
          const cp = el("button","ricone sm","⧉");
          cp.type = "button";
          cp.dataset.icone = "1";
          cp.title = TEXTOS.respCopiarRapido;
          cp.onclick = () => { registraRecente(chave); copiarResposta(it, cp, !!it.imagem); };
          r.append(cp);
          filhos.append(r);
        });
      });

      if (a.subs.length > subs.length) {
        const mais = el("button","nav-item nav-vazia");
        mais.type = "button";
        mais.append(el("span","nav-txt", TEXTOS.respMostrarVazias));
        mais.onclick = () => { state.vaziasVisiveis = true; render(); };
        filhos.append(mais);
      }
      dentro.append(filhos);
    });

    if (state.vaziasVisiveis) {
      const menos = el("button","nav-item nav-vazia");
      menos.type = "button";
      menos.append(el("span","nav-txt", TEXTOS.respOcultarVazias));
      menos.onclick = () => { state.vaziasVisiveis = false; render(); };
      dentro.append(menos);
    }
  }

  host.append(dentro);
}

/* volta a biblioteca inteira: nenhum filtro, nenhuma sub-aba */
function limparEscopo() {
  state.sub = null;
  state.tagsAtivas = [];
  state.busca = "";
  document.getElementById("q").value = "";
}

/* ---------- etapas 1 a 3 ---------- */
function renderFlow() {
  const host = document.getElementById("flow");
  host.textContent = "";
  if (state.aba > 3) return;

  const i = state.aba - 1;
  const p = PORTOES[i];
  const feito = state.feito[p.id];

  const card = src(el("div", "stage is-active" + (feito ? " is-done" : "")), "[3] PORTOES");

  const head = el("div", "st-head");
  head.append(el("span","st-n", feito ? "✓" : String(i+1)));
  head.append(el("span","st-title", p.titulo));
  head.append(el("span","st-sub", feito ? TEXTOS.etapaConcluida : ""));

  /* O lapis so existe para quem tem token com permissao de escrita. Quem abre
     o link sem token nem ve o botao — e forcar o botao nao adianta, porque o
     GitHub recusa a gravacao. O portao e a permissao do repositorio. */
  if (temToken()) {
    const lapis = el("button","st-editar", TEXTOS.guiaEditar);
    lapis.type = "button";
    lapis.title = fmt(TEXTOS.guiaEditarTitulo, { n: i + 1 });
    lapis.onclick = () => abrirEditorEtapa(i);
    head.append(lapis);
  }
  card.append(head);

  const body = el("div","st-body");
  body.append(el("p","lead", p.lead));

  /* O par de contraste: faca e nao faca lado a lado, nao empilhados.
     Empilhados, quem varre de cima para baixo le os dois como continuacao;
     lado a lado, com familias de cor opostas, o par se le em um golpe. */
  const par = el("div","st-par");

  const ul = el("ul","checklist");
  ul.dataset.rot = TEXTOS.etapaFaca;
  p.itens.forEach(x => ul.append(el("li","",x)));
  par.append(ul);

  const stop = el("div","callout c-stop");
  stop.append(el("span","ch", TEXTOS.etapaNaoFaca));
  const su = el("ul");
  p.nunca.forEach(x => su.append(el("li","",x)));
  stop.append(su);
  par.append(stop);

  body.append(par);

  /* a classificação do ticket acontece aqui, na etapa que cria o ticket */
  if (p.id === "ticket") body.append(blocoEixos());

  const adv = el("div","advance");
  const temaFalta = p.id === "ticket" && (!state.cat || !state.mod);
  const b = el("button","btn", (feito ? "✓ " : "") + p.cta);
  b.type = "button";
  b.disabled = temaFalta;
  b.onclick = () => { state.feito[p.id] = true; irParaAba(state.aba + 1); };
  adv.append(b, el("span","why", temaFalta ? TEXTOS.eixoFaltaBotao : p.why));
  body.append(adv);

  card.append(body);
  host.append(card);
}

/* tempo de plataforma do cliente — vive na etapa 5, junto da entrega.
   Mostra os dois caminhos lado a lado e destaca o escolhido. */
function blocoModoEntrega() {
  const box = src(el("div","block decisao"), "[4] TEMPOS");
  box.append(el("h3","", TEXTOS.resTempoLabel));

  const cards = el("div","modo-cards");
  cards.setAttribute("role","group");
  cards.setAttribute("aria-label", TEXTOS.resTempoLabel);
  TEMPOS.forEach(o => {
    const sel = state.tempo === o.id;
    const b = el("button","modo-card" + (sel ? " on" : ""));
    b.type = "button";
    b.setAttribute("aria-pressed", String(sel));
    b.append(
      el("span","modo-rot", o.rot),
      el("span","modo-modo", o.modo),
      el("span","modo-txt", o.txt)
    );
    b.onclick = () => { state.tempo = o.id; render(); };
    cards.append(b);
  });

  box.append(cards, el("span","microhint", TEXTOS.resTempoHint));
  return box;
}

/* eyebrow em branco simplesmente nao aparece */
function poeEyebrow(pai, txt) { if (txt) pai.append(el("span","eyebrow", txt)); }

/* ---------- etapa 4 ---------- */
/* A escolha do tema mora dentro da etapa 3, junto da criacao do ticket.
   Sem ela o botao da etapa 3 nao libera, porque e o tema que monta o guia. */
function blocoEixos() {
  const caixa = src(el("div","eixos"), "[6] CATEGORIAS + [7] MODULOS");
  caixa.append(el("span","eixos-tag", TEXTOS.eixoTag));

  const bloco1 = el("div","eixo");
  const h1 = el("div","step-h");
  poeEyebrow(h1, TEXTOS.eixo1Eyebrow);
  h1.append(el("h3","", TEXTOS.eixo1Titulo), el("span","note", TEXTOS.eixo1Nota));
  bloco1.append(h1);
  const g1 = el("div","cards");
  CATEGORIAS.forEach(c => {
    const b = el("button","card");
    b.type = "button";
    b.setAttribute("aria-pressed", String(state.cat === c.id));
    b.append(el("span","ct", c.trilha), el("span","cn", c.nome), el("span","cd", c.desc));
    b.onclick = () => { state.cat = state.cat === c.id ? null : c.id; resetFup(); render(); };
    g1.append(b);
  });
  bloco1.append(g1);

  const bloco2 = el("div","eixo");
  const h2 = el("div","step-h");
  poeEyebrow(h2, TEXTOS.eixo2Eyebrow);
  h2.append(el("h3","", TEXTOS.eixo2Titulo), el("span","note", TEXTOS.eixo2Nota));
  bloco2.append(h2);
  const g2 = el("div","cards densa");
  MODULOS.forEach(m => {
    const b = el("button","card");
    b.type = "button";
    b.setAttribute("aria-pressed", String(state.mod === m.id));
    b.append(el("span","ct", m.area), el("span","cn", m.nome));
    b.onclick = () => { state.mod = state.mod === m.id ? null : m.id; resetFup(); render(); };
    g2.append(b);
  });
  bloco2.append(g2);

  caixa.append(bloco1, bloco2);
  return caixa;
}

/* resumo do tema escolhido, mostrado no guia de atendimento */
function blocoTema(c, m) {
  const box = el("div","tema");
  box.append(el("span","tema-tag", TEXTOS.temaTag));
  const chips = el("div","tema-chips");
  chips.append(el("span","tema-chip", c.nome), el("span","tema-chip", m.nome));
  box.append(chips);
  return box;
}

/* ---------- etapa 5 ---------- */
function renderOut() {
  const host = document.getElementById("out");
  host.textContent = "";

  if (!portoesOk()) {
    host.append(el("div","empty", TEXTOS.abaTrancada));
    return;
  }
  if (!state.cat || !state.mod) {
    const falta = !state.cat && !state.mod ? "a natureza do ticket e o módulo"
                : !state.cat ? "a natureza do ticket" : "o módulo";
    host.append(el("div","empty", fmt(TEXTOS.eixoVazio, { falta })));
    return;
  }

  const c = cat(state.cat), m = mod(state.mod);

  const wrap = el("div","result");

  /* o tema vem escolhido da etapa anterior: aparece como identidade, nao como pergunta */
  const head = el("div","rhead");
  poeEyebrow(head, TEXTOS.resEyebrow);
  head.append(el("h2","rtitle", ETAPAS[3]));
  wrap.append(head);

  const corpo = el("div","rsolo");

  /* o tema vem da etapa 3: aqui so aparece a escolha, sem pedir de novo */
  corpo.append(blocoTema(c, m));

function resetFup() {
  state.fup = "pendente";
  state.fup2_em = null;
  state.fup2_limite = null;
}

  const arv = src(el("div","fup"), "[9] FUP");

  if (state.fup === "pendente") {
    const act = el("div","advance");

    n1.append(act);
  }
  arv.append(n1, el("div","fconn","↓"));

  /* --- FUP 2 --- */
  const ativo2 = state.fup === "fup1_sem_resposta";
  const n2 = el("div","fnode" + (ativo2 ? " on" : (state.fup === "pendente" ? "" : " spent")));
  const h2 = el("div","fnode-h");
  h2.append(el("span","ft", FUP.f2Nome), el("span","fw", fmt(FUP.f2Quando)));
  if (state.fup2_em) h2.append(el("span","clock", TEXTOS.fupEnviarAs + " " + hhmm(state.fup2_em)));
  n2.append(h2);
  const say2 = el("div","callout c-say");
  say2.append(el("span","ch", TEXTOS.fupMandeAssim), el("p","", FUP.f2Mensagem));
  n2.append(say2);

  const br2 = el("div","branches");
  const b2y = el("div","branch yes");
  b2y.append(el("span","bl", FUP.f2SimTitulo), el("span","bt", fmt(FUP.f2SimTexto)));
  const b2n = el("div","branch no");

    el("span","bt", fmt(FUP.f2NaoTexto) +
      (state.fup2_limite ? ' <span class="clock">' + TEXTOS.fupAPartirDas + " " + hhmm(state.fup2_limite) + "</span>" : "")));
  br2.append(b2y, b2n);

/* ---------- aba de consulta: a regua de avaliacao ---------- */
function renderAvaliacao() {
  const host = document.getElementById("aval");
  host.textContent = "";

  const wrap = el("div","result");

  const head = el("div","rhead");
  head.append(el("h2","rtitle", AVALIACAO.titulo));
  head.append(el("p","rprazo", AVALIACAO.subtitulo));
  wrap.append(head);

  const corpo = src(el("div","rsolo"), "[11] AVALIACAO");

  /* Antes os 4 critérios abriam todos de uma vez, e cada régua 0–5 era uma
     lista vertical de frases inteiras: 24 blocos de texto numa tela, que
     ninguém lê no meio do turno.

     Agora é um acordeão de critério com a régua na horizontal: um critério
     aberto por vez, um nível por vez, e o nível seguinte atenuado embaixo,
     que é a resposta para "o que falta para subir".

     É um leitor, não um formulário: clicar troca qual das 6 frases aparece.
     Não calcula média e não guarda nada — as frases, os pesos e a explicação
     do cálculo continuam vindo de AVALIACAO, sem uma palavra nova. */
  {
    const bloco = el("section","grupo");

    AVALIACAO.criterios.forEach(c => {
      const aberto = state.critAberto === c.n;
      const card = el("article","crit" + (aberto ? " on" : ""));

      const ch = el("button","crit-h");
      ch.type = "button";
      ch.setAttribute("aria-expanded", String(aberto));
      ch.title = aberto ? TEXTOS.avalFechar : TEXTOS.avalAbrir;
      ch.append(el("span","crit-n", String(c.n)));
      ch.append(el("h4","crit-nome", c.nome));
      ch.append(el("span","crit-peso", AVALIACAO.pesoLabel + " ×" + c.peso));
      ch.append(el("span","crit-seta","▶"));
      ch.onclick = () => { state.critAberto = aberto ? null : c.n; render(); };
      card.append(ch);

      if (aberto) {
        const cp = el("div","crit-corpo");

        const obs = el("p","crit-obs");
        obs.innerHTML = "<strong>" + AVALIACAO.observarLabel + ":</strong> " + c.observar;
        cp.append(obs);

        /* a trilha põe os 6 níveis na horizontal, para dar para comparar */
        const nivel = state.nivelSel[c.n] !== undefined ? state.nivelSel[c.n] : c.niveis.length - 1;
        const tcx = el("div","trilha-cx");
        tcx.append(el("span","trilha-rot", TEXTOS.avalNotaRotulo));
        const tr = el("div","trilha");
        tr.setAttribute("role","group");
        tr.setAttribute("aria-label", TEXTOS.avalNotaRotulo + " — " + c.nome);
        c.niveis.forEach((txt, n) => {
          const b = el("button","", String(n));
          b.type = "button";
          b.setAttribute("aria-pressed", String(n === nivel));
          b.title = TEXTOS.avalNivel + " " + n;
          b.onclick = () => { state.nivelSel[c.n] = n; render(); };
          tr.append(b);
        });
        tcx.append(tr);
        const tpe = el("div","trilha-pe");
        tpe.append(el("span","", TEXTOS.avalExtremoBaixo), el("span","", TEXTOS.avalExtremoAlto));
        tcx.append(tpe);
        cp.append(tcx);

        /* o texto de um nível só, e nos extremos a cor diz o que ele significa */
        const ultimo = c.niveis.length - 1;
        const extremo = nivel === 0 ? " baixo" : nivel === ultimo ? " alto" : "";
        const atual = el("div","nivel-atual" + extremo);
        atual.append(el("span","nivel-rot", TEXTOS.avalNivel + " " + nivel));
        atual.append(el("p","nivel-txt", c.niveis[nivel]));
        cp.append(atual);

        /* o que falta para subir: o mesmo texto do nível seguinte, atenuado */
        const prox = el("div","nivel-prox");
        if (nivel < ultimo) {
          prox.append(el("span","nivel-prox-rot", fmt(TEXTOS.avalProximo, { n: nivel + 1 })));
          prox.append(el("p","nivel-prox-txt", c.niveis[nivel + 1]));
        } else {
          prox.append(el("p","nivel-prox-txt", TEXTOS.avalTopo));
        }
        cp.append(prox);

        card.append(cp);
      }

      bloco.append(card);
    });

    corpo.append(bloco);
  }

  corpo.append(el("p","microhint", AVALIACAO.comoCalcula));
  wrap.append(corpo);
  host.append(wrap);
}

/* ---------- ampliar um print ---------- */
function ampliar(src, alt) {
  const fundo = el("div","zoom");
  const img = document.createElement("img");
  img.src = src;
  img.alt = alt;
  const fechar = el("button","zoom-fechar", TEXTOS.docFechar);
  fechar.type = "button";
  const sair = () => { fundo.remove(); document.body.classList.remove("gaveta-aberta"); };
  fechar.onclick = sair;
  fundo.onclick = (e) => { if (e.target === fundo) sair(); };
  document.addEventListener("keydown", function esc(e) {
    if (e.key === "Escape") { sair(); document.removeEventListener("keydown", esc); }
  });
  fundo.append(fechar, img);
  document.body.append(fundo);
  document.body.classList.add("gaveta-aberta");
  fechar.focus();
}

/* ---------- publicar direto no GitHub ----------
   O site é estático, então para uma alteração valer para o time ela precisa
   virar um commit no repositório. O playbook faz isso sozinho pela API do
   GitHub, usando um token que fica guardado só neste navegador.

   O token NUNCA entra no código publicado. Quem abre o site sem token só lê. */

const REPO = { dono: "murilobolzan", nome: "playbook-atendimento", arquivo: "respostas.js", ramo: "main" };
const CHAVE_TOKEN = "tokenGitHub";

function pegaToken() {
  try { return localStorage.getItem(CHAVE_TOKEN) || ""; } catch (e) { return ""; }
}

function guardaToken(t) {
  try {
    if (t) localStorage.setItem(CHAVE_TOKEN, t);
    else localStorage.removeItem(CHAVE_TOKEN);
  } catch (e) { /* modo privado: vale só nesta aba */ }
}

function temToken() { return !!pegaToken(); }

function apiGitHub(caminho, opcoes) {
  const o = opcoes || {};
  return fetch("https://api.github.com/repos/" + REPO.dono + "/" + REPO.nome + caminho, {
    method: o.metodo || "GET",
    headers: {
      "Authorization": "Bearer " + pegaToken(),
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    },
    body: o.corpo ? JSON.stringify(o.corpo) : undefined
  }).then(r => r.json().then(j => {
    if (!r.ok) throw new Error(j.message || ("HTTP " + r.status));
    return j;
  }));
}

/* base64 que aguenta acento */
function paraBase64(txt) {
  const bytes = new TextEncoder().encode(txt);
  let bin = "";
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

/* ---------- serializa a árvore de volta para JavaScript ----------
   Gerar o arquivo inteiro, em vez de emendar texto, é o que impede o tipo de
   quebra que já aconteceu: um bloco colado no lugar errado. */
function gerarArquivoRespostas(arv) {
  const asp = t => JSON.stringify(String(t));
  const linhas = [];

  linhas.push("const RESPOSTAS = [");
  arv.forEach((a, ia) => {
    linhas.push("  {");
    linhas.push("    id: " + asp(a.id) + ",");
    linhas.push("    aba: " + asp(a.aba) + ",");
    linhas.push("    subs: [");
    a.subs.forEach((s, is) => {
      if (!s.itens.length) {
        linhas.push("      { id: " + asp(s.id) + ", sub: " + asp(s.sub) + ", itens: [] }" + (is < a.subs.length - 1 ? "," : ""));
        return;
      }
      linhas.push("      {");
      linhas.push("        id: " + asp(s.id) + ",");
      linhas.push("        sub: " + asp(s.sub) + ",");
      linhas.push("        itens: [");
      s.itens.forEach((it, ii) => {
        linhas.push("          {");
        linhas.push("            titulo: " + asp(it.titulo) + ",");
        linhas.push("            tags: [" + (it.tags || []).map(asp).join(", ") + "],");
        if (it.interno) linhas.push("            interno: true,");
        if (it.imagem) linhas.push("            imagem: " + asp(it.imagem) + ",");
        linhas.push("            resposta: [");
        linhas.push(it.resposta.map(p => "              " + asp(p)).join(",\n"));
        linhas.push("            ]");
        linhas.push("          }" + (ii < s.itens.length - 1 ? "," : ""));
      });
      linhas.push("        ]");
      linhas.push("      }" + (is < a.subs.length - 1 ? "," : ""));
    });
    linhas.push("    ]");
    linhas.push("  }" + (ia < arv.length - 1 ? "," : ""));
  });
  linhas.push("];");
  return linhas.join("\n") + "\n";
}

/* pega o cabeçalho de comentário do arquivo atual, para não perdê-lo */
function cabecalhoRespostas() {
  return fetch("respostas.js?t=" + Date.now())

function publicarRespostas(arvoreNova, mensagem) {

/* ═══════════════════════════════════════════════════════════════════════════
   EDITAR O PASSO A PASSO DO GUIA

   O guia mora em PORTOES, no conteudo.js — e o conteudo.js e um arquivo bem
   mais perigoso que o respostas.js: um erro de sintaxe ali derruba a pagina
   inteira, nao so uma resposta. Ja aconteceu.

   Por isso aqui NAO se regenera o arquivo todo, como o respostas.js faz.
   Faz-se uma troca cirurgica: acha o bloco `const PORTOES = [ ... ];` no texto
   que veio do repositorio, troca so ele, e mantem cada outro byte no lugar —
   comentarios, indices, tudo.

   E antes de enviar, o arquivo montado passa por new Function(). Se nao for
   JavaScript valido, a publicacao e recusada e nada e alterado.

   Quem pode editar: quem tem token com permissao de escrita no repositorio.
   O lapis so aparece com token configurado, mas o portao de verdade e o
   GitHub — sem permissao ele recusa a gravacao, venha de onde vier.
   ═══════════════════════════════════════════════════════════════════════════ */

/* serializa PORTOES de volta para JavaScript, no formato do arquivo */
function serializarPortoes(portoes) {
  const asp = t => JSON.stringify(String(t));
  const linhas = ["const PORTOES = ["];
  portoes.forEach((p, i) => {
    linhas.push("  {");
    linhas.push("    id: " + asp(p.id) + ",");
    linhas.push("    titulo: " + asp(p.titulo) + ",");
    linhas.push("    lead: " + asp(p.lead) + ",");
    linhas.push("    itens: [");
    linhas.push(p.itens.map(x => "      " + asp(x)).join(",\n"));
    linhas.push("    ],");
    linhas.push("    nunca: [");
    linhas.push(p.nunca.map(x => "      " + asp(x)).join(",\n"));
    linhas.push("    ],");
    linhas.push("    cta: " + asp(p.cta) + ",");
    linhas.push("    why: " + asp(p.why));
    linhas.push("  }" + (i < portoes.length - 1 ? "," : ""));
  });
  linhas.push("];");
  return linhas.join("\n");
}

/* acha o bloco PORTOES no texto do arquivo e troca so ele */
function trocarBlocoPortoes(texto, blocoNovo) {
  const ini = texto.indexOf("const PORTOES = [");
  if (ini === -1) throw new Error("nao achei o bloco PORTOES no conteudo.js");
  /* anda ate o colchete que fecha, contando os de dentro e pulando strings */
  let d = 0, i = texto.indexOf("[", ini), fim = -1, aspas = null;
  for (; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) { if (c === "\\") i++; else if (c === aspas) aspas = null; continue; }
    if (c === '"' || c === "'") { aspas = c; continue; }
    if (c === "[") d++;
    else if (c === "]") { d--; if (d === 0) { fim = i; break; } }
  }
  if (fim === -1) throw new Error("nao achei o fim do bloco PORTOES");
  /* engole o ponto e virgula logo depois do colchete */
  let dep = fim + 1;
  while (dep < texto.length && /\s/.test(texto[dep])) dep++;
  if (texto[dep] === ";") dep++;
  return texto.slice(0, ini) + blocoNovo + texto.slice(dep);
}

/* baixa o conteudo.js atual do repositorio, como texto */
function textoConteudoAtual() {
  return fetch("conteudo.js?t=" + Date.now()).then(r => {
    if (!r.ok) throw new Error("nao consegui ler o conteudo.js");
    return r.text();
  });
}

function publicarConteudo(textoNovo, mensagem) {
  /* a rede que impede de derrubar o site: se nao compila, nao sai daqui */
  try { new Function(textoNovo); }
  catch (e) { return Promise.reject(new Error(TEXTOS.guiaErroSintaxe)); }

  return apiGitHub("/contents/conteudo.js?ref=" + REPO.ramo)
    .then(atual => apiGitHub("/contents/conteudo.js", {
      metodo: "PUT",
      corpo: {
        message: mensagem,
        content: paraBase64(textoNovo),
        sha: atual.sha,
        branch: REPO.ramo
      }
    }));
}

/* ---------- reordenar abas e sub-abas ----------
   Muda so a ORDEM em que abas e sub-abas aparecem. Nenhum titulo, tag, texto
   ou imagem e tocado: o que se publica e a mesma arvore, com os elementos em
   outra posicao, pelo mesmo gerarArquivoRespostas() que ja escreve o arquivo
   quando alguem cria uma resposta.

   Trabalha sobre uma copia (state.arvoreOrdem). Enquanto voce arruma, nada
   e gravado; so o botao de salvar publica. */
function entrarOrdenacao() {
  state.ordenando = true;
  state.arvoreOrdem = arvoreOficial();
  state.abaAberta = null;
  render();
}

function sairOrdenacao() {
  state.ordenando = false;
  state.arvoreOrdem = null;
  render();
}

/* a ordem so vale a pena publicar se de fato mudou */
function ordemMudou() {
  const antes = arvoreOficial();
  const agora = state.arvoreOrdem || [];
  if (antes.length !== agora.length) return true;
  for (let i = 0; i < antes.length; i++) {
    if (antes[i].id !== agora[i].id) return true;
    const sa = antes.find(x => x.id === agora[i].id);
    if (!sa || sa.subs.length !== agora[i].subs.length) return true;
    for (let j = 0; j < agora[i].subs.length; j++) {
      if (sa.subs[j].id !== agora[i].subs[j].id) return true;
    }
  }
  return false;
}

function salvarOrdem(botao, aviso) {
  if (!state.arvoreOrdem) return;
  if (!ordemMudou()) { aviso.className = "nav-ordem-estado"; aviso.textContent = TEXTOS.ordemSemMudanca; return; }
  botao.disabled = true;
  aviso.className = "nav-ordem-estado";
  aviso.textContent = TEXTOS.ordemPublicando;
  publicarRespostas(state.arvoreOrdem, "Reordena abas e sub-abas do playbook")
    .then(() => {
      aviso.className = "nav-ordem-estado ok";
      aviso.textContent = TEXTOS.ordemPublicado;
      setTimeout(() => { location.reload(); }, 2600);
    })
    .catch(err => {
      botao.disabled = false;
      aviso.className = "nav-ordem-estado ruim";
      aviso.textContent = TEXTOS.editorErroEnvio + " " + err.message;
    });
}

/* ---------- rascunhos locais: abas e respostas criadas pela tela ----------
   O site é estático, não tem servidor. Então o que você cria aqui fica
   guardado no SEU navegador e serve para usar na hora. Para virar oficial e
   valer para o time inteiro, o formulário gera o bloco de código pronto para
   colar em [12] do conteudo.js. */
const CHAVE_RASCUNHO = "respostasExtras";

function leRascunhos() {
  try { return JSON.parse(localStorage.getItem(CHAVE_RASCUNHO) || "[]"); }
  catch (e) { return []; }
}

function gravaRascunhos(lista) {
  try { localStorage.setItem(CHAVE_RASCUNHO, JSON.stringify(lista)); }
  catch (e) { alert(TEXTOS.editorSemEspaco); }
}

function idDe(txt) {
  return norm(txt).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "novo";
}

/* junta o que veio do conteudo.js com os rascunhos deste navegador */
function arvore() {
  const base = RESPOSTAS.map(a => ({
    id: a.id, aba: a.aba,
    subs: a.subs.map(s => ({
      id: s.id, sub: s.sub,
      /* carimba a origem: e assim que o lapis sabe qual item mexer */
      itens: s.itens.map((it, i) => Object.assign({}, it, { ondeAba: a.id, ondeSub: s.id, ondeIndice: i }))
    }))
  }));

  leRascunhos().forEach((r, i) => {
    let a = base.find(x => norm(x.aba) === norm(r.aba));
    if (!a) { a = { id: idDe(r.aba), aba: r.aba, subs: [], rascunho: true }; base.push(a); }
    let s = a.subs.find(x => norm(x.sub) === norm(r.sub));
    if (!s) { s = { id: a.id + "-" + idDe(r.sub), sub: r.sub, itens: [], rascunho: true }; a.subs.push(s); }
    s.itens.push({
      titulo: r.titulo, tags: r.tags, resposta: r.resposta,
      imagem: r.imagem || null, interno: !!r.interno,
      rascunho: true, indice: i
    });
  });

  return base;
}

/* ---------- formulário ---------- */
function abrirEditor(preAba, preSub, edicao) {

    campoSub.trocaOpcoes(a ? a.subs.map(s => s.sub) : []);
  };
  campoAba.aoMudar(atualizaSubs);
  atualizaSubs();

  const campoTitulo = campoTexto(TEXTOS.editorTituloResposta, TEXTOS.editorTituloDica);

  const campoTexto2 = campoArea(TEXTOS.editorResposta, TEXTOS.editorRespostaDica);

  /* imagem opcional */

    campoTags.poe((edicao.item.tags || []).join(", "));

  }
  inpImg.addEventListener("change", () => {
    const arq = inpImg.files && inpImg.files[0];
    previa.textContent = "";
    imagemDados = imagemNome = null;
    if (!arq) return;
    imagemNome = idDe(arq.name.replace(/\.[^.]+$/, "")) + ".png";
    const leitor = new FileReader();
    leitor.onload = () => {
      imagemDados = leitor.result;
      const im = document.createElement("img");
      im.src = imagemDados;
      previa.append(im);
      previa.append(el("span","campo-dica", fmt(TEXTOS.editorImagemArquivo, { nome: imagemNome })));
    };
    leitor.readAsDataURL(arq);

  const marcaInterno = el("label","campo-check");

  chk.checked = !!chkPre;

  corpo.append(marcaInterno);

  cx.append(corpo);

  const situacao = el("p","modal-estado");
  corpo.append(situacao);

  publicar.type = "submit";
  const salvar = el("button","btn ghost", TEXTOS.editorSalvar);
  salvar.type = "button";
  const codigo = el("button","btn ghost", TEXTOS.editorCodigo);
  codigo.type = "button";

  cancelar.type = "button";

  if (temToken()) pe.append(publicar, salvar, cancelar);
  else {

  const montaRegistro = () => {
    const aba = campoAba.valor().trim();
    const sub = campoSub.valor().trim();
    const titulo = campoTitulo.valor().trim();
    const corpoTxt = campoTexto2.valor().trim();
    if (!aba || !sub || !titulo || !corpoTxt) { alert(TEXTOS.editorFalta); return null; }
    return {
      aba, sub, titulo,
      tags: campoTags.valor().split(",").map(t => t.trim()).filter(Boolean),
      resposta: corpoTxt.split(/\n{2,}|\n/).map(l => l.trim()).filter(Boolean),
      imagem: imagemDados,
      imagemNome: imagemNome,

    let sb = a.subs.find(x => norm(x.sub) === norm(r.sub));

    const antes = edicao && edicao.item.imagem ? edicao.item.imagem : null;
    const novo = {
      titulo: r.titulo, tags: r.tags, resposta: r.resposta,
      imagem: r.imagemNome ? "img/" + r.imagemNome : antes,
      interno: r.interno
    };

    if (edicao) {
      const aOld = arvNova.find(x => x.id === edicao.abaId);
      const sOld = aOld && aOld.subs.find(x => x.id === edicao.subId);
      if (sOld) sOld.itens.splice(edicao.indice, 1);
    }
    sb.itens.push(novo);

    const enviaImagem = r.imagemNome && r.imagem
      ? publicarImagem(r.imagemNome, r.imagem)
      : Promise.resolve();

    enviaImagem
      .then(() => publicarRespostas(arvNova, (edicao ? "Edita" : "Adiciona") + " resposta: " + r.titulo))
      .then(() => {

        situacao.textContent = TEXTOS.editorPublicado;
        setTimeout(() => { location.reload(); }, 2600);

      .catch(err => {
        publicar.disabled = false;
        situacao.className = "modal-estado ruim";
        situacao.textContent = TEXTOS.editorErroEnvio + " " + err.message;
      });
  });

  codigo.onclick = () => {
    const r = montaRegistro();
    if (!r) return;
    mostrarCodigo([r]);
  };

  fundo.append(cx);
  document.body.append(fundo);
  document.body.classList.add("gaveta-aberta");
  setTimeout(() => campoAba.foco(), 30);

function campoTexto(rot, dica) {

}

function campoArea(rot, dica) {
  const bloco = el("div","campo");
  bloco.append(el("label","", rot));
  const t = document.createElement("textarea");
  t.rows = 7;
  bloco.append(t);
  if (dica) bloco.append(el("span","campo-dica", dica));
  return { bloco, valor: () => t.value, poe: v => { t.value = v; } };
}

/* lista com opção de digitar um valor novo */
function campoLista(rot, opcoes, inicial, rotNovo) {
  const bloco = el("div","campo");
  bloco.append(el("label","", rot));
  const linha = el("div","campo-linha");
  const sel = document.createElement("select");
  const txt = document.createElement("input");
  txt.type = "text";
  txt.placeholder = rotNovo;
  linha.append(sel, txt);
  bloco.append(linha);

  let aoMudarFn = () => {};

  const preenche = (lista) => {
    sel.textContent = "";
    lista.forEach(o => { const op = document.createElement("option"); op.value = o; op.textContent = o; sel.append(op); });
    const nova = document.createElement("option");
    nova.value = "__nova__";
    nova.textContent = rotNovo;
    sel.append(nova);
    if (inicial && lista.includes(inicial)) sel.value = inicial;
    else if (!lista.length) sel.value = "__nova__";
    ajusta();
  };

  const ajusta = () => { txt.hidden = sel.value !== "__nova__"; };
  sel.addEventListener("change", () => { ajusta(); aoMudarFn(); });
  txt.addEventListener("input", () => aoMudarFn());

  preenche(opcoes);

  return {
    bloco,
    valor: () => (sel.value === "__nova__" ? txt.value : sel.value),
    trocaOpcoes: preenche,
    aoMudar: (fn) => { aoMudarFn = fn; },
    foco: () => (sel.value === "__nova__" ? txt : sel).focus()
  };
}

/* ---------- gerar o código para colar no conteudo.js ---------- */
function gerarCodigo(lista) {
  const asp = t => '"' + String(t).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
  const porAba = {};
  lista.forEach(r => {
    porAba[r.aba] = porAba[r.aba] || {};
    porAba[r.aba][r.sub] = porAba[r.aba][r.sub] || [];
    porAba[r.aba][r.sub].push(r);
  });

  const partes = [];
  Object.keys(porAba).forEach(aba => {
    const jaExiste = RESPOSTAS.some(a => norm(a.aba) === norm(aba));
    const subs = Object.keys(porAba[aba]).map(sub => {
      const itens = porAba[aba][sub].map(r => {
        const linhas = [
          "          {",
          "            titulo: " + asp(r.titulo) + ",",
          "            tags: [" + r.tags.map(asp).join(", ") + "],"
        ];
        if (r.interno) linhas.push("            interno: true,");
        if (r.imagemNome) linhas.push("            imagem: " + asp("img/" + r.imagemNome) + ",");
        linhas.push("            resposta: [");
        linhas.push(r.resposta.map(p => "              " + asp(p)).join(",\n"));
        linhas.push("            ]");
        linhas.push("          }");
        return linhas.join("\n");
      }).join(",\n");
      return "      {\n        id: " + asp(idDe(aba) + "-" + idDe(sub)) + ",\n        sub: " + asp(sub) +
             ",\n        itens: [\n" + itens + "\n        ]\n      }";
    }).join(",\n");

    if (jaExiste) {
      partes.push("/* Dentro da aba " + aba + ", em subs, cole: */\n" + subs);
    } else {
      partes.push("/* Aba nova: cole antes do ] que fecha o RESPOSTAS */\n  {\n    id: " +
                  asp(idDe(aba)) + ",\n    aba: " + asp(aba) + ",\n    subs: [\n" + subs + "\n    ]\n  },");
    }
  });

  const avisos = lista.filter(r => r.imagemNome)
    .map(r => "/* Suba a imagem em img/" + r.imagemNome + " no GitHub antes de publicar. */");

  return avisos.concat(partes).join("\n\n");
}
