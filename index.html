/* ═══════════════════════════════════════════════════════════════════════════
   RESPOSTAS RAPIDAS — lista a esquerda, leitura a direita
   ═══════════════════════════════════════════════════════════════════════════

   Antes cada resposta era um card grande que abria e fechava, e copiar
   custava tres cliques: escolher a aba, escolher a sub-aba, abrir o card.
   Agora a lista mostra tudo em uma linha por resposta, o botao de copiar
   fica na propria linha, e o painel da direita le uma resposta por vez.
   ═══════════════════════════════════════════════════════════════════════════ */

const CH_FIX = "respFixados";
const CH_REC = "respRecentes";

function leGuardado(chave) {
  try { const v = JSON.parse(localStorage.getItem(chave) || "[]"); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}

function gravaGuardado(chave, v) {
  try { localStorage.setItem(chave, JSON.stringify(v)); } catch (e) { /* modo privado: vale so nesta aba */ }
}

/* toda a biblioteca achatada, com chave estavel e o texto pronto para busca */
function itensPlanos() {
  const out = [];
  arvore().forEach(a => a.subs.forEach(s => s.itens.forEach(it => {
    out.push({
      item: it, aba: a.aba, abaId: a.id, sub: s.sub, subId: s.id,
      chave: idDe(a.id + "-" + s.id + "-" + it.titulo),
      hay: norm([it.titulo, a.aba, s.sub, (it.tags || []).join(" "), it.resposta.join(" ")].join(" "))
    });
  })));
  return out;
}

/* ---------- busca por relevancia ----------
   Antes a busca exigia que TODAS as palavras aparecessem. Isso funciona para
   uma palavra solta ("cupom"), e falha exatamente no caso que importa: colar a
   pergunta do cliente inteira. "Oi, boa tarde! Como eu faço pra bloquear uma
   area no dia 12?" nao tem nenhuma resposta que contenha todas essas palavras,
   entao a tela vinha vazia.

   Agora cada resposta recebe uma pontuacao e as melhores sobem. Onde a palavra
   aparece muda o peso: o titulo e a pergunta como o cliente costuma trazer, a
   palavra-chave foi escolhida a mao pelo time, e o corpo e o texto inteiro. */
const PARADAS = new Set(("a o as os um uma uns umas de do da dos das em no na nos nas por pra para " +
  "com sem sob sobre ao aos e ou mas que se como quando onde qual quais quanto quantos " +
  "meu minha meus minhas seu sua seus suas nosso nossa este esta esse essa aquele aquela " +
  "isso isto aquilo eu tu ele ela nos eles elas me te lhe nao sim ja ainda muito mais menos " +
  "tambem so apenas entao pois porque ser sou sao esta estao estou tem tenho ter havia " +
  "fazer faz feito pode posso podem consigo consegue quero queria gostaria preciso dar " +
  "vou vai ir foi era bom boa dia tarde noite oi ola obrigado obrigada favor gente voce voces").split(" "));

/* Corta o plural e as terminacoes mais comuns. Como a comparacao e por
   pedaco de texto, a raiz encontra a palavra inteira: "membro" acha
   "membros", e reduzir "membros" para "membro" faz o caminho de volta. */
function raiz(p) {
  let s = p;
  if (s.length > 6 && /coes$/.test(s)) return s.slice(0, -4) + "ca";   /* atualizacoes -> atualizaca */
  if (s.length > 5 && /oes$/.test(s))  return s.slice(0, -3) + "a";    /* botoes -> bota */
  if (s.length > 5 && /aes$/.test(s))  return s.slice(0, -3) + "a";    /* paes -> pa */
  if (s.length > 5 && /(res|les|ses|zes|ns)$/.test(s)) return s.slice(0, -2);
  if (s.length > 5 && /is$/.test(s))   return s.slice(0, -2);          /* locais -> loca */
  if (s.length > 4 && /s$/.test(s))    return s.slice(0, -1);          /* membros -> membro */
  return s;
}

/* O cliente escreve "remover usuario"; a resposta certa fala em "excluir
   membros". Sem uma ponte entre os dois vocabularios a busca por palavra nunca
   acha. SINONIMOS, em [9.5] do conteudo.js, e essa ponte — e cresce sozinha
   conforme o time encontra casos novos.

   O mapa e montado na PRIMEIRA BUSCA, nao aqui na carga: este bloco e inline
   no HTML e roda antes de o conteudo.js chegar, entao SINONIMOS ainda nao
   existe neste ponto. Montar cedo demais deixava o mapa vazio para sempre —
   e foi exatamente o que aconteceu na primeira tentativa. */
let _mapaSinonimos = null;

function mapaSinonimos() {
  if (_mapaSinonimos) return _mapaSinonimos;
  const m = new Map();
  if (typeof SINONIMOS !== "undefined") {
    SINONIMOS.forEach(grupo => {
      grupo.forEach(p => {
        const k = norm(p);
        if (!m.has(k)) m.set(k, []);
        grupo.forEach(o => { const v = norm(o); if (v !== k && m.get(k).indexOf(v) === -1) m.get(k).push(v); });
      });
    });
    _mapaSinonimos = m;   /* so guarda quando o conteudo ja chegou */
  }
  return m;
}

/* todas as formas que valem por um termo: ele, a raiz dele, e os sinonimos */
function variantes(t) {
  const v = [t];
  const r = raiz(t);
  if (r !== t && r.length >= 3) v.push(r);
  const mapa = mapaSinonimos();
  const sin = mapa.get(t) || mapa.get(r) || [];
  sin.forEach(s => {
    if (v.indexOf(s) === -1) v.push(s);
    const rs = raiz(s);
    if (rs.length >= 3 && v.indexOf(rs) === -1) v.push(rs);
  });
  return v;
}

/* tira pontuacao, acento e as palavras que nao distinguem nada */
function termosDaBusca(txt) {
  const cru = norm(txt).replace(/[^a-z0-9\s]+/g, " ").split(/\s+/).filter(Boolean);
  const uteis = cru.filter(p => p.length >= 3 && !PARADAS.has(p));
  /* busca de uma palavra curta ("nps", "ia") nao pode virar zero termos */
  return uteis.length ? uteis : cru.filter(p => p.length >= 2);
}

/* ---------- peso de cada termo pela raridade ----------
   "cadastrar", "criar" e "editar" aparecem no titulo de meia biblioteca: eles
   quase nao dizem QUAL resposta e a certa. "pagamento" e "membro" dizem.

   Sem isto, "quero cadastrar uma nova forma de pagar" trazia em primeiro
   "Como cadastrar, categorizar e editar uma informacao da IA", so porque o
   titulo dela tem dois verbos de acao. Um termo que aparece em quase tudo
   vale pouco; um termo raro vale muito. */
function pesosPorRaridade(termos, todos) {
  const N = todos.length || 1;
  return termos.map(t => {
    const vs = variantes(t);
    let df = 0;
    todos.forEach(x => { if (vs.some(v => x.hay.indexOf(v) !== -1)) df++; });
    const idf = Math.log((N + 1) / (df + 1)) / Math.log(4);
    return Math.max(0.25, Math.min(1.6, idf));
  });
}

function pontuarResposta(x, termos, frase, pesos) {
  const titulo = norm(x.item.titulo);
  const tags = (x.item.tags || []).map(norm);
  const caminho = norm(x.aba + " " + x.sub);
  const corpo = norm(x.item.resposta.join(" "));

  let pontos = 0, achadas = 0, forte = false;

  termos.forEach((t, i) => {
    const vs = variantes(t);
    const bate = texto => vs.some(v => texto.indexOf(v) !== -1);
    /* achar so pelo sinonimo vale um pouco menos: foi uma ponte que nos
       construimos, nao a palavra que o cliente escreveu */
    const viaSinonimo = vs.length > 1 && titulo.indexOf(t) === -1 ? 0.8 : 1;
    /* e o termo raro pesa mais que o termo que aparece em quase tudo */
    const peso = viaSinonimo * (pesos ? pesos[i] : 1);

    let achou = false;
    if (bate(titulo))  { pontos += 10 * peso; achou = true; forte = true; }
    if (tags.some(g => vs.indexOf(g) !== -1)) { pontos += 8 * peso; achou = true; forte = true; }
    else if (tags.some(g => vs.some(v => g.indexOf(v) !== -1))) { pontos += 5 * peso; achou = true; forte = true; }
    if (bate(caminho)) { pontos += 4 * peso; achou = true; forte = true; }
    if (bate(corpo))   { pontos += 2 * peso; achou = true; }
    if (achou) achadas++;
  });
  if (!achadas) return 0;

  /* a pergunta quase inteira no titulo e o caso perfeito */
  if (frase.length >= 8 && titulo.indexOf(frase) !== -1) pontos += 30;

  /* Cobrir 4 de 4 termos vale mais que 4 de 9. Mas a mensagem colada do
     cliente traz muita palavra que nao e sobre a duvida ("nao faz mais parte
     do Feirinha"), entao a cobertura pesa menos quanto mais longa a pergunta. */
  const forcaCobertura = termos.length > 6 ? 0.35 : 0.65;
  const cobertura = achadas / termos.length;
  const nota = pontos * ((1 - forcaCobertura) + forcaCobertura * cobertura);

  /* devolve tambem se houve sinal forte: casar so no corpo, numa pergunta
     longa, quase sempre e coincidencia */
  return { nota: nota, forte: forte };
}

/* O que a lista mostra agora, e com que rotulo de escopo. Buscar ou filtrar
   ignora a sub-aba escolhida: quem digita esta atras de algo que nao achou
   onde estava, e prender a busca a uma sub-aba esconderia a resposta. */
function listaVisivel() {
  const todos = itensPlanos();
  const termo = state.busca ? norm(state.busca) : "";
  const palavras = termo ? termosDaBusca(state.busca) : [];
  let itens = todos, escopo = TEXTOS.respEscopoTudo;

  if (palavras.length) {
    const pesos = pesosPorRaridade(palavras, todos);
    let marcados = itens
      .map(x => { const r = pontuarResposta(x, palavras, termo, pesos); return { x: x, p: r ? r.nota : 0, forte: !!(r && r.forte) }; })
      .filter(o => o.p > 0);

    /* Numa pergunta longa, casar so no corpo quase sempre e coincidencia: a
       mensagem do cliente tem "celular", e alguma resposta tem "celular" no
       meio do texto. Exigir sinal no titulo, na palavra-chave ou no caminho
       e o que separa a resposta certa do barulho. */
    if (palavras.length >= 5) {
      const comSinal = marcados.filter(o => o.forte);
      if (comSinal.length) marcados = comSinal;
    }

    marcados.sort((a, b) => b.p - a.p || a.x.item.titulo.localeCompare(b.x.item.titulo, "pt"));

    /* Pergunta colada (3+ termos) exige precisao: uma frase longa sempre roca
       de leve em meia biblioteca, e mostrar 26 respostas nao ajuda ninguem.
       Palavra solta continua exigindo so recall, como era antes. */
    if (palavras.length >= 3 && marcados.length) {
      const topo = marcados[0].p;
      const fortes = marcados.filter(o => o.p >= 5 && o.p >= topo * 0.18);
      /* Mesmo quando so uma resposta se destaca, deixa as duas seguintes na
         mesa: se a primeira nao for a certa, o atendente precisa ter para
         onde olhar sem reescrever a pergunta. */
      marcados = fortes.length >= 3 ? fortes : marcados.slice(0, 3);
    }

    itens = marcados.map(o => { const c = Object.assign({}, o.x); c.pontos = o.p; return c; });
    escopo = TEXTOS.respEscopoBusca;
  }
  if (state.tagsAtivas.length) {
    itens = itens.filter(x => state.tagsAtivas.every(tg => (x.item.tags || []).some(y => norm(y) === norm(tg))));
    escopo = TEXTOS.respEscopoTag;
  }
  /* Nao ha mais coluna de lista para escopar: quem navega usa a arvore da
     barra, que agora mostra as respostas dentro de cada sub-aba, e quem
     procura usa a busca. state.sub sobrou so para o formulario de nova
     resposta ja vir com a aba e a sub-aba certas preenchidas. */

  /* Os fixados sobem — mas so quando nao ha busca. Durante a busca quem manda
     e a relevancia: subir um fixado pouco relevante para o topo esconderia a
     resposta que de fato responde a pergunta colada. */
  if (!palavras.length) {
    const fix = new Set(state.fixados);
    itens = itens.slice().sort((a, b) => (fix.has(b.chave) ? 1 : 0) - (fix.has(a.chave) ? 1 : 0));
  }
  return { itens, escopo, termo, total: todos.length, buscando: palavras.length > 0 };
}

function ehFixado(chave) { return state.fixados.indexOf(chave) !== -1; }

function fixar(chave) {
  const i = state.fixados.indexOf(chave);
  if (i === -1) state.fixados.unshift(chave); else state.fixados.splice(i, 1);
  gravaGuardado(CH_FIX, state.fixados);
  render();
}

/* Recentes e o que foi copiado, nao o que foi aberto: abrir e so olhar,
   copiar e que marca a resposta como usada de verdade no atendimento. */
function registraRecente(chave) {
  state.recentes = [chave].concat(state.recentes.filter(c => c !== chave)).slice(0, 5);
  gravaGuardado(CH_REC, state.recentes);
  /* so a barra: um render() inteiro trocaria o botao que esta mostrando o
     visto verde por um novo, e o aviso de copiado desapareceria */
  renderSidebar();
}

function escolher(chave) {
  state.escolhida = chave;
  render();
  const alvo = document.querySelector('.rlinha[data-chave="' + chave + '"]');
  if (alvo) alvo.scrollIntoView({ block: "nearest" });
}


/* ---------- os resultados da busca ----------
   A coluna de lista permanente saiu. No lugar dela, os resultados aparecem
   embaixo do campo de busca e so quando ha uma pergunta — o resto do tempo a
   tela e so a resposta que esta sendo lida.

   Cada linha continua trazendo copiar e fixar, que era o ganho principal da
   lista: copiar sem abrir nada. */
function painelResultados(dados) {
  const cx = el("section","rbusca");

  const topo = el("div","rbusca-topo");
  topo.append(el("span","rbusca-conta", fmt(TEXTOS.buscaResultados, { n: dados.itens.length })));
  const fechar = el("button","rbusca-fechar", "×");
  fechar.type = "button";
  fechar.title = TEXTOS.buscaFechar;
  fechar.onclick = () => { limparEscopo(); render(); };
  topo.append(fechar);
  cx.append(topo);

  if (!dados.itens.length) {
    const nada = el("div","rbusca-nada");
    nada.append(el("p","", TEXTOS.buscaSemRelevante));
    const b = el("button","btn sm", TEXTOS.buscaBotao);
    b.type = "button";
    b.onclick = () => abrirDoc(D + "?ask=" + encodeURIComponent(state.busca || ""), state.busca || TEXTOS.docTitulo, true);
    nada.append(b);
    cx.append(nada);
    return cx;
  }

  const lista = el("div","rlinhas");
  const topoPontos = dados.itens[0].pontos || 0;
  dados.itens.forEach(x => lista.append(linhaResposta(x, dados.termo, topoPontos)));
  cx.append(lista);
  return cx;
}

/* Uma linha de resultado: titulo, caminho, o quanto casou, e as duas acoes
   que valem sem abrir nada. */
function linhaResposta(x, termo, topoPontos) {
  const it = x.item;
  const linha = el("div","rlinha" + (x.chave === state.escolhida ? " on" : "") + (it.interno ? " interno" : ""));
  linha.dataset.chave = x.chave;

  const txt = el("button","rlinha-txt");
  txt.type = "button";
  txt.title = it.titulo + " — " + x.aba + " › " + x.sub;
  txt.append(el("span","rlinha-tit", realce(it.titulo, termo)));
  txt.append(el("span","rlinha-onde", x.aba + " › " + x.sub));
  txt.onclick = () => escolher(x.chave);
  linha.append(txt);

  /* Barrinha de relevancia: quanto esta resposta casou com a pergunta. Sem
     numero, que nao significaria nada para quem le.

     A referencia tem um piso de 30 pontos, e nao e o melhor resultado da vez.
     Se fosse relativa ao topo, uma pergunta sem resposta boa mostraria o
     primeiro lugar com a barra cheia — dizendo "achei" quando nao achou. */
  if (topoPontos > 0 && x.pontos !== undefined) {
    const base = Math.max(topoPontos, 30);
    const pct = Math.min(100, Math.max(6, Math.round((x.pontos / base) * 100)));
    const rel = el("span","rlinha-rel");
    rel.title = TEXTOS.buscaRelevancia + ": " + pct + "%";
    rel.setAttribute("aria-hidden", "true");
    const barra = el("span","rlinha-rel-barra");
    barra.style.width = pct + "%";
    rel.append(barra);
    linha.append(rel);
  }

  const acoes = el("div","rlinha-acoes");

  const copia = el("button","ricone","⧉");
  copia.type = "button";
  copia.dataset.icone = "1";
  copia.title = TEXTOS.respCopiarRapido;
  copia.onclick = () => { registraRecente(x.chave); copiarResposta(it, copia, !!it.imagem); };
  acoes.append(copia);

  const fixado = ehFixado(x.chave);
  const pino = el("button","ricone" + (fixado ? " fixo" : ""), fixado ? "★" : "☆");
  pino.type = "button";
  pino.title = fixado ? TEXTOS.respDesfixar : TEXTOS.respFixar;
  pino.onclick = () => fixar(x.chave);
  acoes.append(pino);

  linha.append(acoes);
  return linha;
}

/* ---------- a coluna da leitura: uma resposta por vez, inteira ---------- */
function colunaLeitura(x, termo) {
  const cx = el("section","rleitura");
  if (!x) {
    cx.append(el("div","rleitura-vazia", state.sub ? TEXTOS.respVazia : TEXTOS.respEscolha));
    return cx;
  }

  const it = x.item;
  if (it.interno) cx.classList.add("interno");

  const topo = el("header","rleitura-topo");
  const cam = el("div","rleitura-caminho");
  cam.append(el("span","", x.aba + " › " + x.sub));
  if (it.interno) cam.append(el("span","rcard-interno", TEXTOS.respInterno));
  topo.append(cam);
  topo.append(el("h2","rleitura-tit", realce(it.titulo, termo)));

  const acoes = el("div","rleitura-acoes");
  const copiar = el("button","btn sm", it.imagem ? TEXTOS.respCopiarTudo : TEXTOS.respCopiar);
  copiar.type = "button";
  copiar.onclick = () => { registraRecente(x.chave); copiarResposta(it, copiar, !!it.imagem); };
  acoes.append(copiar);

  if (it.imagem) {
    const soTexto = el("button","btn ghost sm", TEXTOS.respCopiarSoTexto);
    soTexto.type = "button";
    soTexto.onclick = () => { registraRecente(x.chave); copiarResposta(it, soTexto, false); };
    acoes.append(soTexto);
  }

  const fixado = ehFixado(x.chave);
  const pino = el("button","ricone" + (fixado ? " fixo" : ""), fixado ? "★" : "☆");
  pino.type = "button";
  pino.title = fixado ? TEXTOS.respDesfixar : TEXTOS.respFixar;
  pino.onclick = () => fixar(x.chave);
  acoes.append(pino);

  /* editar e remover moram aqui, onde ha espaco, e nao no aperto da linha */
  if (it.rascunho) {
    acoes.append(el("span","rcard-rascunho", TEXTOS.editorSeloRascunho));
    const apagar = el("button","ricone","×");
    apagar.type = "button";
    apagar.title = TEXTOS.editorApagar;
    apagar.onclick = () => apagarRascunho(it.indice);
    acoes.append(apagar);
  } else if (temToken() && it.ondeAba) {
    const lapis = el("button","rcard-editar", "✎ " + TEXTOS.editorEditar);
    lapis.type = "button";
    lapis.onclick = () => abrirEditor(x.aba, x.sub, { abaId: it.ondeAba, subId: it.ondeSub, indice: it.ondeIndice, item: it });
    acoes.append(lapis);
    const lixo = el("button","ricone","×");
    lixo.type = "button";
    lixo.title = TEXTOS.editorRemover;
    lixo.onclick = () => removerResposta(it);
    acoes.append(lixo);
  }
  topo.append(acoes);
  cx.append(topo);

  cx.append(montarCorpo(it.resposta, termo));

  /* o print continua atras de um botao: nao ocupa a tela sem pedir */
  if (it.imagem) {
    const cxImg = el("div","rcard-print");
    const aberto = !!state.printsAbertos[x.chave];
    const btn = el("button","btn ghost sm", aberto ? TEXTOS.respImgOcultar : TEXTOS.respImgMostrar);
    btn.type = "button";
    btn.setAttribute("aria-expanded", String(aberto));
    btn.onclick = () => {
      if (aberto) delete state.printsAbertos[x.chave]; else state.printsAbertos[x.chave] = true;
      render();
    };
    cxImg.append(btn);
    if (aberto) {
      const fig = el("figure","rcard-img");
      const img = document.createElement("img");
      img.src = it.imagem;
      img.alt = TEXTOS.respImgAlt + ": " + it.titulo;
      img.loading = "lazy";
      img.onclick = () => ampliar(it.imagem, img.alt);
      /* print que aponta para arquivo inexistente deixa de ser espaco em
         branco: a unica pista, antes, era o vazio */
      img.onerror = () => {
        fig.textContent = "";
        const falta = el("p","rimg-falta");
        falta.innerHTML = fmt(TEXTOS.respImgFalta, { nome: "<code>" + it.imagem + "</code>" });
        fig.append(falta);
      };
      fig.append(img, el("figcaption","", TEXTOS.respImgLegenda));
      cxImg.append(fig);
    }
    cx.append(cxImg);
  }

  /* O pe de palavras-chave saiu: eram ate 17 chips embaixo de cada resposta,
     e eles disputavam atencao com o texto que o atendente veio ler e colar.
     As palavras continuam em it.tags e a busca continua achando por elas —
     o que sumiu e so o atalho de clicar numa para filtrar. */
  return cx;
}

/* ---------- o corpo da resposta ----------
   As respostas do time seguem um padrao: um paragrafo que comeca com "•" e um
   item de lista, e o paragrafo seguinte explica AQUELE item.

     Isso pode acontecer quando:
     • A IA nao possui informacoes suficientes para responder.
     Solucao: adicionar a informacao em Configuracao de IA > Informacoes.
     • O cliente solicita atendimento humano.
     Nesse caso, a IA realiza automaticamente o encaminhamento.

   Renderizados como paragrafos irmaos, o item e a explicacao ficam com o mesmo
   peso, e a explicacao parece um item novo. Era isso que deixava a leitura
   estranha. Aqui o bullet vira <li> de verdade e a explicacao entra DENTRO
   dele, recuada e mais quieta.

   So o primeiro paragrafo depois de um bullet e tratado como explicacao; o
   segundo fecha a lista, porque ai ja e conclusao do texto, nao do item.

   O texto nao muda: o marcador "•" sai da tela porque o <li> desenha o proprio,
   mas textoLimpo() copia de item.resposta, entao o que vai para o WhatsApp
   continua identico ao que esta cadastrado. */
function montarCorpo(paragrafos, termo) {
  const corpo = el("div","rleitura-corpo");
  const ehBullet = p => /^\s*[•▪●–-]\s+/.test(String(p));
  const semMarca = p => String(p).replace(/^\s*[•▪●–-]\s+/, "");
  const ehObs = p => /^\s*obs\.?\s*:/i.test(String(p).replace(/<[^>]+>/g, ""));

  let lista = null, item = null;

  paragrafos.forEach(p => {
    if (ehBullet(p)) {
      if (!lista) { lista = el("ul","rtexto-lista"); corpo.append(lista); }
      item = el("li","");
      item.append(el("p","rtexto-item", realce(semMarca(p), termo)));
      lista.append(item);
      return;
    }
    /* o primeiro paragrafo depois do bullet pertence a ele */
    if (item && !item.dataset.temSub) {
      item.dataset.temSub = "1";
      item.append(el("p","rtexto-sub", realce(p, termo)));
      return;
    }
    /* qualquer outro fecha a lista e volta a ser paragrafo solto */
    lista = null; item = null;
    corpo.append(el("p", ehObs(p) ? "rtexto-nota" : "", realce(p, termo)));
  });

  return corpo;
}

/* Copia a resposta. Quando ha print, coloca texto e imagem juntos na area
   de transferencia, em formatos separados: quem colar escolhe o que aceita.
   O WhatsApp costuma pegar a imagem e ignorar o texto, por isso existe
   tambem o botao de so texto. */
function copiarResposta(item, botao, comImagem) {
  /* o botao da linha e so um icone: trocar o texto por "Copiado" ali
     empurraria a linha inteira, entao ele so vira um visto verde */
  const icone = botao.dataset.icone === "1";
  const rotulo = botao.textContent;
  const dica = botao.title;
  const txt = textoLimpo(item);
  const avisa = (msg) => {
    if (icone) { botao.textContent = "✓"; botao.classList.add("feito"); botao.title = msg; }
    else { botao.textContent = msg; }
    setTimeout(() => {
      botao.textContent = rotulo;
      if (icone) { botao.classList.remove("feito"); botao.title = dica; }
    }, 2200);
  };

  if (comImagem && item.imagem && navigator.clipboard && window.ClipboardItem) {
    fetch(item.imagem)
      .then(r => { if (!r.ok) throw new Error("imagem nao carregou"); return r.blob(); })
      .then(blob => navigator.clipboard.write([new ClipboardItem({
        "text/plain": new Blob([txt], { type: "text/plain" }),
        "image/png": blob
      })]))
      .then(() => avisa(TEXTOS.respCopiadoTudo))
      .catch(() => copiarSoTexto(txt, avisa));
    return;
  }

  copiarSoTexto(txt, avisa);
}

function textoLimpo(item) {
  return item.resposta
    .map(p => p.replace(/<[^>]+>/g, "").replace(/&gt;/g, ">").replace(/&lt;/g, "<").replace(/&amp;/g, "&"))
    .join("\n\n");
}

function copiarSoTexto(txt, avisa) {
  const ok = () => avisa(TEXTOS.respCopiado);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(ok, () => copiaAntiga(txt, ok));
  } else {
    copiaAntiga(txt, ok);
  }
}

function copiaAntiga(txt, feito) {
  const ta = document.createElement("textarea");
  ta.value = txt;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); feito(); } catch (e) { /* sem clipboard: o texto fica na tela mesmo */ }
  document.body.removeChild(ta);
}

function renderRespostas() {
  const host = document.getElementById("resp");
  host.textContent = "";

  const dados = listaVisivel();
  const todos = itensPlanos();

  /* Sem busca, a leitura mantem o que estava aberto. Com busca, o primeiro
     resultado ja abre: quem colou a pergunta quer a resposta, nao uma lista. */
  if (dados.buscando) {
    if (!dados.itens.some(x => x.chave === state.escolhida)) {
      state.escolhida = dados.itens.length ? dados.itens[0].chave : null;
    }
  } else if (!todos.some(x => x.chave === state.escolhida)) {
    state.escolhida = todos.length ? todos[0].chave : null;
  }

  /* os resultados so ocupam tela quando ha uma pergunta */
  if (dados.buscando) host.append(painelResultados(dados));
  host.append(colunaLeitura(todos.find(x => x.chave === state.escolhida), dados.termo));
}

/* envolve o que casou com a busca, para o olho achar na hora */
function realce(html, termo) {
  if (!termo) return html;
  const palavras = termo.split(/\s+/).filter(p => p.length >= 2);
  if (!palavras.length) return html;
  /* trabalha só fora das tags, para não quebrar o <strong> */
  return html.replace(/>?([^<>]+)</g, (m, texto) => m.replace(texto, marcaTexto(texto, palavras)));
}

function marcaTexto(texto, palavras) {
  let saida = "";
  let i = 0;
  const alvo = norm(texto);
  while (i < texto.length) {
    let achou = null;
    palavras.forEach(p => {
      const pos = alvo.indexOf(p, i);
      if (pos >= 0 && (!achou || pos < achou.pos)) achou = { pos, len: p.length };
    });
    if (!achou) { saida += texto.slice(i); break; }
    saida += texto.slice(i, achou.pos) + "<mark>" + texto.slice(achou.pos, achou.pos + achou.len) + "</mark>";
    i = achou.pos + achou.len;
  }
  return saida;
}

/* ---------- normalizacao usada pela busca ----------
   Tira acento e caixa: quem digita "reserva paga" acha "Reservas Pagas". */
const DIACRITICOS = new RegExp("[\u0300-\u036f]", "g");
const norm = s => String(s).normalize("NFD").replace(DIACRITICOS, "").toLowerCase();

/* ---------- boot ---------- */
function render() {
  renderMoldura(); renderSidebar();
  renderFlow(); renderOut(); renderFup(); renderAvaliacao(); renderRespostas();
  renderAbaVisivel();
  medirTopo();
}

function iniciar() {
  if (iniciar.jaRodou) return;
  iniciar.jaRodou = true;
  if (!conferirConteudo()) return;

  /* o que o time fixou e o que copiou ha pouco vive neste navegador */
  state.fixados = leGuardado(CH_FIX);
  state.recentes = leGuardado(CH_REC);

window.addEventListener("resize", medirTopo);
window.addEventListener("load", medirTopo);
observarTopo();

/* o topo muda de altura enquanto a fonte e o layout assentam; dois quadros
   depois do boot a medida ja e a definitiva */
requestAnimationFrame(() => requestAnimationFrame(medirTopo));

/* ---- busca global ---- */
const campo = document.getElementById("q");
campo.addEventListener("input", () => { state.busca = campo.value.trim(); render(); });
campo.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.busca) { e.preventDefault(); limparBusca(); }
});
document.getElementById("btn-limpa").addEventListener("click", limparBusca);

function limparBusca() {
  state.busca = "";
  document.getElementById("q").value = "";
  render();
}

/* atalho: barra ou Ctrl+K colocam o cursor na busca */
document.addEventListener("keydown", (e) => {
  const digitando = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if ((e.key === "/" && !digitando) || ((e.ctrlKey || e.metaKey) && e.key === "k")) {
    e.preventDefault();
    if (state.secao !== "respostas") irParaSecao("respostas");
    document.getElementById("q").focus();
    document.getElementById("q").select();
  }
});

/* ---- teclado na lista de respostas ----
   A mao ja esta no teclado por causa da busca: seta escolhe, Ctrl+Enter
   copia. Isso troca tres cliques por uma tecla no meio do atendimento. */
document.addEventListener("keydown", (e) => {
  if (state.secao !== "respostas") return;
  if (document.querySelector(".modal")) return;
  if (!document.getElementById("gaveta").hidden) return;
  if (document.activeElement && document.activeElement.tagName === "TEXTAREA") return;

  const passo = e.key === "ArrowDown" ? 1 : e.key === "ArrowUp" ? -1 : 0;
  const copiar = e.key === "Enter" && (e.ctrlKey || e.metaKey);
  if (!passo && !copiar) return;

  const itens = listaVisivel().itens;
  if (!itens.length) return;
  e.preventDefault();

  if (passo) {
    let i = itens.findIndex(x => x.chave === state.escolhida);
    i = i < 0 ? 0 : Math.min(Math.max(i + passo, 0), itens.length - 1);
    escolher(itens[i].chave);
    return;
  }

  const atual = itens.find(x => x.chave === state.escolhida);
  if (!atual) return;
  registraRecente(atual.chave);
  /* copia pelo botao da linha, para o visto verde aparecer onde o olho esta */
  const botao = document.querySelector('.rlinha[data-chave="' + atual.chave + '"] .ricone');
  if (botao) copiarResposta(atual.item, botao, !!atual.item.imagem);
});

/* ---- largura da barra: arrastar o puxador ---- */
const MIN_BARRA = 180, MAX_BARRA = 460, PADRAO_BARRA = 232;

function poeLargura(px) {
  const v = Math.round(Math.min(Math.max(px, MIN_BARRA), MAX_BARRA));
  document.documentElement.style.setProperty("--larg-barra", v + "px");
  try { localStorage.setItem("larguraBarra", String(v)); } catch (e) { /* modo privado: só não lembra */ }
}

(function lembraLargura() {
  let v = null;
  try { v = localStorage.getItem("larguraBarra"); } catch (e) { /* sem storage, usa o padrão */ }
  if (v) poeLargura(parseInt(v, 10));
})();

(function ligaPuxador() {
  const alca = document.getElementById("puxador");
  const barra = document.getElementById("side");
  if (!alca || !barra) return;

  alca.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    alca.setPointerCapture(e.pointerId);
    document.body.classList.add("arrastando");
    const inicioX = e.clientX;
    const inicioL = barra.getBoundingClientRect().width;

    const mover = (ev) => poeLargura(inicioL + (ev.clientX - inicioX));
    const soltar = () => {
      document.body.classList.remove("arrastando");
      alca.removeEventListener("pointermove", mover);
      alca.removeEventListener("pointerup", soltar);
      alca.removeEventListener("pointercancel", soltar);
    };
    alca.addEventListener("pointermove", mover);
    alca.addEventListener("pointerup", soltar);
    alca.addEventListener("pointercancel", soltar);
  });

  /* teclado: setas ajustam, duplo clique volta ao padrão */
  alca.addEventListener("keydown", (e) => {
    const atual = barra.getBoundingClientRect().width;
    if (e.key === "ArrowLeft")  { e.preventDefault(); poeLargura(atual - 16); }
    if (e.key === "ArrowRight") { e.preventDefault(); poeLargura(atual + 16); }
  });
  alca.addEventListener("dblclick", () => poeLargura(PADRAO_BARRA));
})();

/* ---- recolher e mostrar a barra ---- */
function poeBarra(recolhida) {
  document.body.classList.toggle("barra-recolhida", recolhida);
  document.getElementById("btn-abrir").hidden = !recolhida;
  try { localStorage.setItem("barraRecolhida", recolhida ? "1" : "0"); } catch (e) { /* sem storage, só não lembra */ }
  medirTopo();
}

document.getElementById("btn-recolher").addEventListener("click", () => poeBarra(true));
document.getElementById("btn-abrir").addEventListener("click", () => poeBarra(false));

(function lembraBarra() {
  let v = null;
  try { v = localStorage.getItem("barraRecolhida"); } catch (e) { /* segue com a barra aberta */ }
  if (v === "1") poeBarra(true);
})();

/* ---- menu no celular ---- */
document.getElementById("btn-menu").addEventListener("click", () => {
  const aberto = document.body.classList.toggle("menu-aberto");
  document.getElementById("btn-menu").setAttribute("aria-expanded", String(aberto));
});
document.getElementById("veu").addEventListener("click", fecharMenu);

/* ---- gaveta da documentacao ---- */
document.getElementById("gaveta-fechar").addEventListener("click", fecharDoc);
document.getElementById("gaveta-fundo").addEventListener("click", fecharDoc);

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!document.getElementById("gaveta").hidden) { fecharDoc(); return; }
  if (document.body.classList.contains("menu-aberto")) fecharMenu();
});

/* ---- navegacao entre etapas ---- */
document.getElementById("btn-voltar").addEventListener("click", () => irParaAba(state.aba - 1));
document.getElementById("btn-avancar").addEventListener("click", () => irParaAba(state.aba + 1));

document.getElementById("reset").addEventListener("click", () => {
  state.feito = { ia:false, problema:false, ticket:false };
  state.secao = "guia";
  state.aba = 1;
  state.cat = null; state.mod = null;
  state.escolhida = null;
  state.chipsTodos = false;
  state.vaziasVisiveis = false;
  state.critAberto = 1;
  state.nivelSel = {};
  state.abaAberta = null;
  state.ordenando = false;
  state.arvoreOrdem = null;
  limparEscopo();
  resetFup();
  render();
  window.scrollTo({ top:0, behavior:"smooth" });
});

  render();
}
window.iniciar = iniciar;
if (typeof TEXTOS !== "undefined") iniciar();   /* se ja chegou, comeca agora */
</script>
