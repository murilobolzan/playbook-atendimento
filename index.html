<style>
  /* ═══════════════════════════════════════════════════════════════════════
     PALETA — derivada da cor da marca Dionísio.
     O tema da documentação declara --primary-original: 187 149 212, ou seja
     #BB95D4, um lilás em hsl(276 42% 71%). Toda a escala abaixo sai desse
     matiz, inclusive os cinzas, que puxam de leve para o roxo em vez de
     serem neutros puros.
     ═══════════════════════════════════════════════════════════════════ */
  :root {
    color-scheme: light;

    --brand:        #BB95D4;   /* a cor da marca */
    --accent:       #6D3D93;   /* versão legível sobre branco, 7,2:1 */
    --accent-forte: #572E77;
    --accent-suave: #F1E9F7;
    --accent-linha: #DCC9EA;
    --accent-sobre: #FFFFFF;

    --ground:       #F7F5FA;
    --surface:      #FFFFFF;
    --surface-2:    #FBF9FD;
    --surface-3:    #F4F0F9;
    --ink:          #1B1421;
    --ink-2:        #564B60;
    --ink-3:        #786783;
    --line:         #E5DFEC;
    --line-forte:   #CFC5D9;

    --crit: #B02A21;  --crit-bg: #FBE9E7;
    --warn: #855400;  --warn-bg: #FAF0DA;
    --calm: #1A6349;  --calm-bg: #E2F1EB;

    /* escala de espaçamento: tudo na tela usa um destes valores */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
    --s5: 20px; --s6: 24px; --s7: 32px; --s8: 44px;

    /* escala tipográfica */
    --t-micro: 10.5px; --t-xs: 11.5px; --t-sm: 12.5px;
    --t-base: 13.5px;  --t-md: 15px;   --t-lg: 17px; --t-xl: 20px;

    --r: 4px;
    --r-sm: 3px;
    --sombra: 0 1px 2px rgba(27,20,33,.04), 0 8px 24px -16px rgba(27,20,33,.22);
    --sombra-forte: 0 2px 4px rgba(27,20,33,.06), 0 18px 44px -22px rgba(27,20,33,.32);

    --stick: 108px;  /* altura do topo fixo; o JS mede e corrige */

    --font-ui: "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --font-mono: "Cascadia Mono","Cascadia Code",Consolas,"SF Mono",ui-monospace,Menlo,monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --brand:#BB95D4; --accent:#C9A6DE; --accent-forte:#DABEE9;
      --accent-suave:#2A1B36; --accent-linha:#4A3560; --accent-sobre:#1D1226;
      --ground:#120E18; --surface:#1B1523; --surface-2:#221A2C; --surface-3:#1F1829;
      --ink:#F2EDF7; --ink-2:#B7ADC3; --ink-3:#968A9F;
      --line:#2F2739; --line-forte:#463B52;
      --crit:#FF9E95; --crit-bg:#3A1714;
      --warn:#E9BA62; --warn-bg:#322509;
      --calm:#82D0AF; --calm-bg:#10281E;
      --sombra: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.8);
      --sombra-forte: 0 2px 4px rgba(0,0,0,.5), 0 18px 44px -22px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --brand:#BB95D4; --accent:#C9A6DE; --accent-forte:#DABEE9;
    --accent-suave:#2A1B36; --accent-linha:#4A3560; --accent-sobre:#1D1226;
    --ground:#120E18; --surface:#1B1523; --surface-2:#221A2C; --surface-3:#1F1829;
    --ink:#F2EDF7; --ink-2:#B7ADC3; --ink-3:#968A9F;
    --line:#2F2739; --line-forte:#463B52;
    --crit:#FF9E95; --crit-bg:#3A1714;
    --warn:#E9BA62; --warn-bg:#322509;
    --calm:#82D0AF; --calm-bg:#10281E;
    --sombra: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.8);
    --sombra-forte: 0 2px 4px rgba(0,0,0,.5), 0 18px 44px -22px rgba(0,0,0,.9);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --brand:#BB95D4; --accent:#6D3D93; --accent-forte:#572E77;
    --accent-suave:#F1E9F7; --accent-linha:#DCC9EA; --accent-sobre:#FFFFFF;
    --ground:#F7F5FA; --surface:#FFFFFF; --surface-2:#FBF9FD; --surface-3:#F4F0F9;
    --ink:#1B1421; --ink-2:#564B60; --ink-3:#786783;
    --line:#E5DFEC; --line-forte:#CFC5D9;
    --crit:#B02A21; --crit-bg:#FBE9E7;
    --warn:#855400; --warn-bg:#FAF0DA;
    --calm:#1A6349; --calm-bg:#E2F1EB;
    --sombra: 0 1px 2px rgba(27,20,33,.04), 0 8px 24px -16px rgba(27,20,33,.22);
    --sombra-forte: 0 2px 4px rgba(27,20,33,.06), 0 18px 44px -22px rgba(27,20,33,.32);
  }

  /* ============ BASE ============ */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--font-ui); font-size: var(--t-md); line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .eyebrow {
    font-family: var(--font-mono); font-size: var(--t-micro);
    letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600;
  }
  .shell { max-width: 1240px; margin: 0 auto; padding: 0 var(--s5) var(--s8); }

  /* ============ TOPO FIXO ============ */
  .topo { position: sticky; top: 0; z-index: 40; }
  .topbar { border-bottom: 1px solid var(--line); background: var(--surface); }
  .topbar-in {
    max-width: 1240px; margin: 0 auto; padding: var(--s3) var(--s5);
    display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
  .brand-mark {
    font-family: var(--font-mono); font-size: var(--t-sm); font-weight: 700;
    color: var(--accent-sobre); background: var(--accent);
    padding: var(--s1) 7px; border-radius: var(--r-sm); letter-spacing: .06em;
  }
  h1 { font-size: var(--t-lg); font-weight: 650; margin: 0; letter-spacing: -.015em; }
  .topbar .sub { color: var(--ink-3); font-size: var(--t-sm); margin-left: auto; }

  /* ============ TRILHA DAS ETAPAS ============ */
  .spine { background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .spine-in {
    max-width: 1240px; margin: 0 auto; padding: 0 var(--s5);
    display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin;
  }
  .mo {
    display: flex; align-items: center; gap: 7px;
    padding: var(--s3) var(--s3) 10px; white-space: nowrap; flex: 0 0 auto;
    border: 0; border-bottom: 2px solid transparent;
    font: inherit; background: transparent; text-align: left;
  }
  button.mo { cursor: pointer; }
  button.mo:hover { background: var(--accent-suave); }
  button.mo:hover .mo-t { color: var(--accent); }
  .mo[disabled] { opacity: .45; cursor: not-allowed; }
  .mo[aria-selected="true"] { border-bottom-color: var(--accent); background: var(--surface); }
  .mo-n {
    font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--ink-3);
    border: 1px solid var(--line-forte); width: 18px; height: 18px;
    display: inline-grid; place-items: center; border-radius: 50%; flex: 0 0 auto;
  }
  .mo-t { font-size: var(--t-sm); color: var(--ink-3); }
  .mo.on .mo-n { color: var(--accent-sobre); background: var(--accent); border-color: var(--accent); }
  .mo.on .mo-t { color: var(--ink); font-weight: 600; }
  .mo.ok .mo-n { color: var(--calm); background: var(--calm-bg); border-color: color-mix(in srgb, var(--calm) 40%, transparent); }
  .mo.ok .mo-t { color: var(--ink-2); }

  /* ============ ESTRUTURA ============ */
  .grid {
    display: grid; grid-template-columns: minmax(0,1fr) 356px;
    gap: var(--s6); padding-top: var(--s6); align-items: start;
  }
  @media (max-width: 1080px) { .grid { grid-template-columns: 1fr; gap: var(--s5); } }
  .grid.sem-rail { grid-template-columns: minmax(0,1fr); }
  .rail {
    position: sticky; top: calc(var(--stick) + var(--s5));
    display: flex; flex-direction: column; gap: var(--s3);
  }
  /* no mobile a dúvida sobe para o topo: é o foco da plataforma */
  @media (max-width: 1080px) { .rail { position: static; order: -1; } }
  main { display: flex; flex-direction: column; gap: var(--s6); min-width: 0; }

  /* ============ PAINEIS DO TRILHO ============ */
  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--sombra);
  }
  .panel-h { padding: var(--s3) var(--s4) 0; }
  .panel-b { padding: var(--s2) var(--s4) var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field > label { font-size: var(--t-sm); color: var(--ink-2); font-weight: 600; }
  .hint { font-size: var(--t-xs); color: var(--ink-3); line-height: 1.45; }

  .chips { display: flex; flex-wrap: wrap; gap: var(--s1); }
  .chip {
    font: inherit; font-size: var(--t-sm); cursor: pointer;
    background: var(--surface-2); color: var(--ink-2);
    border: 1px solid var(--line-forte); border-radius: var(--r-sm);
    padding: 5px var(--s2); transition: background .12s, color .12s, border-color .12s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent);
    color: var(--accent-sobre); font-weight: 600;
  }

  /* ============ PAINEL DE DUVIDA — o foco da plataforma ============ */
  .panel.duvida {
    border-color: var(--accent-linha); border-top: 3px solid var(--accent);
    box-shadow: var(--sombra-forte); background: var(--surface);
  }
  .panel.duvida .panel-h { padding: var(--s4) var(--s5) 0; display: flex; flex-direction: column; gap: var(--s1); }
  .panel.duvida .panel-b { padding: var(--s3) var(--s5) var(--s5); gap: var(--s4); }
  .duvida-tag { color: var(--accent); }
  .duvida-titulo {
    margin: 0; font-size: var(--t-lg); font-weight: 650;
    letter-spacing: -.02em; line-height: 1.25; color: var(--ink); text-wrap: balance;
  }
  .duvida-hint { margin: 0; font-size: var(--t-base); color: var(--ink-2); line-height: 1.55; }
  .duvida-rodape { margin: 0; font-size: var(--t-xs); color: var(--ink-3); line-height: 1.5; }
  .search input {
    width: 100%; font: inherit; font-size: var(--t-md); padding: var(--s3) var(--s3);
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line-forte); border-radius: var(--r-sm);
  }
  .panel.duvida .btn.cheio { padding: var(--s3) var(--s4); font-size: var(--t-base); }
  .panel.duvida .results { max-height: 320px; }
  .search input::placeholder { color: var(--ink-3); }
  .search input:focus { border-color: var(--accent); }
  .btn.cheio { width: 100%; justify-content: center; }
  .achados { display: flex; flex-direction: column; gap: var(--s2); padding-top: var(--s3); border-top: 1px solid var(--line); }
  .results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 280px; overflow-y: auto; }
  .results li button {
    width: 100%; text-align: left; font: inherit; font-size: var(--t-sm); cursor: pointer;
    background: transparent; border: 1px solid transparent; border-radius: var(--r-sm);
    padding: 6px var(--s2); color: var(--ink); line-height: 1.4;
  }
  .results li button:hover { background: var(--accent-suave); border-color: var(--accent-linha); }
  .rmod {
    display: block; font-family: var(--font-mono); font-size: 9.5px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 2px;
  }
  .nores { font-size: var(--t-sm); color: var(--ink-3); display: block; padding: var(--s1) 0; }

  /* ============ ETAPAS 1 A 3 ============ */
  .flow { display: flex; flex-direction: column; gap: var(--s2); }
  .stage {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--line-forte); border-radius: var(--r);
    box-shadow: var(--sombra); overflow: hidden;
  }
  .stage.is-active { border-left-color: var(--accent); border-color: var(--accent-linha); box-shadow: var(--sombra-forte); }
  .stage.is-done { border-left-color: var(--calm); box-shadow: none; background: var(--surface-2); }
  .stage.is-locked { opacity: .5; box-shadow: none; background: var(--surface-2); }

  .st-head { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); width: 100%; text-align: left; }
  button.st-head { font: inherit; background: transparent; border: 0; cursor: pointer; color: inherit; }
  button.st-head:hover .st-title { color: var(--accent); }
  .st-n {
    font-family: var(--font-mono); font-size: var(--t-xs); font-weight: 700;
    width: 24px; height: 24px; flex: 0 0 auto; display: grid; place-items: center;
    border-radius: var(--r-sm); border: 1px solid var(--line-forte);
    color: var(--ink-3); background: var(--surface);
  }
  .stage.is-active .st-n { background: var(--accent); border-color: var(--accent); color: var(--accent-sobre); }
  .stage.is-done .st-n { background: var(--calm-bg); border-color: color-mix(in srgb, var(--calm) 40%, transparent); color: var(--calm); }
  .st-title { font-size: var(--t-md); font-weight: 650; letter-spacing: -.01em; }
  .st-sub { font-size: var(--t-sm); color: var(--ink-3); margin-left: auto; text-align: right; }

  /* 24px do número + 12px do gap + 16px do padding = 52px, alinha com o título */
  .st-body { padding: 0 var(--s4) var(--s4) 52px; display: flex; flex-direction: column; gap: var(--s4); }
  .st-body > .lead { margin: 0; font-size: var(--t-base); color: var(--ink-2); max-width: 70ch; }

  .checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .checklist li { display: flex; gap: var(--s3); font-size: var(--t-base); color: var(--ink-2); line-height: 1.5; }
  .checklist li::before {
    content: ""; flex: 0 0 auto; width: 14px; height: 14px; margin-top: 4px;
    border: 1px solid var(--line-forte); border-radius: var(--r-sm); background: var(--surface);
  }
  .checklist li strong { color: var(--ink); font-weight: 600; }

  /* ============ CAIXAS DE DESTAQUE ============ */
  .callout {
    border: 1px solid; border-left-width: 3px; border-radius: var(--r-sm);
    padding: var(--s3); display: flex; flex-direction: column; gap: 6px;
  }
  .callout .ch { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
  .callout p { margin: 0; font-size: var(--t-base); line-height: 1.5; }
  .callout ul { margin: 0; padding-left: var(--s4); font-size: var(--t-sm); color: var(--ink-2); display: flex; flex-direction: column; gap: var(--s1); }
  .c-mode { background: var(--accent-suave); border-color: var(--accent-linha); border-left-color: var(--accent); }
  .c-mode .ch { color: var(--accent); }
  .c-mode p { color: var(--ink); }
  .c-stop { background: var(--crit-bg); border-color: color-mix(in srgb, var(--crit) 25%, transparent); border-left-color: var(--crit); }
  .c-stop .ch { color: var(--crit); }
  .c-say { background: var(--surface-3); border-color: var(--line); border-left-color: var(--line-forte); }
  .c-say .ch { color: var(--ink-3); }
  .c-say p { color: var(--ink); font-style: italic; }

  /* ============ BOTOES ============ */
  .advance { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: var(--t-base); font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-sobre); border: 1px solid var(--accent);
    border-radius: var(--r-sm); padding: 7px var(--s4);
    display: inline-flex; align-items: center; gap: 7px;
    transition: background .12s, border-color .12s, color .12s;
  }
  .btn:hover { background: var(--accent-forte); border-color: var(--accent-forte); }
  .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line-forte); font-weight: 500; }
  .btn.ghost:hover { background: var(--accent-suave); border-color: var(--accent); color: var(--accent); }
  .btn.sm { font-size: var(--t-sm); padding: 5px var(--s3); }
  .advance .why { font-size: var(--t-sm); color: var(--ink-3); }

  .mapbtn {
    font: inherit; font-family: var(--font-mono); font-size: var(--t-xs);
    letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
    background: transparent; color: var(--ink-3);
    border: 1px solid var(--line-forte); border-radius: var(--r-sm); padding: var(--s1) var(--s2);
  }
  .mapbtn:hover { border-color: var(--accent); color: var(--accent); }
  .mapbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-sobre); }

  /* ============ EIXOS ============ */
  #axes { display: flex; flex-direction: column; gap: var(--s6); }
  .step { display: flex; flex-direction: column; gap: var(--s3); }
  .step-h { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
  .step-h h2 { font-size: var(--t-md); font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .step-h .note { font-size: var(--t-sm); color: var(--ink-3); }

  /* grid-auto-rows iguala a altura de todas as fileiras */
  .cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(196px,1fr));
    grid-auto-rows: 1fr; gap: var(--s2);
  }
  .cards.densa { grid-template-columns: repeat(auto-fill, minmax(152px,1fr)); }

  /* etapa 5: os dois caminhos de entrega, lado a lado */
  .modo-cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(212px,1fr));
    gap: var(--s2);
  }
  .modo-card {
    font: inherit; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--line-forte); border-radius: var(--r);
    padding: var(--s3); display: flex; flex-direction: column; gap: 5px;
    transition: border-color .12s, background .12s, box-shadow .12s;
  }
  .modo-card:hover { border-left-color: var(--accent); }
  .modo-card.on {
    background: var(--accent-suave); border-color: var(--accent-linha);
    border-left-color: var(--accent); box-shadow: var(--sombra);
  }
  .modo-rot {
    font-family: var(--font-mono); font-size: 9.5px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
  }
  .modo-card.on .modo-rot { color: var(--accent); }
  .modo-modo { font-size: var(--t-base); font-weight: 650; color: var(--ink); line-height: 1.3; }
  .modo-txt { font-size: var(--t-xs); color: var(--ink-2); line-height: 1.5; }
  .card {
    font: inherit; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--line-forte); border-radius: var(--r);
    padding: var(--s3); display: flex; flex-direction: column; gap: var(--s1);
    transition: border-color .12s, transform .12s, box-shadow .12s;
  }
  .card:hover { border-left-color: var(--accent); transform: translateY(-1px); box-shadow: var(--sombra); }
  .card[aria-pressed="true"] {
    border-color: var(--accent-linha); border-left-color: var(--accent);
    background: var(--accent-suave); box-shadow: var(--sombra);
  }
  .card .ct { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .card .cn { font-size: var(--t-base); font-weight: 650; color: var(--ink); }
  .card .cd { font-size: var(--t-xs); color: var(--ink-3); line-height: 1.4; }

  /* ============ RESULTADO ============ */
  .result {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--sombra); overflow: hidden;
  }
  .rhead { padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--s2); }
  .rtitle { font-size: var(--t-xl); font-weight: 650; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
  .rtitle .sep { color: var(--ink-3); font-weight: 400; }
  .rprazo { margin: 0; font-size: var(--t-base); color: var(--ink-2); }
  .pills { display: flex; flex-wrap: wrap; gap: var(--s1); }

<script>
"use strict";

/* ---------- rede de segurança ----------
   Se o conteudo.js tiver erro de sintaxe, o navegador aborta o arquivo
   inteiro e nenhuma das listas existe. Sem isso, a tela ficaria vazia
   e ninguém saberia por quê. */
(function () {
  var faltando = [];

  if (typeof ETAPAS === "undefined") faltando.push("ETAPAS");

  var REPO = "https://github.com/murilobolzan/playbook-atendimento";

  var msg = err.msg ? '<p class="err-tec">' + err.msg.replace(/</g, "&lt;") + "</p>" : "";

  var linkArquivo = REPO + "/blob/main/conteudo.js" + (linha ? "#L" + linha : "");

  document.body.innerHTML =

      '<span class="err-tag">Playbook fora do ar</span>' +

        "<li><strong>Aspas abertas e não fechadas</strong> em alguma frase.</li>" +

        "<li>Uma <strong>tag <code>&lt;strong&gt;</code></strong> sem a barra no fechamento.</li>" +
      "</ol>" +
      msg +
      '<div class="err-acoes">' +
        '<a class="err-btn" href="' + linkArquivo + '" target="_blank" rel="noopener">Abrir o conteudo.js' + (linha ? " na linha " + linha : "") + "</a>" +

      "</div>" +
      '<p class="err-nota">Para desfazer: abra o histórico, entre no último commit e use <strong>Revert</strong>. ' +
      "O playbook volta ao ar em cerca de 40 segundos.</p>" +

    "</div>";

  var css = document.createElement("style");

  document.head.appendChild(css);

  throw new Error("conteudo.js nao carregou: " + faltando.join(", "));
})();

  fup:"pendente",
  fup2_em:null,
  fup2_limite:null
};

/* ---------- helpers ---------- */
const el = (t,c,h) => { const n = document.createElement(t); if (c) n.className = c; if (h !== undefined) n.innerHTML = h; return n; };
const src = (n,s) => { n.setAttribute("data-src", s); return n; };
const cat = id => CATEGORIAS.find(c => c.id === id);
const mod = id => MODULOS.find(m => m.id === id);
const portoesOk = () => state.feito.ia && state.feito.problema && state.feito.ticket;
const hhmm = d => String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");

/* ---------- gaveta da documentação ----------
   Abre a documentação por cima do playbook, preservando o estado do
   atendimento. Ctrl+clique e clique do meio continuam abrindo em nova aba. */
function abrirDoc(url, titulo, ehPergunta) {
  document.getElementById("gaveta-eyebrow").textContent = ehPergunta ? TEXTOS.docPergunta : TEXTOS.docTitulo;
  document.getElementById("gaveta-titulo").textContent = titulo;
  document.getElementById("gaveta-nova-aba").href = url;
  document.getElementById("gaveta-frame").src = url;
  document.getElementById("gaveta").hidden = false;
  document.body.classList.add("gaveta-aberta");
  document.getElementById("gaveta-fechar").focus();
}

function fecharDoc() {
  document.getElementById("gaveta").hidden = true;
  document.getElementById("gaveta-frame").src = "about:blank";
  document.body.classList.remove("gaveta-aberta");
}

/* liga um link para abrir na gaveta em vez de trocar de página */
function linkDoc(a, url, titulo) {
  a.href = url;
  a.rel = "noopener";
  a.target = "_blank";
  a.addEventListener("click", function (e) {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;
    e.preventDefault();
    abrirDoc(url, titulo, false);
  });
  return a;
}

function perguntarIA() {
  const q = document.getElementById("q").value.trim();
  const url = q ? D + "?ask=" + encodeURIComponent(q) : D;
  abrirDoc(url, q || TEXTOS.docTitulo, !!q);
}

/* troca {espera}, {limite}, {total} e {falta} pelos valores reais */
function fmt(s, extra) {
  const v = Object.assign({
    espera: FUP.esperaHoras,
    limite: FUP.limiteHoras,
    total: FUP.esperaHoras + FUP.limiteHoras
  }, extra || {});
  return String(s).replace(/\{(\w+)\}/g, (m,k) => (k in v ? v[k] : m));
}

/* uma aba por passo: mostra so a seção da aba atual */
function renderAbaVisivel() {
  const mapa = { flow: state.aba <= 3, axes: state.aba === 4, out: state.aba === 5, fup: state.aba === 6 };
  for (const id in mapa) document.getElementById(id).hidden = !mapa[id];

  /* a central de dúvidas aparece na etapa 5, que é onde se resolve de fato.
     Nas outras, o conteúdo ocupa a largura inteira. */
  const rail = document.querySelector(".rail");
  const grid = document.querySelector(".grid");
  const naEtapaDeResolver = state.aba === 5;
  if (rail) rail.hidden = !naEtapaDeResolver;
  if (grid) grid.classList.toggle("sem-rail", !naEtapaDeResolver);
}

function irParaAba(n) {
  state.aba = Math.min(Math.max(n, 1), ETAPAS.length);
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- altura do topo fixo ----------
   O trilho da esquerda gruda logo abaixo do topo. Medir em vez de chutar
   evita que ele passe por baixo do cabecalho quando o texto quebra linha. */
function medirTopo() {
  const topo = document.querySelector(".topo");
  if (!topo) return;
  const h = Math.round(topo.getBoundingClientRect().height);
  if (h > 0) document.documentElement.style.setProperty("--stick", h + "px");
}

/* O cabecalho muda de altura quando o texto quebra linha, quando o aviso do
   modo mapa aparece e quando a janela muda de largura. Observar o elemento
   mantem a medida sempre correta; medir uma vez sozinha fica desatualizada. */
let observadorTopo = null;   /* guardar a referência: observador sem dono pode ser coletado */

function observarTopo() {
  const topo = document.querySelector(".topo");
  if (!topo || typeof ResizeObserver === "undefined") return;
  observadorTopo = new ResizeObserver(medirTopo);
  observadorTopo.observe(topo);
}

/* ---------- trilha do topo ---------- */
function renderSpine() {
  const host = document.getElementById("spine");
  host.textContent = "";
  host.setAttribute("role", "tablist");
  ETAPAS.forEach((titulo, i) => {
    const n = i + 1;
    const concluida = n <= 3 && state.feito[PORTOES[n-1].id];
    const atual = n === state.aba;
    /* etapas 4 a 6 só abrem depois dos três portões: sem atalho na trilha */
    const trancada = n >= 4 && !portoesOk();
    const b = el("button", "mo" + (atual ? " on" : "") + (concluida && !atual ? " ok" : ""));
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(atual));
    b.disabled = trancada;
    b.title = trancada ? titulo + " — " + TEXTOS.spineTrancada : titulo;
    b.onclick = () => { if (!trancada) irParaAba(n); };
    b.append(el("span","mo-n", concluida && !atual ? "✓" : String(n)), el("span","mo-t", titulo));
    host.append(b);
  });
  src(host, "[2] ETAPAS");
}

/* ---------- etapas 1 a 3 ---------- */
function renderFlow() {
  const host = document.getElementById("flow");
  host.textContent = "";
  if (state.aba > 3) return;

  const i = state.aba - 1;
  const p = PORTOES[i];
  const feito = state.feito[p.id];

  const card = src(el("div", "stage is-active" + (feito ? " is-done" : "")), "[3] PORTOES");

  const head = el("div", "st-head");
  head.append(el("span","st-n", feito ? "✓" : String(i+1)));
  head.append(el("span","st-title", p.titulo));
  head.append(el("span","st-sub", feito ? TEXTOS.etapaConcluida : ""));
  card.append(head);

  const body = el("div","st-body");
  body.append(el("p","lead", p.lead));

  const ul = el("ul","checklist");
  p.itens.forEach(x => ul.append(el("li","",x)));
  body.append(ul);


  const stop = el("div","callout c-stop");
  stop.append(el("span","ch", TEXTOS.etapaNaoFaca));
  const su = el("ul");
  p.nunca.forEach(x => su.append(el("li","",x)));
  stop.append(su);
  body.append(stop);

  const adv = el("div","advance");
  const b = el("button","btn", (feito ? "✓ " : "") + p.cta);
  b.type = "button";
  b.onclick = () => { state.feito[p.id] = true; irParaAba(state.aba + 1); };
  adv.append(b, el("span","why", p.why));
  body.append(adv);

  card.append(body);
  host.append(card);
}

/* tempo de plataforma do cliente — vive na etapa 5, junto da entrega.
   Mostra os dois caminhos lado a lado e destaca o escolhido. */
function blocoModoEntrega() {
  const box = src(el("div","block"), "[4] TEMPOS");
  box.append(el("h3","", TEXTOS.resTempoLabel));

  const cards = el("div","modo-cards");
  cards.setAttribute("role","group");
  cards.setAttribute("aria-label", TEXTOS.resTempoLabel);
  TEMPOS.forEach(o => {
    const sel = state.tempo === o.id;
    const b = el("button","modo-card" + (sel ? " on" : ""));
    b.type = "button";
    b.setAttribute("aria-pressed", String(sel));
    b.append(
      el("span","modo-rot", o.rot),
      el("span","modo-modo", o.modo),
      el("span","modo-txt", o.txt)
    );
    b.onclick = () => { state.tempo = o.id; render(); };
    cards.append(b);
  });

  box.append(cards, el("span","microhint", TEXTOS.resTempoHint));
  return box;
}

/* ---------- etapa 4 ---------- */
function renderAxes() {
  const host = document.getElementById("axes");
  host.textContent = "";

  if (!portoesOk()) {
    const lock = src(el("div","lock"), "[10] bloqueio*");
    lock.append(el("span","eyebrow", TEXTOS.bloqueioEyebrow));
    lock.append(el("p","", TEXTOS.bloqueioTexto));
    const ol = el("ol");
    PORTOES.filter(p => !state.feito[p.id]).forEach(p => ol.append(el("li","",p.titulo)));
    lock.append(ol);
    const esc = el("button","btn ghost sm", TEXTOS.bloqueioBotao);
    esc.type = "button";
    esc.onclick = () => {
      state.feito.ia = state.feito.problema = state.feito.ticket = true;
      state.pulou = true;
      irParaAba(4);
    };
    lock.append(esc);
    lock.append(el("p","", '<span class="microhint">' + TEXTOS.bloqueioAviso + "</span>"));
    host.append(lock);
    return;
  }

  const wrapCat = src(el("section","step"), "[6] CATEGORIAS");
  const hc = el("div","step-h");
  hc.append(el("span","eyebrow", TEXTOS.eixo1Eyebrow), el("h2","", TEXTOS.eixo1Titulo), el("span","note", TEXTOS.eixo1Nota));
  wrapCat.append(hc);
  const gc = el("div","cards");
  CATEGORIAS.forEach(c => {
    const b = el("button","card");
    b.type = "button";
    b.setAttribute("aria-pressed", String(state.cat === c.id));
    b.append(el("span","ct",c.trilha), el("span","cn",c.nome), el("span","cd",c.desc));
    b.onclick = () => { state.cat = state.cat === c.id ? null : c.id; resetFup(); render(); };
    gc.append(b);
  });
  wrapCat.append(gc);
  host.append(wrapCat);

  const wrapMod = src(el("section","step"), "[7] MODULOS");
  const hm = el("div","step-h");
  hm.append(el("span","eyebrow", TEXTOS.eixo2Eyebrow), el("h2","", TEXTOS.eixo2Titulo), el("span","note", TEXTOS.eixo2Nota));
  wrapMod.append(hm);
  const gm = el("div","cards densa");
  MODULOS.forEach(m => {
    const b = el("button","card");
    b.type = "button";
    b.setAttribute("aria-pressed", String(state.mod === m.id));
    b.append(el("span","ct",m.area), el("span","cn",m.nome));
    b.onclick = () => { state.mod = state.mod === m.id ? null : m.id; resetFup(); render(); };
    gm.append(b);
  });
  wrapMod.append(gm);
  host.append(wrapMod);
}

/* ---------- etapa 5 ---------- */
function renderOut() {
  const host = document.getElementById("out");
  host.textContent = "";

  if (!portoesOk()) {
    host.append(el("div","empty", TEXTOS.abaTrancada));
    return;
  }
  if (!state.cat || !state.mod) {
    const falta = !state.cat && !state.mod ? "a natureza do ticket e o módulo"
                : !state.cat ? "a natureza do ticket" : "o módulo";
    host.append(el("div","empty", fmt(TEXTOS.eixoVazio, { falta })));
    return;
  }

  const c = cat(state.cat), m = mod(state.mod);
  /* fallback no fim: estado antigo salvo no navegador não pode derrubar a tela */
  const t = TEMPOS.find(x => x.id === state.tempo) || TEMPOS[0];
  const sevId = SEV_POR_CATEGORIA[c.id] || "P3";
  const s = SEV[sevId];

  const wrap = el("div","result");

  const head = el("div","rhead");
  head.append(el("span","eyebrow", TEXTOS.resEyebrow));
  head.append(el("h2","rtitle", c.nome + ' <span class="sep">/</span> ' + m.nome));

    el("span","pill " + s.cls, s.rot),
    el("span","pill p-dono","Dono: " + c.dono),

  );

  head.append(el("p","rprazo", s.prazo));
  wrap.append(head);

  const body = el("div","rbody");

  /* ----- coluna esquerda ----- */
  const L = el("div","rcol");

  L.append(blocoModoEntrega());

  if (m.casos.length) {
    const cs = src(el("div","block"), "[7] casos");
    cs.append(el("h3","", TEXTOS.resCasos + " " + m.nome));
    const ul = el("ul","cases");
    m.casos.slice().sort((a,b) => (b.cat === c.id) - (a.cat === c.id)).forEach(k => {
      const li = el("li","case");
      li.append(el("div","case-s",k.s));
      li.append(el("div","case-c", k.c + (k.cat !== c.id ? ' <em>· ' + TEXTOS.resCasoCostuma + " " + cat(k.cat).nome + "</em>" : "")));
      li.append(linkDoc(el("a","", TEXTOS.resCasoLink), D + k.d, k.s));
      ul.append(li);
    });
    cs.append(ul);
    L.append(cs);
  }

  const exp = src(el("div","block"), "[10] resExplicarItens");
  exp.append(el("h3","", TEXTOS.resExplicarTitulo));
  const eul = el("ul","bul");
  TEXTOS.resExplicarItens.forEach(x => eul.append(el("li","",x)));
  exp.append(eul);
  L.append(exp);

  const stop = src(el("div","callout c-stop"), "[6] nunca");
  stop.append(el("span","ch", TEXTOS.resNaoFaca));
  const su = el("ul");
  c.nunca.forEach(x => su.append(el("li","",x)));
  stop.append(su);
  L.append(stop);

  body.append(L);

  /* ----- coluna direita ----- */
  const R = el("div","rcol");

  const ctx = src(el("div","block"), "[7] onde");
  ctx.append(el("h3","", TEXTOS.resOndeOlhar));
  ctx.append(el("p","txt", m.onde));
  R.append(ctx);

  const col = src(el("div","block"), "[7] coletar");
  col.append(el("h3","", TEXTOS.resColetar));
  const cu = el("ul","bul");
  m.coletar.forEach(x => cu.append(el("li","",x)));
  col.append(cu);
  R.append(col);

  const esc = src(el("div","block"), "[6] escalar");
  esc.append(el("h3","", TEXTOS.resEscalar));
  const eu = el("ul","bul");
  c.escalar.forEach(x => eu.append(el("li","",x)));
  esc.append(eu);
  R.append(esc);

  const dk = src(el("div","block"), "[7] docs");
  dk.append(el("h3","", TEXTOS.resDocs + " " + m.nome));
  const dl = el("ul","doclist");
  m.docs.forEach(d => {
    const li = el("li");
    li.append(linkDoc(el("a","",d.t), D + d.u, d.t)); dl.append(li);
  });
  dk.append(dl);
  R.append(dk);

  const tg = src(el("div","block"), "[6] tags");
  tg.append(el("h3","", TEXTOS.resTags));

  const tags = [...c.tags, "modulo:" + m.id, "sev:" + sevId, "modo:" + t.id];
  if (state.pulou) tags.push("etapas:puladas");
  tags.forEach(x => tw.append(el("span","tag",x)));
  tg.append(tw);

  R.append(tg);

  host.append(wrap);

/* ---------- etapa 6 ---------- */
function resetFup() {
  state.fup = "pendente";
  state.fup2_em = null;
  state.fup2_limite = null;
}

function renderFup() {
  const host = document.getElementById("fup");
  host.textContent = "";
  if (!portoesOk()) { host.append(el("div","empty", TEXTOS.abaTrancada)); return; }
  if (!state.cat || !state.mod) { host.append(el("div","empty", TEXTOS.abaSemTema)); return; }

  const wrap = el("div","result");

  const head = el("div","rhead");
  head.append(el("span","eyebrow", TEXTOS.fupEyebrow));
  head.append(el("h2","rtitle", TEXTOS.fupTitulo));
  head.append(el("p","rprazo", TEXTOS.fupSubtitulo));
  wrap.append(head);

  const col = el("div","rcol");
  const arv = src(el("div","fup"), "[9] FUP");

  /* --- FUP 1 --- */
  const n1 = el("div","fnode" + (state.fup === "pendente" ? " on" : " spent"));
  const h1 = el("div","fnode-h");
  h1.append(el("span","ft", FUP.f1Nome), el("span","fw", fmt(FUP.f1Quando)));
  n1.append(h1);
  const say1 = el("div","callout c-say");
  say1.append(el("span","ch", TEXTOS.fupMandeAssim), el("p","", FUP.f1Mensagem));
  n1.append(say1);

  const br1 = el("div","branches");
  const b1y = el("div","branch yes");
  b1y.append(el("span","bl", FUP.f1SimTitulo), el("span","bt", fmt(FUP.f1SimTexto)));
  const b1n = el("div","branch no");
  b1n.append(el("span","bl", FUP.f1NaoTitulo), el("span","bt", fmt(FUP.f1NaoTexto)));
  br1.append(b1y, b1n);
  n1.append(br1);

  if (state.fup === "pendente") {
    const act = el("div","advance");
    const y = el("button","btn sm", FUP.botaoRespondeu);
    y.type = "button";
    y.onclick = () => { state.fup = "encerrado_confirmado"; render(); };
    const n = el("button","btn ghost sm", FUP.botaoSemResposta);
    n.type = "button";
    n.onclick = () => {
      const agora = new Date();
      state.fup2_em = new Date(agora.getTime() + FUP.esperaHoras*3600e3);
      state.fup2_limite = new Date(agora.getTime() + (FUP.esperaHoras + FUP.limiteHoras)*3600e3);
      state.fup = "fup1_sem_resposta";
      render();
    };
    act.append(y, n);
    n1.append(act);
  }
  arv.append(n1, el("div","fconn","↓"));

  /* --- FUP 2 --- */
  const ativo2 = state.fup === "fup1_sem_resposta";
  const n2 = el("div","fnode" + (ativo2 ? " on" : (state.fup === "pendente" ? "" : " spent")));
  const h2 = el("div","fnode-h");
  h2.append(el("span","ft", FUP.f2Nome), el("span","fw", fmt(FUP.f2Quando)));
  if (state.fup2_em) h2.append(el("span","clock", TEXTOS.fupEnviarAs + " " + hhmm(state.fup2_em)));
  n2.append(h2);
  const say2 = el("div","callout c-say");
  say2.append(el("span","ch", TEXTOS.fupMandeAssim), el("p","", FUP.f2Mensagem));
  n2.append(say2);

  const br2 = el("div","branches");
  const b2y = el("div","branch yes");
  b2y.append(el("span","bl", FUP.f2SimTitulo), el("span","bt", fmt(FUP.f2SimTexto)));
  const b2n = el("div","branch no");
  b2n.append(el("span","bl", fmt(FUP.f2NaoTitulo)),
    el("span","bt", fmt(FUP.f2NaoTexto) +
      (state.fup2_limite ? ' <span class="clock">' + TEXTOS.fupAPartirDas + " " + hhmm(state.fup2_limite) + "</span>" : "")));
  br2.append(b2y, b2n);
  n2.append(br2);

  if (ativo2) {
    const act = el("div","advance");
    const y = el("button","btn sm", FUP.botaoRespondeu);
    y.type = "button";
    y.onclick = () => { state.fup = "encerrado_confirmado"; render(); };
    const n = el("button","btn ghost sm", FUP.botaoEncerrar);
    n.type = "button";
    n.onclick = () => { state.fup = "encerrado_inatividade"; render(); };
    act.append(y, n, el("span","why", FUP.avisoEncerrar));
    n2.append(act);
  }
  arv.append(n2);
  col.append(arv);

  /* --- desfecho --- */
  if (state.fup === "encerrado_confirmado" || state.fup === "encerrado_inatividade") {
    const ok = state.fup === "encerrado_confirmado";
    const done = el("div","callout " + (ok ? "c-mode" : "c-stop"));
    done.append(el("span","ch", ok ? FUP.okTitulo : FUP.inativoTitulo));
    done.append(el("p","", ok ? FUP.okTexto : FUP.inativoTexto));
    col.append(done);

    const tg = el("div","block");
    tg.append(el("h3","", FUP.tituloTags));
    const tw = el("div","tags");
    [ "encerramento:" + (ok ? "confirmado" : "inatividade"),
      "fups:" + (ok && !state.fup2_em ? "1" : "2"),
      "confirmado_pelo_cliente:" + (ok ? "sim" : "nao")
    ].forEach(x => tw.append(el("span","tag",x)));
    tg.append(tw);
    col.append(tg);

    const back = el("div","advance");
    const b = el("button","btn ghost sm", FUP.botaoRefazer);
    b.type = "button";
    b.onclick = () => { resetFup(); render(); };
    back.append(b);
    col.append(back);
  }

  /* --- regra sempre visível --- */
  const rule = el("div","block");
  rule.append(el("h3","", FUP.tituloRegra));
  const kv = el("div","kv");
  FUP.regra.forEach(([k,v]) => {
    const row = el("div","kv-row");
    row.append(el("span","kv-k", k), el("span","kv-v", fmt(v)));
    kv.append(row);
  });
  rule.append(kv);
  col.append(rule);

  wrap.append(col);
  host.append(wrap);
}

/* ---------- busca ---------- */
/* tira acento e caixa: quem digita "pedido nao chega" acha "não chegam" */
const DIACRITICOS = new RegExp("[\\u0300-\\u036f]", "g");
const norm = s => String(s).normalize("NFD").replace(DIACRITICOS, "").toLowerCase();

const INDEX = [];
MODULOS.forEach(m => {
  INDEX.push({ label:m.nome, mod:m.id, cat:null, hay:norm(m.nome + " " + m.area + " " + m.onde) });
  m.casos.forEach(k => INDEX.push({ label:k.s, mod:m.id, cat:k.cat, hay:norm(k.s + " " + k.c + " " + m.nome) }));
});

function renderResults() {
  const q = norm(document.getElementById("q").value.trim());
  const host = document.getElementById("results");
  const caixa = document.getElementById("achados");
  host.textContent = "";
  if (q.length < 2) { caixa.hidden = true; return; }
  caixa.hidden = false;
  const hits = INDEX.filter(i => q.split(/\s+/).every(w => i.hay.includes(w))).slice(0, 12);
  if (!hits.length) {
    host.append(el("li","", '<span class="nores">' + TEXTOS.buscaVazia + "</span>"));
    return;
  }
  hits.forEach(h => {
    const li = el("li");
    const b = el("button");
    b.type = "button";
    b.innerHTML = h.label + '<span class="rmod">' + mod(h.mod).nome + (h.cat ? " · " + cat(h.cat).nome : "") + "</span>";
    b.onclick = () => {
      state.mod = h.mod;
      if (h.cat) state.cat = h.cat;
      resetFup();
      document.getElementById("q").value = "";
      renderResults();
      irParaAba(portoesOk() ? 5 : 4);
    };
    li.append(b);
    host.append(li);
  });
}

/* ---------- boot ---------- */
function render() {
  renderMoldura(); renderSpine();
  renderFlow(); renderAxes(); renderOut(); renderFup();
  renderAbaVisivel();
  medirTopo();
}

window.addEventListener("resize", medirTopo);
window.addEventListener("load", medirTopo);
observarTopo();

/* o topo muda de altura enquanto a fonte e o layout assentam; dois quadros
   depois do boot a medida ja e a definitiva */
requestAnimationFrame(() => requestAnimationFrame(medirTopo));

document.getElementById("q").addEventListener("input", renderResults);

document.getElementById("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); perguntarIA(); }
});

document.getElementById("btn-ia").addEventListener("click", perguntarIA);
document.getElementById("gaveta-fechar").addEventListener("click", fecharDoc);
document.getElementById("gaveta-fundo").addEventListener("click", fecharDoc);

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !document.getElementById("gaveta").hidden) fecharDoc();
});

document.getElementById("btn-voltar").addEventListener("click", () => irParaAba(state.aba - 1));
document.getElementById("btn-avancar").addEventListener("click", () => irParaAba(state.aba + 1));

document.getElementById("btn-mapa").addEventListener("click", () => {
  state.mapa = !state.mapa;
  render();
});

document.getElementById("reset").addEventListener("click", () => {
  state.feito = { ia:false, problema:false, ticket:false };
  state.aba = 1;
  state.pulou = false;
  state.cat = null; state.mod = null;
  resetFup();
  document.getElementById("q").value = "";
  renderResults(); render();
  window.scrollTo({ top:0, behavior:"smooth" });
});

render();
</script>
