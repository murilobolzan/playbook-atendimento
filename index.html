<style>
  /* ═══════════════════════════════════════════════════════════════════════
     PALETA — derivada da cor da marca Dionísio.
     O tema da documentação declara --primary-original: 187 149 212, ou seja
     #BB95D4, um lilás em hsl(276 42% 71%). Toda a escala abaixo sai desse
     matiz, inclusive os cinzas, que puxam de leve para o roxo em vez de
     serem neutros puros.
     ═══════════════════════════════════════════════════════════════════ */
  :root {
    color-scheme: light;

    --brand:        #BB95D4;   /* a cor da marca */
    --accent:       #6D3D93;   /* versão legível sobre branco, 7,2:1 */
    --accent-forte: #572E77;
    --accent-suave: #F1E9F7;
    --accent-linha: #DCC9EA;
    --accent-sobre: #FFFFFF;

    --ground:       #F7F5FA;
    --surface:      #FFFFFF;
    --surface-2:    #FBF9FD;
    --surface-3:    #F4F0F9;
    --ink:          #1B1421;
    --ink-2:        #564B60;
    --ink-3:        #786783;
    --line:         #E5DFEC;
    --line-forte:   #CFC5D9;

    --crit: #B02A21;  --crit-bg: #FBE9E7;
    --warn: #855400;  --warn-bg: #FAF0DA;
    --calm: #1A6349;  --calm-bg: #E2F1EB;

    /* escala de espaçamento: tudo na tela usa um destes valores */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
    --s5: 20px; --s6: 24px; --s7: 32px; --s8: 44px;

    /* escala tipográfica */
    --t-micro: 10.5px; --t-xs: 11.5px; --t-sm: 12.5px;
    --t-base: 13.5px;  --t-md: 15px;   --t-lg: 17px; --t-xl: 20px;

    --r: 4px;
    --r-sm: 3px;
    --sombra: 0 1px 2px rgba(27,20,33,.04), 0 8px 24px -16px rgba(27,20,33,.22);
    --sombra-forte: 0 2px 4px rgba(27,20,33,.06), 0 18px 44px -22px rgba(27,20,33,.32);

    --stick: 108px;  /* altura do topo fixo; o JS mede e corrige */

    --font-ui: "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --font-mono: "Cascadia Mono","Cascadia Code",Consolas,"SF Mono",ui-monospace,Menlo,monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --brand:#BB95D4; --accent:#C9A6DE; --accent-forte:#DABEE9;
      --accent-suave:#2A1B36; --accent-linha:#4A3560; --accent-sobre:#1D1226;
      --ground:#120E18; --surface:#1B1523; --surface-2:#221A2C; --surface-3:#1F1829;
      --ink:#F2EDF7; --ink-2:#B7ADC3; --ink-3:#968A9F;
      --line:#2F2739; --line-forte:#463B52;
      --crit:#FF9E95; --crit-bg:#3A1714;
      --warn:#E9BA62; --warn-bg:#322509;
      --calm:#82D0AF; --calm-bg:#10281E;
      --sombra: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.8);
      --sombra-forte: 0 2px 4px rgba(0,0,0,.5), 0 18px 44px -22px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --brand:#BB95D4; --accent:#C9A6DE; --accent-forte:#DABEE9;
    --accent-suave:#2A1B36; --accent-linha:#4A3560; --accent-sobre:#1D1226;
    --ground:#120E18; --surface:#1B1523; --surface-2:#221A2C; --surface-3:#1F1829;
    --ink:#F2EDF7; --ink-2:#B7ADC3; --ink-3:#968A9F;
    --line:#2F2739; --line-forte:#463B52;
    --crit:#FF9E95; --crit-bg:#3A1714;
    --warn:#E9BA62; --warn-bg:#322509;
    --calm:#82D0AF; --calm-bg:#10281E;
    --sombra: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.8);
    --sombra-forte: 0 2px 4px rgba(0,0,0,.5), 0 18px 44px -22px rgba(0,0,0,.9);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --brand:#BB95D4; --accent:#6D3D93; --accent-forte:#572E77;
    --accent-suave:#F1E9F7; --accent-linha:#DCC9EA; --accent-sobre:#FFFFFF;
    --ground:#F7F5FA; --surface:#FFFFFF; --surface-2:#FBF9FD; --surface-3:#F4F0F9;
    --ink:#1B1421; --ink-2:#564B60; --ink-3:#786783;
    --line:#E5DFEC; --line-forte:#CFC5D9;
    --crit:#B02A21; --crit-bg:#FBE9E7;
    --warn:#855400; --warn-bg:#FAF0DA;
    --calm:#1A6349; --calm-bg:#E2F1EB;
    --sombra: 0 1px 2px rgba(27,20,33,.04), 0 8px 24px -16px rgba(27,20,33,.22);
    --sombra-forte: 0 2px 4px rgba(27,20,33,.06), 0 18px 44px -22px rgba(27,20,33,.32);
  }

  /* ============ BASE ============ */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--font-ui); font-size: var(--t-md); line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .eyebrow {
    font-family: var(--font-mono); font-size: var(--t-micro);
    letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600;
  }

  /* ============ CABECALHO ============ */
  .topbar {
    border-bottom: 1px solid var(--line); background: var(--surface);
    position: sticky; top: 0; z-index: 40;
  }
  .topbar-in {
    max-width: 1560px; margin: 0 auto; padding: var(--s3) var(--s5);
    display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
  .brand-mark {
    font-family: var(--font-mono); font-size: var(--t-sm); font-weight: 700;
    color: var(--accent-sobre); background: var(--accent);
    padding: var(--s1) var(--s2); border-radius: var(--r-sm); letter-spacing: .04em;
  }
  h1 { font-size: var(--t-lg); font-weight: 650; margin: 0; letter-spacing: -.015em; }
  .topbar .sub { color: var(--ink-3); font-size: var(--t-sm); margin-left: auto; }

  .menu-btn {
    display: none; font: inherit; font-size: var(--t-lg); line-height: 1; cursor: pointer;
    background: transparent; color: var(--ink-2);
    border: 1px solid var(--line-forte); border-radius: var(--r-sm); padding: 4px 10px;
  }
  .menu-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ============ ESTRUTURA: BARRA LATERAL + CONTEUDO ============ */
  .app {
    max-width: 1560px; margin: 0 auto; padding: 0 var(--s5) var(--s8);
    display: grid; grid-template-columns: 300px minmax(0,1fr); gap: var(--s6);
    align-items: start;
  }
  .conteudo { display: flex; flex-direction: column; gap: var(--s6); min-width: 0; padding-top: var(--s6); }

  .side {
    position: sticky; top: calc(var(--stick) + var(--s5));
    max-height: calc(100vh - var(--stick) - var(--s7));
    display: flex; flex-direction: column; gap: var(--s4);
    padding-top: var(--s6);
  }
  .side-nav { overflow-y: auto; overscroll-behavior: contain; padding-right: var(--s1); }

  .véu { display: none; }

  @media (max-width: 1080px) {
    .app { grid-template-columns: 1fr; }
    .menu-btn { display: inline-block; }
    .side {
      position: fixed; inset: 0 auto 0 0; z-index: 70; width: min(320px, 86vw);
      max-height: none; padding: var(--s5); background: var(--surface);
      border-right: 1px solid var(--line); box-shadow: 10px 0 40px -20px rgba(0,0,0,.5);
      transform: translateX(-102%); transition: transform .18s ease;
    }
    body.menu-aberto .side { transform: translateX(0); }
    body.menu-aberto .véu {
      display: block; position: fixed; inset: 0; z-index: 65; background: rgba(20,12,28,.5);
    }
    .conteudo { padding-top: var(--s5); }
  }
  @media (prefers-reduced-motion: reduce) { .side { transition: none; } }

  /* ============ BUSCA COM LUPA ============ */
  .side-busca { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
  .lupa { position: relative; display: flex; align-items: center; }
  .lupa-icone {
    position: absolute; left: 11px; width: 16px; height: 16px; pointer-events: none;
    fill: none; stroke: var(--ink-3); stroke-width: 1.8; stroke-linecap: round;
  }
  .lupa input {
    width: 100%; font: inherit; font-size: var(--t-base);
    padding: 10px var(--s7) 10px 34px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line-forte); border-radius: var(--r);
  }
  .lupa input::placeholder { color: var(--ink-3); }
  .lupa input:focus { border-color: var(--accent); }
  .lupa input:focus ~ .lupa-icone { stroke: var(--accent); }
  .lupa-limpa {
    position: absolute; right: 6px; font: inherit; font-size: 18px; line-height: 1;
    cursor: pointer; background: transparent; border: 0; color: var(--ink-3);
    padding: 2px 8px; border-radius: var(--r-sm);
  }
  .lupa-limpa:hover { color: var(--accent); background: var(--accent-suave); }
  .side-dica { font-size: var(--t-xs); color: var(--ink-3); line-height: 1.45; }

  /* ============ NAVEGACAO DA BARRA LATERAL ============ */
  .nav-grupo { display: flex; flex-direction: column; gap: 2px; margin-bottom: var(--s4); }
  .nav-titulo {
    font-family: var(--font-mono); font-size: var(--t-micro); font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
    padding: 0 var(--s2) 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: var(--s2); width: 100%;
    font: inherit; font-size: var(--t-base); text-align: left; cursor: pointer;
    background: transparent; color: var(--ink-2);
    border: 1px solid transparent; border-radius: var(--r-sm);
    padding: 7px var(--s2);
  }
  .nav-item:hover { background: var(--accent-suave); color: var(--accent); }
  .nav-item.on { background: var(--accent-suave); border-color: var(--accent-linha); color: var(--accent); font-weight: 650; }
  .nav-item[disabled] { opacity: .42; cursor: not-allowed; }
  .nav-item[disabled]:hover { background: transparent; color: var(--ink-2); }
  .nav-n {
    flex: 0 0 auto; font-family: var(--font-mono); font-size: 10px; font-weight: 700;
    width: 19px; height: 19px; display: grid; place-items: center; border-radius: 50%;
    border: 1px solid var(--line-forte); color: var(--ink-3); background: var(--surface);
  }
  .nav-item.on .nav-n { background: var(--accent); border-color: var(--accent); color: var(--accent-sobre); }
  .nav-item.ok .nav-n { color: var(--calm); background: var(--calm-bg); border-color: color-mix(in srgb, var(--calm) 40%, transparent); }
  .nav-txt { min-width: 0; overflow-wrap: anywhere; }
  .nav-conta {
    margin-left: auto; flex: 0 0 auto; font-family: var(--font-mono); font-size: 10px;
    color: var(--ink-3); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 99px; padding: 1px 6px;
  }
  .nav-item.on .nav-conta { color: var(--accent); background: var(--surface); border-color: var(--accent-linha); }

  /* aba pai, que abre e fecha as sub-abas */
  .nav-pai { font-weight: 600; color: var(--ink); }
  .nav-seta {
    flex: 0 0 auto; width: 14px; text-align: center; font-size: 10px;
    color: var(--ink-3); transition: transform .14s ease;
  }
  .nav-pai[aria-expanded="true"] .nav-seta { transform: rotate(90deg); }
  .nav-filhos { display: flex; flex-direction: column; gap: 1px; margin: 2px 0 var(--s2) var(--s4); border-left: 1px solid var(--line); padding-left: var(--s2); }
  .nav-filhos .nav-item { font-size: var(--t-sm); padding: 6px var(--s2); }
  .nav-vazia .nav-txt { color: var(--ink-3); font-style: italic; }
  /* ============ PAINEIS DO TRILHO ============ */
  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--sombra);
  }
  .panel-h { padding: var(--s3) var(--s4) 0; }
  .panel-b { padding: var(--s2) var(--s4) var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field > label { font-size: var(--t-sm); color: var(--ink-2); font-weight: 600; }
  .hint { font-size: var(--t-xs); color: var(--ink-3); line-height: 1.45; }

  .chips { display: flex; flex-wrap: wrap; gap: var(--s1); }
  .chip {
    font: inherit; font-size: var(--t-sm); cursor: pointer;
    background: var(--surface-2); color: var(--ink-2);
    border: 1px solid var(--line-forte); border-radius: var(--r-sm);
    padding: 5px var(--s2); transition: background .12s, color .12s, border-color .12s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent);
    color: var(--accent-sobre); font-weight: 600;
  }

  /* ============ PAINEL DE DUVIDA — o foco da plataforma ============ */
  .panel.duvida {
    border-color: var(--accent-linha); border-top: 3px solid var(--accent);
    box-shadow: var(--sombra-forte); background: var(--surface);
  }
  .panel.duvida .panel-h { padding: var(--s4) var(--s5) 0; display: flex; flex-direction: column; gap: var(--s1); }
  .panel.duvida .panel-b { padding: var(--s3) var(--s5) var(--s5); gap: var(--s4); }
  .duvida-tag { color: var(--accent); }
  .duvida-titulo {
    margin: 0; font-size: var(--t-lg); font-weight: 650;
    letter-spacing: -.02em; line-height: 1.25; color: var(--ink); text-wrap: balance;
  }
  .duvida-hint { margin: 0; font-size: var(--t-base); color: var(--ink-2); line-height: 1.55; }
  .duvida-rodape { margin: 0; font-size: var(--t-xs); color: var(--ink-3); line-height: 1.5; }
  .search input {
    width: 100%; font: inherit; font-size: var(--t-md); padding: var(--s3) var(--s3);
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line-forte); border-radius: var(--r-sm);
  }
  .panel.duvida .btn.cheio { padding: var(--s3) var(--s4); font-size: var(--t-base); }
  .panel.duvida .results { max-height: 320px; }
  .search input::placeholder { color: var(--ink-3); }
  .search input:focus { border-color: var(--accent); }
  .btn.cheio { width: 100%; justify-content: center; }
  .achados { display: flex; flex-direction: column; gap: var(--s2); padding-top: var(--s3); border-top: 1px solid var(--line); }
  .results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 280px; overflow-y: auto; }
  .results li button {
    width: 100%; text-align: left; font: inherit; font-size: var(--t-sm); cursor: pointer;
    background: transparent; border: 1px solid transparent; border-radius: var(--r-sm);
    padding: 6px var(--s2); color: var(--ink); line-height: 1.4;
  }
  .results li button:hover { background: var(--accent-suave); border-color: var(--accent-linha); }
  .rmod {
    display: block; font-family: var(--font-mono); font-size: 9.5px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 2px;
  }
  .nores { font-size: var(--t-sm); color: var(--ink-3); display: block; padding: var(--s1) 0; }

  /* ============ ETAPAS 1 A 3 ============ */
  .flow { display: flex; flex-direction: column; gap: var(--s2); }
  .stage {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--line-forte); border-radius: var(--r);
    box-shadow: var(--sombra); overflow: hidden;
  }
  .stage.is-active { border-left-color: var(--accent); border-color: var(--accent-linha); box-shadow: var(--sombra-forte); }
  .stage.is-done { border-left-color: var(--calm); box-shadow: none; background: var(--surface-2); }
  .stage.is-locked { opacity: .5; box-shadow: none; background: var(--surface-2); }

  .st-head { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); width: 100%; text-align: left; }
  button.st-head { font: inherit; background: transparent; border: 0; cursor: pointer; color: inherit; }
  button.st-head:hover .st-title { color: var(--accent); }
  .st-n {
    font-family: var(--font-mono); font-size: var(--t-xs); font-weight: 700;
    width: 24px; height: 24px; flex: 0 0 auto; display: grid; place-items: center;
    border-radius: var(--r-sm); border: 1px solid var(--line-forte);
    color: var(--ink-3); background: var(--surface);
  }
  .stage.is-active .st-n { background: var(--accent); border-color: var(--accent); color: var(--accent-sobre); }
  .stage.is-done .st-n { background: var(--calm-bg); border-color: color-mix(in srgb, var(--calm) 40%, transparent); color: var(--calm); }
  .st-title { font-size: var(--t-md); font-weight: 650; letter-spacing: -.01em; }
  .st-sub { font-size: var(--t-sm); color: var(--ink-3); margin-left: auto; text-align: right; }

  /* 24px do número + 12px do gap + 16px do padding = 52px, alinha com o título */
  .st-body { padding: 0 var(--s4) var(--s4) 52px; display: flex; flex-direction: column; gap: var(--s4); }
  .st-body > .lead { margin: 0; font-size: var(--t-base); color: var(--ink-2); max-width: 70ch; }

  .checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .checklist li { display: flex; gap: var(--s3); font-size: var(--t-base); color: var(--ink-2); line-height: 1.5; }
  .checklist li::before {
    content: ""; flex: 0 0 auto; width: 14px; height: 14px; margin-top: 4px;
    border: 1px solid var(--line-forte); border-radius: var(--r-sm); background: var(--surface);
  }
  .checklist li strong { color: var(--ink); font-weight: 600; }

  /* ============ CAIXAS DE DESTAQUE ============ */
  .callout {
    border: 1px solid; border-left-width: 3px; border-radius: var(--r-sm);
    padding: var(--s3); display: flex; flex-direction: column; gap: 6px;
  }
  .callout .ch { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
  .callout p { margin: 0; font-size: var(--t-base); line-height: 1.5; }
  .callout ul { margin: 0; padding-left: var(--s4); font-size: var(--t-sm); color: var(--ink-2); display: flex; flex-direction: column; gap: var(--s1); }
  .c-mode { background: var(--accent-suave); border-color: var(--accent-linha); border-left-color: var(--accent); }
  .c-mode .ch { color: var(--accent); }
  .c-mode p { color: var(--ink); }
  .c-stop { background: var(--crit-bg); border-color: color-mix(in srgb, var(--crit) 25%, transparent); border-left-color: var(--crit); }
  .c-stop .ch { color: var(--crit); }
  .c-say { background: var(--surface-3); border-color: var(--line); border-left-color: var(--line-forte); }
  .c-say .ch { color: var(--ink-3); }
  .c-say p { color: var(--ink); font-style: italic; }

  /* ============ BOTOES ============ */
  .advance { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: var(--t-base); font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-sobre); border: 1px solid var(--accent);
    border-radius: var(--r-sm); padding: 7px var(--s4);
    display: inline-flex; align-items: center; gap: 7px;
    transition: background .12s, border-color .12s, color .12s;
  }
  .btn:hover { background: var(--accent-forte); border-color: var(--accent-forte); }
  .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line-forte); font-weight: 500; }
  .btn.ghost:hover { background: var(--accent-suave); border-color: var(--accent); color: var(--accent); }
  .btn.sm { font-size: var(--t-sm); padding: 5px var(--s3); }
  .advance .why { font-size: var(--t-sm); color: var(--ink-3); }


  /* ============ EIXOS ============ */
  #axes { display: flex; flex-direction: column; gap: var(--s6); }
  .step { display: flex; flex-direction: column; gap: var(--s3); }
  .step-h { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
  .step-h h2 { font-size: var(--t-md); font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .step-h .note { font-size: var(--t-sm); color: var(--ink-3); }

  /* grid-auto-rows iguala a altura de todas as fileiras */
  .cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(196px,1fr));
    grid-auto-rows: 1fr; gap: var(--s2);
  }
  .cards.densa { grid-template-columns: repeat(auto-fill, minmax(152px,1fr)); }

  /* etapa 5: os dois caminhos de entrega, lado a lado */
  .modo-cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(212px,1fr));
    gap: var(--s2);
  }
  .modo-card {
    font: inherit; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--line-forte); border-radius: var(--r);
    padding: var(--s3); display: flex; flex-direction: column; gap: 5px;
    transition: border-color .12s, background .12s, box-shadow .12s;
  }
  .modo-card:hover { border-left-color: var(--accent); }
  .modo-card.on {
    background: var(--accent-suave); border-color: var(--accent-linha);
    border-left-color: var(--accent); box-shadow: var(--sombra);
  }
  .modo-rot {
    font-family: var(--font-mono); font-size: 9.5px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
  }
  .modo-card.on .modo-rot { color: var(--accent); }
  .modo-modo { font-size: var(--t-base); font-weight: 650; color: var(--ink); line-height: 1.3; }
  .modo-txt { font-size: var(--t-xs); color: var(--ink-2); line-height: 1.5; }
  .card {
    font: inherit; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--line-forte); border-radius: var(--r);
    padding: var(--s3); display: flex; flex-direction: column; gap: var(--s1);
    transition: border-color .12s, transform .12s, box-shadow .12s;
  }
  .card:hover { border-left-color: var(--accent); transform: translateY(-1px); box-shadow: var(--sombra); }
  .card[aria-pressed="true"] {
    border-color: var(--accent-linha); border-left-color: var(--accent);
    background: var(--accent-suave); box-shadow: var(--sombra);
  }
  .card .ct { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .card .cn { font-size: var(--t-base); font-weight: 650; color: var(--ink); }
  .card .cd { font-size: var(--t-xs); color: var(--ink-3); line-height: 1.4; }

  /* ============ RESULTADO ============ */
  .result {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--sombra); overflow: hidden;
  }
  .rhead { padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--s2); }
  .rtitle { font-size: var(--t-xl); font-weight: 650; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
  .rtitle .sep { color: var(--ink-3); font-weight: 400; }
  .rprazo { margin: 0; font-size: var(--t-base); color: var(--ink-2); }
  .pills { display: flex; flex-wrap: wrap; gap: var(--s1); }
  .pill {
    font-family: var(--font-mono); font-size: var(--t-micro); font-weight: 600;
    letter-spacing: .07em; text-transform: uppercase; padding: 3px var(--s2);
    border-radius: var(--r-sm); border: 1px solid; display: inline-flex; align-items: center; gap: 5px;
  }
  .p-crit { color: var(--crit); background: var(--crit-bg); border-color: color-mix(in srgb, var(--crit) 32%, transparent); }
  .p-warn { color: var(--warn); background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 32%, transparent); }
  .p-calm { color: var(--calm); background: var(--calm-bg); border-color: color-mix(in srgb, var(--calm) 32%, transparent); }
  .p-dono { color: var(--accent); background: var(--accent-suave); border-color: var(--accent-linha); }
  .p-line { color: var(--ink-3); background: var(--surface-2); border-color: var(--line); }

  /* ============ RESPOSTAS RAPIDAS ============ */
  .rcard {
    border: 1px solid var(--line); border-left: 3px solid var(--accent-linha);
    border-radius: var(--r); background: var(--surface); overflow: hidden;
  }
  .rcard.interno { border-left-color: var(--warn); }
  .rcard-h {
    display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
    padding: var(--s2) var(--s4); background: var(--surface-2);
    border-bottom: 1px solid var(--line);
  }
  .rcard-caminho {
    font-family: var(--font-mono); font-size: var(--t-micro); font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);
  }
  .rcard-interno {
    margin-left: auto; font-family: var(--font-mono); font-size: var(--t-micro);
    font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--warn); background: var(--warn-bg);
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: 99px; padding: 2px var(--s2);
  }
  .rcard-titulo {
    margin: 0; padding: var(--s3) var(--s4) 0;
    font-size: var(--t-md); font-weight: 650; letter-spacing: -.01em; text-wrap: balance;
  }
  .rcard-corpo { padding: var(--s2) var(--s4) var(--s3); display: flex; flex-direction: column; gap: var(--s3); }
  .rcard-corpo p { margin: 0; font-size: var(--t-base); color: var(--ink-2); line-height: 1.6; }
  .rcard-corpo strong { color: var(--ink); font-weight: 600; }
  .rcard-pe {
    display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
    padding: var(--s3) var(--s4); border-top: 1px solid var(--line); background: var(--surface-2);
  }

  mark { background: color-mix(in srgb, var(--accent) 24%, transparent); color: inherit; border-radius: 2px; padding: 0 2px; }

  /* ============ RESULTADO DA BUSCA ============ */
  .achado-lista { display: flex; flex-direction: column; gap: 2px; }
  .achado {
    display: grid; grid-template-columns: 128px minmax(0,1fr) auto; gap: var(--s3);
    align-items: baseline; width: 100%; text-align: left; font: inherit; cursor: pointer;
    background: transparent; border: 1px solid transparent; border-radius: var(--r-sm);
    padding: var(--s2) var(--s3);
  }
  .achado:hover { background: var(--accent-suave); border-color: var(--accent-linha); }
  .achado-tipo {
    font-family: var(--font-mono); font-size: var(--t-micro); font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);
  }
  .achado-rot { font-size: var(--t-base); color: var(--ink); overflow-wrap: anywhere; }
  .achado-onde { font-size: var(--t-xs); color: var(--ink-3); white-space: nowrap; }
  @media (max-width: 640px) {
    .achado { grid-template-columns: 1fr; gap: 2px; }
    .achado-onde { white-space: normal; }
  }

  .busca-ia {
    display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap;
    padding: var(--s4); border: 1px solid var(--accent-linha);
    border-radius: var(--r); background: var(--accent-suave);
  }
  .busca-ia p { margin: 0; font-size: var(--t-base); color: var(--ink); font-weight: 600; }

  /* ============ REGUA DE AVALIACAO (aba de consulta) ============ */

  .grupo { display: flex; flex-direction: column; gap: var(--s3); }
  .grupo-nome {
    margin: 0; font-family: var(--font-mono); font-size: var(--t-xs);
    font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); padding-bottom: var(--s2);
    border-bottom: 1px solid var(--accent-linha);
  }
  .crit {
    border: 1px solid var(--line); border-left: 3px solid var(--line-forte);
    border-radius: var(--r); background: var(--surface); overflow: hidden;
  }
  .crit-h {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s3) var(--s4); background: var(--surface-2);
    border-bottom: 1px solid var(--line);
  }
  .crit-n {
    flex: 0 0 auto; font-family: var(--font-mono); font-size: var(--t-xs); font-weight: 700;
    width: 22px; height: 22px; display: grid; place-items: center; border-radius: var(--r-sm);
    color: var(--accent-sobre); background: var(--accent);
  }
  .crit-nome { margin: 0; font-size: var(--t-md); font-weight: 650; letter-spacing: -.01em; }
  .crit-peso {
    margin-left: auto; flex: 0 0 auto; white-space: nowrap;
    font-family: var(--font-mono); font-size: var(--t-micro); font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-suave);
    border: 1px solid var(--accent-linha); border-radius: 99px; padding: 3px var(--s2);
  }
  .crit-obs {
    margin: 0; padding: var(--s3) var(--s4); font-size: var(--t-base);
    color: var(--ink-2); line-height: 1.5; border-bottom: 1px solid var(--line);
  }
  .crit-obs strong { color: var(--ink); font-weight: 600; }

  .regua { list-style: none; margin: 0; padding: var(--s2) var(--s3) var(--s3); display: flex; flex-direction: column; gap: 1px; }
  .nivel { display: flex; align-items: flex-start; gap: var(--s3); padding: 7px var(--s2); border-radius: var(--r-sm); }
  .nivel:nth-child(odd) { background: var(--surface-2); }
  .nivel-n {
    flex: 0 0 auto; font-family: var(--font-mono); font-size: 10px; font-weight: 700;
    width: 19px; height: 19px; display: grid; place-items: center; margin-top: 1px;
    border: 1px solid var(--line-forte); border-radius: 50%;
    color: var(--ink-3); background: var(--surface);
  }
  .nivel:last-child .nivel-n { color: var(--calm); background: var(--calm-bg); border-color: color-mix(in srgb, var(--calm) 40%, transparent); }
  .nivel:first-child .nivel-n { color: var(--crit); background: var(--crit-bg); border-color: color-mix(in srgb, var(--crit) 40%, transparent); }
  .nivel-t { font-size: var(--t-base); color: var(--ink-2); line-height: 1.5; }
  .nivel:last-child .nivel-t { color: var(--ink); font-weight: 600; }

  /* ============ ESCOLHA DO TEMA, DENTRO DA ETAPA 3 ============ */
  .eixos {
    display: flex; flex-direction: column; gap: var(--s5);
    padding: var(--s4); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: var(--r-sm);
    background: var(--surface-2);
  }
  .eixos-tag {
    font-family: var(--font-mono); font-size: 10px; font-weight: 700;
    letter-spacing: .11em; text-transform: uppercase; color: var(--accent);
  }
  .eixo { display: flex; flex-direction: column; gap: var(--s3); }
  .eixo .step-h h3 { margin: 0; font-size: var(--t-base); font-weight: 650; }

  /* ============ RESUMO DO TEMA, NO GUIA ============ */
  .tema { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
  .tema-tag {
    font-family: var(--font-mono); font-size: 10px; font-weight: 700;
    letter-spacing: .11em; text-transform: uppercase; color: var(--ink-3);
  }
  .tema-chips { display: flex; gap: var(--s1); flex-wrap: wrap; }
  .tema-chip {
    font-size: var(--t-base); font-weight: 650; color: var(--accent);
    background: var(--accent-suave); border: 1px solid var(--accent-linha);
    border-radius: 99px; padding: 3px var(--s3);
  }

  /* etapa 5: os dois caminhos em cima, o material do assunto embaixo */
  .rsolo { padding: var(--s5); display: flex; flex-direction: column; gap: var(--s6); }
  .rduo { display: grid; grid-template-columns: repeat(auto-fit, minmax(304px,1fr)); gap: var(--s6); }
  .decisao {
    background: var(--surface-2); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: var(--r-sm);
    padding: var(--s4); gap: var(--s3);
  }
  .decisao > h3 { font-size: var(--t-md); }

  .rbody { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); }
  @media (max-width: 820px) { .rbody { grid-template-columns: 1fr; } }
  .rcol { padding: var(--s5); display: flex; flex-direction: column; gap: var(--s5); }
  .rcol + .rcol { border-left: 1px solid var(--line); background: var(--surface-3); }
  @media (max-width: 820px) { .rcol + .rcol { border-left: 0; border-top: 1px solid var(--line); } }

  .block { display: flex; flex-direction: column; gap: var(--s2); }
  .block > h3 { font-size: var(--t-base); font-weight: 650; margin: 0; color: var(--ink); }
  .block > p.txt { margin: 0; font-size: var(--t-base); color: var(--ink-2); line-height: 1.5; }

  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s2); counter-reset: s; }
  .steps li { display: flex; gap: var(--s3); font-size: var(--t-base); color: var(--ink-2); line-height: 1.5; counter-increment: s; }
  .steps li::before {
    content: counter(s); flex: 0 0 auto;
    font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--accent);
    background: var(--accent-suave); border: 1px solid var(--accent-linha);
    width: 19px; height: 19px; display: grid; place-items: center; border-radius: var(--r-sm); margin-top: 2px;
  }
  .steps li strong { color: var(--ink); font-weight: 600; }

  .bul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .bul li { font-size: var(--t-base); color: var(--ink-2); padding-left: var(--s3); position: relative; line-height: 1.5; }
  .bul li::before { content: ""; position: absolute; left: 0; top: 9px; width: 5px; height: 1px; background: var(--line-forte); }
  .bul li strong { color: var(--ink); font-weight: 600; }

  .kv { display: flex; flex-direction: column; gap: var(--s2); }
  .kv-row { display: grid; grid-template-columns: 78px minmax(0,1fr); gap: var(--s3); align-items: baseline; }
  .kv-k { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .kv-v { font-size: var(--t-base); color: var(--ink); }

  .doclist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
  .doclist a {
    display: block; font-size: var(--t-sm); color: var(--ink-2); text-decoration: none;
    padding: 5px var(--s2); border-radius: var(--r-sm); border: 1px solid transparent; line-height: 1.4;
  }
  .doclist a:hover { color: var(--accent); background: var(--accent-suave); border-color: var(--accent-linha); }
  .doclist a::before { content: "↗"; color: var(--ink-3); font-size: 10px; margin-right: 6px; }

  .cases { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s2); }
  .case {
    border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface);
    padding: var(--s3); display: flex; flex-direction: column; gap: 5px;
  }
  .case-s { font-size: var(--t-base); font-weight: 650; color: var(--ink); }
  .case-c { font-size: var(--t-sm); color: var(--ink-2); line-height: 1.5; }
  .case-c em { color: var(--ink-3); font-style: normal; font-family: var(--font-mono); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; }
  .case a { font-size: var(--t-sm); color: var(--accent); text-decoration: none; font-weight: 600; }
  .case a:hover { text-decoration: underline; text-underline-offset: 3px; }

  .tags { display: flex; flex-wrap: wrap; gap: var(--s1); }
  .tag {
    font-family: var(--font-mono); font-size: var(--t-xs); color: var(--ink-2);
    background: var(--ground); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 2px 6px;
  }
  .microhint { font-size: var(--t-xs); color: var(--ink-3); line-height: 1.45; }

  /* ============ FOLLOW-UP ============ */
  .fup { display: flex; flex-direction: column; }
  .fnode {
    border: 1px solid var(--line); border-left: 3px solid var(--line-forte);
    border-radius: var(--r); background: var(--surface);
    padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s3);
  }
  .fnode.on { border-left-color: var(--accent); border-color: var(--accent-linha); }
  .fnode.spent { opacity: .5; }
  .fnode-h { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  .fnode-h .ft { font-size: var(--t-md); font-weight: 650; }
  .fnode-h .fw { font-family: var(--font-mono); font-size: var(--t-micro); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
  .branches { display: grid; grid-template-columns: repeat(auto-fit, minmax(228px,1fr)); gap: var(--s2); }
  .branch {
    border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2);
    padding: var(--s3); display: flex; flex-direction: column; gap: 6px;
  }
  .branch .bl { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .branch .bt { font-size: var(--t-base); color: var(--ink-2); line-height: 1.5; }
  .branch .bt strong { color: var(--ink); font-weight: 600; }
  .branch.yes { border-color: color-mix(in srgb, var(--calm) 28%, transparent); background: var(--calm-bg); }
  .branch.yes .bl { color: var(--calm); }
  .branch.no { border-color: color-mix(in srgb, var(--warn) 28%, transparent); background: var(--warn-bg); }
  .branch.no .bl { color: var(--warn); }
  .fconn { align-self: center; color: var(--line-forte); font-size: var(--t-md); line-height: 1; padding: var(--s2) 0; }
  .clock {
    font-family: var(--font-mono); font-size: var(--t-sm); font-variant-numeric: tabular-nums;
    color: var(--ink); background: var(--surface); border: 1px solid var(--line-forte);
    border-radius: var(--r-sm); padding: 2px 7px; display: inline-block;
  }

  /* ============ BLOQUEIO E VAZIO ============ */
  .lock {
    border: 1px dashed var(--line-forte); border-radius: var(--r); padding: var(--s6) var(--s5);
    background: var(--surface-2); display: flex; flex-direction: column; gap: var(--s3); align-items: flex-start;
  }
  .lock p { margin: 0; font-size: var(--t-base); color: var(--ink-2); max-width: 64ch; line-height: 1.55; }
  .lock ol { margin: 0; padding-left: var(--s5); font-size: var(--t-base); color: var(--ink-3); display: flex; flex-direction: column; gap: var(--s1); }
  .lock code { font-family: var(--font-mono); font-size: var(--t-sm); }
  .empty {
    border: 1px dashed var(--line-forte); border-radius: var(--r); padding: var(--s7) var(--s5);
    text-align: center; color: var(--ink-3); font-size: var(--t-base); background: var(--surface-2);
  }

  /* ============ GAVETA DA DOCUMENTACAO ============ */
  .gaveta { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: flex-end; }
  .gaveta[hidden] { display: none; }
  .gaveta-fundo { position: absolute; inset: 0; background: rgba(20,12,28,.55); }
  .gaveta-painel {
    position: relative; width: min(780px, 100%); height: 100%;
    background: var(--surface); border-left: 1px solid var(--accent-linha);
    box-shadow: -18px 0 56px -28px rgba(0,0,0,.55);
    display: flex; flex-direction: column;
  }
  @media (max-width: 860px) { .gaveta-painel { width: 100%; border-left: 0; } }
  .gaveta-topo {
    display: flex; align-items: flex-start; gap: var(--s4);
    padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line);
    background: var(--surface-2); flex: 0 0 auto;
  }
  .gaveta-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .gaveta-id strong { font-size: var(--t-md); font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .gaveta-acoes { display: flex; gap: var(--s1); margin-left: auto; flex: 0 0 auto; }
  .gaveta-acoes .btn { text-decoration: none; white-space: nowrap; }
  .gaveta-nota { margin: 0; padding: 6px var(--s4); font-size: var(--t-xs); color: var(--ink-3); border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  #gaveta-frame { flex: 1 1 auto; width: 100%; border: 0; background: var(--surface); }
  body.gaveta-aberta { overflow: hidden; }

  /* ============ NAVEGACAO ENTRE PASSOS ============ */
  .passos {
    display: flex; align-items: center; gap: var(--s4);
    padding-top: var(--s5); border-top: 1px solid var(--line);
  }
  .passos .btn { min-width: 132px; justify-content: center; }
  .passos-onde {
    margin-inline: auto; font-family: var(--font-mono); font-size: var(--t-xs);
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
    text-align: center; order: 0;
  }
  .passos .btn[disabled] { opacity: .4; cursor: not-allowed; }
  .passos .btn[disabled]:hover { background: var(--accent); border-color: var(--accent); }
  .passos .btn.ghost[disabled]:hover { background: transparent; border-color: var(--line-forte); color: var(--ink-2); }
  @media (max-width: 560px) {
    .passos { flex-wrap: wrap; }
    .passos-onde { order: -1; flex: 1 0 100%; margin: 0 0 var(--s2); text-align: left; }
    .passos .btn { flex: 1 1 auto; min-width: 0; }
  }

  /* ============ CONTEXTO DENTRO DA ETAPA 2 ============ */
  .ctx {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
    gap: var(--s4); padding: var(--s4);
    background: var(--surface-2); border: 1px solid var(--line);
    border-left: 3px solid var(--accent-linha); border-radius: var(--r-sm);
  }
  .ctx-tag {

<!-- Captura erro de sintaxe do conteudo.js para poder avisar em tela.
     Precisa vir ANTES do conteudo.js. -->
<script>
  window.__erroConteudo = null;
  window.addEventListener("error", function (e) {
    if (!window.__erroConteudo && e.filename && e.filename.indexOf("conteudo.js") !== -1) {
      window.__erroConteudo = { msg: e.message || "", linha: e.lineno || 0 };
    }
  });
</script>
<script src="conteudo.js"></script>
<script>
"use strict";

/* ---------- rede de segurança ----------
   Se o conteudo.js tiver erro de sintaxe, o navegador aborta o arquivo
   inteiro e nenhuma das listas existe. Sem isso, a tela ficaria vazia
   e ninguém saberia por quê. */
(function () {
  var faltando = [];
  if (typeof D === "undefined") faltando.push("D");
  if (typeof ETAPAS === "undefined") faltando.push("ETAPAS");
  if (typeof PORTOES === "undefined") faltando.push("PORTOES");
  if (typeof TEMPOS === "undefined") faltando.push("TEMPOS");
  if (typeof CATEGORIAS === "undefined") faltando.push("CATEGORIAS");
  if (typeof MODULOS === "undefined") faltando.push("MODULOS");
  if (typeof FUP === "undefined") faltando.push("FUP");
  if (typeof TEXTOS === "undefined") faltando.push("TEXTOS");
  if (typeof AVALIACAO === "undefined") faltando.push("AVALIACAO");
  if (!faltando.length) return;

  var REPO = "https://github.com/murilobolzan/playbook-atendimento";
  var err = window.__erroConteudo || {};
  var linha = err.linha > 0 ? err.linha : 0;

  var pista = linha
    ? "O navegador parou na <strong>linha " + linha + "</strong> do <code>conteudo.js</code>. " +
      "Atenção: quando falta vírgula, o erro real fica na <strong>linha de cima</strong> — " +
      "confira a " + (linha - 1) + " antes da " + linha + "."
    : "O arquivo <code>conteudo.js</code> não carregou.";

  var msg = err.msg ? '<p class="err-tec">' + err.msg.replace(/</g, "&lt;") + "</p>" : "";

  var linkArquivo = REPO + "/blob/main/conteudo.js" + (linha ? "#L" + linha : "");
  var linkHist = REPO + "/commits/main/conteudo.js";

  document.body.innerHTML =
    '<div class="errbox">' +
      '<span class="err-tag">Playbook fora do ar</span>' +
      "<h1>O conteúdo não carregou</h1>" +
      "<p>" + pista + " Quase sempre é uma destas quatro coisas na última edição:</p>" +
      "<ol>" +
        "<li><strong>Vírgula faltando</strong> no fim de um item da lista. Todo item leva vírgula, menos o último.</li>" +
        "<li><strong>Aspas abertas e não fechadas</strong> em alguma frase.</li>" +
        "<li><strong>Chave <code>{</code> ou colchete <code>[</code></strong> sem o par de fechamento.</li>" +
        "<li>Uma <strong>tag <code>&lt;strong&gt;</code></strong> sem a barra no fechamento.</li>" +
      "</ol>" +
      msg +
      '<div class="err-acoes">' +
        '<a class="err-btn" href="' + linkArquivo + '" target="_blank" rel="noopener">Abrir o conteudo.js' + (linha ? " na linha " + linha : "") + "</a>" +
        '<a class="err-btn ghost" href="' + linkHist + '" target="_blank" rel="noopener">Voltar para a versão anterior</a>' +
      "</div>" +
      '<p class="err-nota">Para desfazer: abra o histórico, entre no último commit e use <strong>Revert</strong>. ' +
      "O playbook volta ao ar em cerca de 40 segundos.</p>" +
      '<p class="err-nota">Listas que não chegaram: <code>' + faltando.join("</code>, <code>") + "</code></p>" +
    "</div>";

  var css = document.createElement("style");
  css.textContent =
    ".errbox{max-width:60ch;margin:9vh auto;padding:0 24px;font-family:var(--font-ui)}" +
    ".errbox h1{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:10px 0 14px}" +
    ".errbox p{font-size:15px;line-height:1.6;color:var(--ink-2);margin:0 0 14px}" +
    ".errbox ol{font-size:14.5px;line-height:1.6;color:var(--ink-2);padding-left:20px;margin:0 0 16px;" +
      "display:flex;flex-direction:column;gap:7px}" +
    ".errbox strong{color:var(--ink)}" +
    ".errbox code{font-family:var(--font-mono);font-size:13px;background:var(--surface);" +
      "border:1px solid var(--line);border-radius:2px;padding:1px 5px}" +
    ".err-tag{font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;" +
      "text-transform:uppercase;color:var(--crit);background:var(--crit-bg);" +
      "border:1px solid var(--crit);border-radius:2px;padding:3px 8px;display:inline-block}" +
    ".err-tec{font-family:var(--font-mono);font-size:12.5px;color:var(--crit);background:var(--crit-bg);" +
      "border:1px solid var(--line);border-left:3px solid var(--crit);border-radius:2px;" +
      "padding:10px 12px;overflow-x:auto;white-space:pre-wrap}" +
    ".err-acoes{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}" +
    ".err-btn{font-size:13.5px;font-weight:600;text-decoration:none;border-radius:2px;padding:8px 14px;" +
      "background:var(--wine);color:var(--on-wine);border:1px solid var(--wine)}" +
    ".err-btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-strong);font-weight:500}" +
    ".err-nota{font-size:12.5px;color:var(--ink-3)}";
  document.head.appendChild(css);

  throw new Error("conteudo.js nao carregou: " + faltando.join(", "));
})();

/* ═══════════════════════════════════════════════════════════════════════════
   MOTOR — lê tudo de conteudo.js. Não precisa editar nada aqui.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ---------- estado ---------- */
const state = {
  tempo:"novo",
  feito:{ ia:false, problema:false, ticket:false },
  aba:1,
  cat:null, mod:null,
  secao:"guia",
  sub:null,
  busca:"",
  abertos:{},
  fup:"pendente",
  fup2_em:null,
  fup2_limite:null
};

/* ---------- helpers ---------- */
const el = (t,c,h) => { const n = document.createElement(t); if (c) n.className = c; if (h !== undefined) n.innerHTML = h; return n; };
const src = (n,s) => { n.setAttribute("data-src", s); return n; };
const cat = id => CATEGORIAS.find(c => c.id === id);
const mod = id => MODULOS.find(m => m.id === id);
const portoesOk = () => state.feito.ia && state.feito.problema && state.feito.ticket;
const hhmm = d => String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");

/* ---------- gaveta da documentação ----------
   Abre a documentação por cima do playbook, preservando o estado do
   atendimento. Ctrl+clique e clique do meio continuam abrindo em nova aba. */
function abrirDoc(url, titulo, ehPergunta) {
  document.getElementById("gaveta-eyebrow").textContent = ehPergunta ? TEXTOS.docPergunta : TEXTOS.docTitulo;
  document.getElementById("gaveta-titulo").textContent = titulo;
  document.getElementById("gaveta-nova-aba").href = url;
  document.getElementById("gaveta-frame").src = url;
  document.getElementById("gaveta").hidden = false;
  document.body.classList.add("gaveta-aberta");
  document.getElementById("gaveta-fechar").focus();
}

function fecharDoc() {
  document.getElementById("gaveta").hidden = true;
  document.getElementById("gaveta-frame").src = "about:blank";
  document.body.classList.remove("gaveta-aberta");
}

/* liga um link para abrir na gaveta em vez de trocar de página */
function linkDoc(a, url, titulo) {
  a.href = url;
  a.rel = "noopener";
  a.target = "_blank";
  a.addEventListener("click", function (e) {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;
    e.preventDefault();
    abrirDoc(url, titulo, false);
  });
  return a;
}

function perguntarIA() {
  const campo = document.getElementById("q-ia");
  const q = campo ? campo.value.trim() : "";
  const url = q ? D + "?ask=" + encodeURIComponent(q) : D;
  abrirDoc(url, q || TEXTOS.docTitulo, !!q);
}

/* o painel de dúvida mora dentro do guia, que é onde a solução acontece */
function blocoDuvida() {
  const box = src(el("section","panel duvida"), "[10] duvida* + busca*");

  const h = el("div","panel-h");
  h.append(el("span","eyebrow duvida-tag", TEXTOS.duvidaTag));
  h.append(el("h3","duvida-titulo", TEXTOS.railBusca));
  box.append(h);

  const b = el("div","panel-b");
  b.append(el("p","duvida-hint", TEXTOS.buscaHint));

  const cx = el("div","search");
  const inp = document.createElement("input");
  inp.type = "search";
  inp.id = "q-ia";
  inp.autocomplete = "off";
  inp.placeholder = TEXTOS.buscaPlaceholder;
  inp.setAttribute("aria-label", TEXTOS.railBusca);
  inp.value = state.perguntaIA || "";
  inp.addEventListener("input", () => { state.perguntaIA = inp.value; });
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); perguntarIA(); } });
  cx.append(inp);
  b.append(cx);

  const bt = el("button","btn cheio", TEXTOS.buscaBotao);
  bt.type = "button";
  bt.onclick = perguntarIA;
  b.append(bt);

  b.append(el("p","duvida-rodape", TEXTOS.duvidaRodape));
  box.append(b);
  return box;
}

/* troca {espera}, {limite}, {total} e {falta} pelos valores reais */
function fmt(s, extra) {
  const v = Object.assign({
    espera: FUP.esperaMin,
    limite: FUP.limiteMin,
    total: FUP.esperaMin + FUP.limiteMin
  }, extra || {});
  return String(s).replace(/\{(\w+)\}/g, (m,k) => (k in v ? v[k] : m));
}


/* ---------- textos fixos da moldura ---------- */
function renderMoldura() {
  document.getElementById("t-marca").textContent = TEXTOS.marca;
  document.getElementById("t-titulo").textContent = TEXTOS.titulo;
  document.getElementById("t-sub").textContent = TEXTOS.subtitulo;
  document.getElementById("t-busca-dica").textContent = TEXTOS.buscaGlobalDica;
  document.getElementById("q").placeholder = TEXTOS.buscaGlobalPlaceholder;
  document.getElementById("q").setAttribute("aria-label", TEXTOS.buscaGlobalPlaceholder);
  document.getElementById("btn-limpa").setAttribute("aria-label", TEXTOS.buscaLimpar);
  document.getElementById("btn-limpa").hidden = !state.busca;
  document.getElementById("reset").textContent = TEXTOS.rodapeBotao;
  document.getElementById("t-rodape").innerHTML = TEXTOS.rodapeAviso;

  /* a navegação por etapa só faz sentido dentro do guia */
  const passos = document.getElementById("passos");
  const noGuia = state.secao === "guia" && !state.busca;
  passos.hidden = !noGuia;
  if (noGuia) {
    const voltar = document.getElementById("btn-voltar");
    const avancar = document.getElementById("btn-avancar");
    voltar.textContent = TEXTOS.navVoltar;
    avancar.textContent = TEXTOS.navAvancar;
    voltar.disabled = state.aba <= 1;
    avancar.disabled = state.aba >= ETAPAS.length;
    document.getElementById("t-onde").textContent =
      fmt(TEXTOS.navOnde, { atual: state.aba, total: ETAPAS.length });
  }
}

/* ---------- o que aparece na área de conteúdo ---------- */
function renderAbaVisivel() {
  const buscando = !!state.busca;
  const guia = !buscando && state.secao === "guia";
  const mapa = {
    busca: buscando,
    flow: guia && state.aba <= 3,
    out:  guia && state.aba === 4,
    fup:  guia && state.aba === 5,
    aval: !buscando && state.secao === "criterios",
    resp: !buscando && state.secao === "respostas"
  };
  for (const id in mapa) document.getElementById(id).hidden = !mapa[id];
}

function irParaSecao(secao, extra) {
  state.secao = secao;
  state.busca = "";
  document.getElementById("q").value = "";
  if (secao === "guia" && extra) state.aba = extra;
  if (secao === "respostas" && extra) state.sub = extra;
  fecharMenu();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function irParaAba(n) {
  state.secao = "guia";
  state.aba = Math.min(Math.max(n, 1), ETAPAS.length);
  fecharMenu();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function fecharMenu() {
  document.body.classList.remove("menu-aberto");
  document.getElementById("btn-menu").setAttribute("aria-expanded", "false");
}

/* ---------- altura do topo fixo ----------
   O trilho da esquerda gruda logo abaixo do cabeçalho. Medir em vez de
   chutar evita que ele passe por baixo quando o texto quebra linha. */
function medirTopo() {
  const topo = document.querySelector(".topbar");
  if (!topo) return;
  const h = Math.round(topo.getBoundingClientRect().height);
  if (h > 0) document.documentElement.style.setProperty("--stick", h + "px");
}

let observadorTopo = null;   /* guardar a referência: observador sem dono pode ser coletado */

function observarTopo() {
  const topo = document.querySelector(".topbar");
  if (!topo || typeof ResizeObserver === "undefined") return;
  observadorTopo = new ResizeObserver(medirTopo);
  observadorTopo.observe(topo);
}

/* ---------- barra lateral ---------- */
function renderSidebar() {
  const host = document.getElementById("side-nav");
  host.textContent = "";

  /* grupo 1: o guia, etapa por etapa */
  const g1 = el("div","nav-grupo");
  g1.append(el("span","nav-titulo", TEXTOS.navGuia));
  ETAPAS.forEach((titulo, i) => {
    const n = i + 1;
    const concluida = n <= 3 && state.feito[PORTOES[n-1].id];
    const atual = state.secao === "guia" && !state.busca && n === state.aba;
    const trancada = n >= 4 && !portoesOk();
    const b = el("button","nav-item" + (atual ? " on" : "") + (concluida && !atual ? " ok" : ""));
    b.type = "button";
    b.disabled = trancada;
    b.title = trancada ? titulo + " — " + TEXTOS.spineTrancada : titulo;
    b.append(el("span","nav-n", concluida && !atual ? "✓" : String(n)), el("span","nav-txt", titulo));
    b.onclick = () => { if (!trancada) irParaAba(n); };
    g1.append(b);
  });
  host.append(g1);

  /* grupo 2: a régua de avaliação */
  const g2 = el("div","nav-grupo");
  g2.append(el("span","nav-titulo", TEXTOS.navCriterios));
  const bc = el("button","nav-item" + (state.secao === "criterios" && !state.busca ? " on" : ""));
  bc.type = "button";
  bc.append(el("span","nav-txt", AVALIACAO.aba));
  bc.onclick = () => irParaSecao("criterios");
  g2.append(bc);
  host.append(g2);

  /* grupo 3: as respostas rápidas, aba por aba */
  const g3 = el("div","nav-grupo");
  g3.append(el("span","nav-titulo", TEXTOS.navRespostas));
  RESPOSTAS.forEach(a => {
    const temSelecionada = a.subs.some(x => x.id === state.sub);
    const aberto = state.abertos[a.id] !== undefined
      ? state.abertos[a.id]
      : (temSelecionada && state.secao === "respostas");

    const pai = el("button","nav-item nav-pai");
    pai.type = "button";
    pai.setAttribute("aria-expanded", String(aberto));
    const total = a.subs.reduce((s,x) => s + x.itens.length, 0);
    pai.append(el("span","nav-seta","▶"), el("span","nav-txt", a.aba), el("span","nav-conta", String(total)));
    pai.onclick = () => { state.abertos[a.id] = !aberto; render(); };
    g3.append(pai);

    if (aberto) {
      const filhos = el("div","nav-filhos");
      a.subs.forEach(x => {
        const atual = state.secao === "respostas" && !state.busca && state.sub === x.id;
        const vazia = x.itens.length === 0;
        const b = el("button","nav-item" + (atual ? " on" : "") + (vazia ? " nav-vazia" : ""));
        b.type = "button";
        b.append(el("span","nav-txt", x.sub));
        if (!vazia) b.append(el("span","nav-conta", String(x.itens.length)));
        b.onclick = () => irParaSecao("respostas", x.id);
        filhos.append(b);
      });
      g3.append(filhos);
    }
  });
  host.append(g3);
}
/* ---------- etapas 1 a 3 ---------- */
function renderFlow() {
  const host = document.getElementById("flow");
  host.textContent = "";
  if (state.aba > 3) return;

  const i = state.aba - 1;
  const p = PORTOES[i];
  const feito = state.feito[p.id];

  const card = src(el("div", "stage is-active" + (feito ? " is-done" : "")), "[3] PORTOES");

  const head = el("div", "st-head");
  head.append(el("span","st-n", feito ? "✓" : String(i+1)));
  head.append(el("span","st-title", p.titulo));
  head.append(el("span","st-sub", feito ? TEXTOS.etapaConcluida : ""));
  card.append(head);

  const body = el("div","st-body");
  body.append(el("p","lead", p.lead));

  const ul = el("ul","checklist");
  p.itens.forEach(x => ul.append(el("li","",x)));
  body.append(ul);

  /* a classificação do ticket acontece aqui, na etapa que cria o ticket */
  if (p.id === "ticket") body.append(blocoEixos());


  const stop = el("div","callout c-stop");
  stop.append(el("span","ch", TEXTOS.etapaNaoFaca));
  const su = el("ul");
  p.nunca.forEach(x => su.append(el("li","",x)));
  stop.append(su);
  body.append(stop);

  const adv = el("div","advance");
  const temaFalta = p.id === "ticket" && (!state.cat || !state.mod);
  const b = el("button","btn", (feito ? "✓ " : "") + p.cta);
  b.type = "button";
  b.disabled = temaFalta;
  b.onclick = () => { state.feito[p.id] = true; irParaAba(state.aba + 1); };
  adv.append(b, el("span","why", temaFalta ? TEXTOS.eixoFaltaBotao : p.why));
  body.append(adv);

  card.append(body);
  host.append(card);
}

/* tempo de plataforma do cliente — vive na etapa 5, junto da entrega.
   Mostra os dois caminhos lado a lado e destaca o escolhido. */
function blocoModoEntrega() {
  const box = src(el("div","block decisao"), "[4] TEMPOS");
  box.append(el("h3","", TEXTOS.resTempoLabel));

  const cards = el("div","modo-cards");
  cards.setAttribute("role","group");
  cards.setAttribute("aria-label", TEXTOS.resTempoLabel);
  TEMPOS.forEach(o => {
    const sel = state.tempo === o.id;
    const b = el("button","modo-card" + (sel ? " on" : ""));
    b.type = "button";
    b.setAttribute("aria-pressed", String(sel));
    b.append(
      el("span","modo-rot", o.rot),
      el("span","modo-modo", o.modo),
      el("span","modo-txt", o.txt)
    );
    b.onclick = () => { state.tempo = o.id; render(); };
    cards.append(b);
  });

  box.append(cards, el("span","microhint", TEXTOS.resTempoHint));
  return box;
}

/* eyebrow em branco simplesmente nao aparece */

/* um card de resposta, com botão de copiar */
function cardResposta(item, aba, sub, destacar) {
  const card = el("article","rcard" + (item.interno ? " interno" : ""));

  const topo = el("header","rcard-h");
  const cam = el("span","rcard-caminho", aba + " › " + sub);

  const pe = el("footer","rcard-pe");

  copiar.type = "button";
  copiar.onclick = () => copiarResposta(item, copiar);

    const tw = el("div","tags");
    item.tags.forEach(t => tw.append(el("span","tag", t)));
    pe.append(tw);
  }
  card.append(pe);
  return card;
}

/* copia o texto limpo, sem as marcações de negrito */
function copiarResposta(item, botao) {
  const txt = item.resposta.map(p => p.replace(/<[^>]+>/g, "").replace(/&gt;/g, ">").replace(/&lt;/g, "<").replace(/&amp;/g, "&")).join("\n\n");
  const feito = () => {
    botao.textContent = TEXTOS.respCopiado;
    setTimeout(() => { botao.textContent = TEXTOS.respCopiar; }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(feito, () => copiaAntiga(txt, feito));
  } else {
    copiaAntiga(txt, feito);
  }
}

function copiaAntiga(txt, feito) {
  const ta = document.createElement("textarea");
  ta.value = txt;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); feito(); } catch (e) { /* sem clipboard: o texto fica na tela mesmo */ }
  document.body.removeChild(ta);
}

/* ---------- busca global ----------
   Procura em título, corpo, tags, nome da aba e da sub-aba, e também nas
   etapas do guia e nos critérios de avaliação. */
const INDICE = [];

function montarIndice() {
  INDICE.length = 0;

  RESPOSTAS.forEach(a => a.subs.forEach(s => s.itens.forEach(it => {
    INDICE.push({
      tipo: "resposta",
      rotulo: it.titulo,
      onde: a.aba + " › " + s.sub,
      hay: norm([it.titulo, a.aba, s.sub, (it.tags || []).join(" "), it.resposta.join(" ")].join(" ")),
      ir: () => irParaSecao("respostas", s.id),
      item: it, aba: a.aba, sub: s.sub
    });
  })));

  PORTOES.forEach((p, i) => INDICE.push({
    tipo: "guia",
    rotulo: p.titulo,
    onde: fmt(TEXTOS.navOnde, { atual: i + 1, total: ETAPAS.length }),
    hay: norm([p.titulo, p.lead, p.itens.join(" "), p.nunca.join(" "), p.cta, p.why].join(" ")),
    ir: () => irParaAba(i + 1)
  }));

  MODULOS.forEach(m => m.casos.forEach(k => INDICE.push({
    tipo: "caso",
    rotulo: k.s,
    onde: TEXTOS.buscaCasoEm + " " + m.nome,
    hay: norm([k.s, k.c, m.nome, m.area].join(" ")),
    ir: () => { state.mod = m.id; irParaAba(portoesOk() ? 4 : 3); }
  })));

  AVALIACAO.grupos.forEach(g => g.criterios.forEach(c => INDICE.push({
    tipo: "criterio",
    rotulo: c.n + ". " + c.nome,
    onde: g.nome,
    hay: norm([c.nome, g.nome, c.observar, c.niveis.join(" ")].join(" ")),
    ir: () => irParaSecao("criterios")
  })));
}

/* envolve o que casou com a busca, para o olho achar na hora */
function realce(html, termo) {
  if (!termo) return html;
  const palavras = termo.split(/\s+/).filter(p => p.length >= 2);
  if (!palavras.length) return html;
  /* trabalha só fora das tags, para não quebrar o <strong> */
  return html.replace(/>?([^<>]+)</g, (m, texto) => m.replace(texto, marcaTexto(texto, palavras)));
}

function marcaTexto(texto, palavras) {
  let saida = "";
  let i = 0;
  const alvo = norm(texto);
  while (i < texto.length) {
    let achou = null;
    palavras.forEach(p => {
      const pos = alvo.indexOf(p, i);
      if (pos >= 0 && (!achou || pos < achou.pos)) achou = { pos, len: p.length };
    });
    if (!achou) { saida += texto.slice(i); break; }
    saida += texto.slice(i, achou.pos) + "<mark>" + texto.slice(achou.pos, achou.pos + achou.len) + "</mark>";
    i = achou.pos + achou.len;
  }
  return saida;
}

function renderBusca() {
  const host = document.getElementById("busca");
  host.textContent = "";
  if (!state.busca) return;

  const termo = norm(state.busca);
  const palavras = termo.split(/\s+/).filter(Boolean);
  const achados = INDICE.filter(i => palavras.every(p => i.hay.includes(p)));

  const wrap = el("div","result");
  const head = el("div","rhead");
  head.append(el("span","eyebrow", TEXTOS.buscaEyebrow));
  head.append(el("h2","rtitle", fmt(TEXTOS.buscaTitulo, { n: achados.length, termo: state.busca })));
  wrap.append(head);

  const corpo = el("div","rsolo");

  if (!achados.length) {
    corpo.append(el("div","empty", TEXTOS.buscaNada));
  } else {
    /* as respostas prontas vêm primeiro: é o que resolve o atendimento */
    const respostas = achados.filter(a => a.tipo === "resposta");
    const outros = achados.filter(a => a.tipo !== "resposta");

    if (respostas.length) {
      const bloco = el("section","grupo");
      bloco.append(el("h3","grupo-nome", fmt(TEXTOS.buscaGrupoRespostas, { n: respostas.length })));
      respostas.forEach(a => bloco.append(cardResposta(a.item, a.aba, a.sub, termo)));
      corpo.append(bloco);
    }

    if (outros.length) {
      const bloco = el("section","grupo");
      bloco.append(el("h3","grupo-nome", fmt(TEXTOS.buscaGrupoOutros, { n: outros.length })));
      const lista = el("div","achado-lista");
      outros.forEach(a => {
        const b = el("button","achado");
        b.type = "button";
        b.append(el("span","achado-tipo", TEXTOS.buscaTipos[a.tipo] || a.tipo));
        b.append(el("span","achado-rot", realce(a.rotulo, termo)));
        b.append(el("span","achado-onde", a.onde));
        b.onclick = a.ir;
        lista.append(b);
      });
      bloco.append(lista);
      corpo.append(lista.children.length ? bloco : el("span"));
    }
  }

  /* saída sempre disponível: perguntar para a IA da documentação */
  const saida = el("div","busca-ia");
  saida.append(el("p","", TEXTOS.buscaSemSorte));
  const b = el("button","btn sm", TEXTOS.buscaBotao);
  b.type = "button";
  b.onclick = () => {
    const url = D + "?ask=" + encodeURIComponent(state.busca);
    abrirDoc(url, state.busca, true);
  };
  saida.append(b);
  corpo.append(saida);

  wrap.append(corpo);
  host.append(wrap);
}

  render();
}

/* atalho: barra ou Ctrl+K colocam o cursor na busca */
document.addEventListener("keydown", (e) => {
  const digitando = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if ((e.key === "/" && !digitando) || ((e.ctrlKey || e.metaKey) && e.key === "k")) {
    e.preventDefault();
    document.getElementById("q").focus();
    document.getElementById("q").select();
  }
});

/* ---- menu no celular ---- */
document.getElementById("btn-menu").addEventListener("click", () => {
  const aberto = document.body.classList.toggle("menu-aberto");
  document.getElementById("btn-menu").setAttribute("aria-expanded", String(aberto));
});
document.getElementById("veu").addEventListener("click", fecharMenu);

/* ---- gaveta da documentacao ---- */
document.getElementById("gaveta-fechar").addEventListener("click", fecharDoc);
document.getElementById("gaveta-fundo").addEventListener("click", fecharDoc);

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!document.getElementById("gaveta").hidden) { fecharDoc(); return; }
  if (document.body.classList.contains("menu-aberto")) fecharMenu();
});

/* ---- navegacao entre etapas ---- */
document.getElementById("btn-voltar").addEventListener("click", () => irParaAba(state.aba - 1));
document.getElementById("btn-avancar").addEventListener("click", () => irParaAba(state.aba + 1));

document.getElementById("reset").addEventListener("click", () => {
  state.feito = { ia:false, problema:false, ticket:false };
  state.secao = "guia";
  state.aba = 1;
  state.cat = null; state.mod = null;
  state.sub = null;
  state.busca = "";
  document.getElementById("q").value = "";
  resetFup();
  render();
  window.scrollTo({ top:0, behavior:"smooth" });
});

render();
</script>
